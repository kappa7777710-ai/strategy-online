a name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Энергосистема · Вариант 5 · Журнал<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>/* Общие стили демо-страниц энергосистемы: палитра игры (css/base.css), панель демо-управления,\n   вкладки периодов, подсказки графиков. Каждый вариант добавляет свои стили поверх. */\n:root{\n  color-scheme:dark;\n  --bg:#0A0D18;--panel:#12172A;--card:#171D33;--card-hover:#1E2640;--border:#293150;--border-strong:#3A4468;\n  --text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;\n  --tier0:#4FD1E7;--tier1:#F2A93B;--energy:#FFDD57;--water:#49B8F0;--good:#4ADE9B;--bad:#F4557B;--skill:#B388FF;--ink:#0A0D18;\n  --supply:#4ADE9B;--prod:#FFDD57;--batt:#4FD1E7;--demand:#B9C2E0;\n  --en-grid:rgba(255,255,255,.07);--en-night:rgba(4,7,20,.55);\n  --font-display:'Rajdhani',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;\n}\n*{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.45;}\nbutton{font:inherit;color:inherit;}\n.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.en-page{max-width:1240px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:16px;}\n.en-eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}\n.en-h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:.01em;}\n.en-sub{font-size:13px;color:var(--text-secondary);margin:4px 0 0;max-width:78ch;}\n.en-back{display:inline-block;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:6px;}\n.en-back:hover{color:var(--text-primary);}\n\n/* панель демо-управления */\n.en-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:9px 14px;border-radius:12px;background:linear-gradient(180deg,#1A2143,#0E1328);border:1px solid #2B3563;}\n.en-ctl-g{display:flex;align-items:center;gap:9px;}\n.en-ctl-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}\n.en-btns{display:inline-flex;gap:4px;flex-wrap:wrap;}\n.en-btn{font-family:var(--font-mono);font-size:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;}\n.en-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-btn.active{background:var(--skill);border-color:var(--skill);color:#0A0D18;}\n.en-btn:focus-visible,.en-tab:focus-visible,.en-chip:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.en-ctl-clock{margin-left:auto;}\n.en-ctl-clock b{font-size:14px;font-weight:500;color:var(--text-primary);}\n\n/* вкладки периодов */\n.en-tabs{display:flex;gap:4px;flex-wrap:wrap;}\n.en-tab{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;\n  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;}\n.en-tab:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}\n\n/* графики */\n.en-chartbox{width:100%;}\n.en-chartbox canvas{display:block;touch-action:pan-y;}\n.en-tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;max-width:260px;padding:8px 10px;border-radius:8px;background:rgba(10,13,24,.96);border:1px solid var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:12px;}\n.en-tip[hidden]{display:none;}\n.en-tip-t{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-bottom:5px;white-space:nowrap;}\n.en-tip-row{display:flex;align-items:center;gap:7px;padding:1px 0;}\n.en-tip-row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}\n.en-tip-row span{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.en-tip-row b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap;}\n.en-tip-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}\n.en-legend{display:flex;flex-wrap:wrap;gap:5px;}\n.en-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}\n.en-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}\n.en-chip:hover{color:var(--text-primary);}\n.en-chip.off{opacity:.42;}\n.en-chip.off i{background:var(--border-strong)!important;}\n\n@media (max-width:640px){\n  .en-page{padding:14px 12px 48px;}\n  .en-h1{font-size:24px;}\n  .en-ctl{padding:9px 10px;gap:8px 14px;}\n  .en-ctl-clock{margin-left:0;}\n  .en-tab{padding:7px 11px;font-size:13px;}\n}\n@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }\n<\/style>\n<style>\n/* Вариант 5 — «Журнал»: учёт энергии в кВт·ч. Итоги периода, сравнение с прошлым, баланс, таблица по потребителям. */\n.j-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}\n.j-top .en-tabs{flex:1;}\n.j-live{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);}\n.j-live b{font-family:var(--font-mono);font-weight:500;color:var(--text-primary);}\n.j-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}\n.j-kpi{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--kc,var(--border-strong));border-radius:10px;padding:11px 13px 10px;min-width:0;}\n.j-kl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);}\n.j-kv{font-family:var(--font-mono);font-size:24px;font-weight:500;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums;}\n.j-ks{font-size:11.5px;color:var(--text-secondary);font-family:var(--font-mono);margin-top:2px;min-height:16px;}\n.j-d{font-family:var(--font-mono);font-size:11.5px;margin-top:4px;color:var(--text-muted);}\n.j-d.good{color:var(--good);} .j-d.bad{color:var(--bad);} .j-d.warn{color:#F0B93D;}\n.j-card{background:#0F1424;border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0;}\n.j-card h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.02em;}\n.j-ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}\n.j-ch h2{flex:1;min-width:180px;}\n.j-note{font-size:12px;color:var(--text-secondary);margin:2px 0 0;}\n.j-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;}\n.j-bal{display:flex;flex-direction:column;gap:10px;margin-top:10px;}\n.j-br{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;}\n.j-br span{color:var(--text-secondary);}\n.j-br .bar{height:12px;border-radius:6px;background:#0B1022;overflow:hidden;}\n.j-br .bar i{display:block;height:100%;border-radius:6px;transition:width .4s;}\n.j-br b{font-family:var(--font-mono);font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}\n.j-eq{margin-top:10px;padding:8px 11px;border-radius:9px;background:#0B1022;border:1px dashed var(--border-strong);font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);}\n.j-bstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;}\n.j-bs{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 10px;}\n.j-bs-l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}\n.j-bs-v{font-family:var(--font-mono);font-size:14px;font-weight:500;margin-top:1px;white-space:nowrap;}\n\n.j-tw{overflow-x:auto;}\n.j-table{width:100%;border-collapse:collapse;min-width:900px;font-size:12.5px;}\n.j-table th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap;cursor:pointer;user-select:none;}\n.j-table th:first-child,.j-table td:first-child{text-align:left;}\n.j-table th:hover{color:var(--text-primary);}\n.j-table th.sorted{color:var(--tier1);}\n.j-table th.nosort{cursor:default;}\n.j-table td{padding:7px 10px;text-align:right;border-bottom:1px solid rgba(41,49,80,.5);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}\n.j-table td:first-child{font-family:var(--font-body);}\n.j-table tr.src td{background:#131A30;}\n.j-table tr.tot td{background:#131A30;border-bottom:none;font-weight:500;color:var(--text-primary);}\n.j-pill{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:-1px;}\n.j-grp{display:block;font-size:10.5px;color:var(--text-muted);margin-left:17px;font-family:var(--font-body);}\n.j-share{display:inline-block;width:70px;height:6px;border-radius:3px;background:#0B1022;margin-left:8px;vertical-align:middle;overflow:hidden;}\n.j-share i{display:block;height:100%;}\n.j-spark{display:block;margin-left:auto;}\n.j-ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin-top:10px;}\n.j-e{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;}\n.j-e i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}\n.j-e-t{font-size:12px;color:var(--text-secondary);}\n.j-e-v{font-family:var(--font-mono);font-size:14px;font-weight:500;margin-top:1px;}\n.j-e-s{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);margin-top:1px;}\n@media (max-width:900px){ .j-two{grid-template-columns:1fr;} }\n@media (max-width:560px){ .j-kv{font-size:20px;} .j-br{grid-template-columns:100px minmax(0,1fr) auto;font-size:11.5px;} }\n<\/style>\n<\/head>\n<body>\n<div class=\"en-page\">\n  <header>\n    <div class=\"en-eyebrow\">Вариант 5 · Журнал<\/div>\n    <h1 class=\"en-h1\">Энергетический журнал базы<\/h1>\n    <p class=\"en-sub\">Всё в киловатт-часах: сколько выработано, потрачено, сброшено и не хватило за выбранный период, с сравнением с предыдущим таким же. Ниже — учёт по каждому потребителю и события.<\/p>\n  <\/header>\n  <div id=\"ctl\"><\/div>\n\n  <div class=\"j-top\">\n    <div id=\"periods\"><\/div>\n    <div class=\"j-live\" id=\"live\"><\/div>\n  <\/div>\n\n  <section class=\"j-kpis\" id=\"kpis\"><\/section>\n\n  <section class=\"j-card\">\n    <div class=\"j-ch\"><h2>Энергия по интервалам<\/h2><div class=\"en-legend\" id=\"lgMain\"><\/div><\/div>\n    <p class=\"j-note\" id=\"mainNote\">—<\/p>\n    <div id=\"chMain\" style=\"margin-top:6px\"><\/div>\n  <\/section>\n\n  <section class=\"j-two\">\n    <div class=\"j-card\">\n      <h2>Баланс энергии<\/h2>\n      <p class=\"j-note\" id=\"balNote\">—<\/p>\n      <div class=\"j-bal\" id=\"bal\"><\/div>\n      <div class=\"j-eq\" id=\"eq\">—<\/div>\n    <\/div>\n    <div class=\"j-card\">\n      <h2>Аккумуляторы<\/h2>\n      <p class=\"j-note\" id=\"batNote\">—<\/p>\n      <div id=\"chBat\" style=\"margin-top:6px\"><\/div>\n      <div class=\"j-bstats\" id=\"batStats\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"j-card\">\n    <div class=\"j-ch\"><h2>Учёт по источникам и потребителям<\/h2><\/div>\n    <p class=\"j-note\">Нажмите на заголовок столбца, чтобы отсортировать. Сравнение — с предыдущим периодом такой же длины.<\/p>\n    <div class=\"j-tw\"><table class=\"j-table\" id=\"tbl\"><\/table><\/div>\n  <\/section>\n\n  <section class=\"j-card\">\n    <h2>События за период<\/h2>\n    <div class=\"j-ev\" id=\"events\"><\/div>\n  <\/section>\n<\/div>\n\n<script>/* Общий «движок» демо-страниц энергосистемы: физика базы, история на 90 суток, единицы, графики.\n *\n * Модель повторяет правила игры (js/core.js): солнечная панель даёт 10 ⚡ за цикл 60 с, установки\n * тратят power ⚡ за свой цикл, аккумулятор 400 ⚡, базовый запас 150 ⚡, а если энергии не хватает,\n * ВСЕ потребители сбавляют ход в одной и той же пропорции (powerFraction). Единица «⚡» здесь\n * считается 1 кВт·ч (KWH_PER_UNIT), поэтому 10 ⚡ за 60 с = 600 кВт, а ёмкость батареи = 400 кВт·ч.\n * В самой игре истории пока нет — при интеграции нужно писать такие же минутные срезы в state.\n */\n(function(root){\n'use strict';\n\nvar KWH_PER_UNIT=1, J_PER_KWH=3.6e6;\nvar DAY_MIN=1440, CAP_DAYS=90, CAP=CAP_DAYS*DAY_MIN, BUF=CAP+10*DAY_MIN;\nvar SOLAR_KW=600*KWH_PER_UNIT, BATTERY_KWH=400*KWH_PER_UNIT, BASE_KWH=150*KWH_PER_UNIT;\nvar OFFSET_MIN=10*60+30; // «сейчас» = 10:30 игрового дня: утро, аккумуляторы заряжаются\n\nvar CONSUMERS=[\n  {id:'iron',  name:'Железная руда', short:'Fe₂O₃', group:'mining', kw:72,    color:'#9FB0C8'},\n  {id:'copper',name:'Медная руда',   short:'Cu₂S',  group:'mining', kw:72,    color:'#E08A4B'},\n  {id:'coal',  name:'Уголь',         short:'C',     group:'mining', kw:60,    color:'#8B85A6'},\n  {id:'stone', name:'Камень',        short:'CaCO₃', group:'mining', kw:56.84, color:'#C2AD82'},\n  {id:'water', name:'Бурение воды',  short:'H₂O',   group:'drill',  kw:51.43, color:'#49B8F0'},\n  {id:'oil',   name:'Бурение нефти', short:'CxHy',  group:'drill',  kw:72,    color:'#B08D57'},\n  {id:'wheat', name:'Пшеница',       short:'Triticum',    group:'farm', kw:30,    color:'#E8D078'},\n  {id:'potato',name:'Картофель',     short:'Solanum tub.',group:'farm', kw:27.69, color:'#A9865B'},\n  {id:'corn',  name:'Кукуруза',      short:'Zea mays',    group:'farm', kw:31.3,  color:'#F0B93D'},\n  {id:'tomato',name:'Томаты',        short:'Solanum lyc.',group:'farm', kw:36,    color:'#E1503D'}\n];\nvar GROUPS=[\n  {id:'mining',name:'Горнодобыча',color:'#C9A227'},\n  {id:'drill', name:'Бурение',    color:'#49B8F0'},\n  {id:'farm',  name:'Фермы',      color:'#8CAF52'}\n];\nvar SCENARIOS={\n  start:{label:'Старт',         hint:'1 панель, без аккумуляторов', solar:1,  bat:0,   seed:11, growth:1,\n         cons:{iron:1,copper:1,water:1}},\n  mid:  {label:'Развитая база', hint:'12 панелей, 45 аккумуляторов',solar:12, bat:45,  seed:23, growth:1.15,\n         cons:{iron:6,copper:5,coal:4,stone:3,water:3,oil:3,wheat:3,potato:2,corn:2,tomato:2}},\n  big:  {label:'Промышленная',  hint:'60 панелей, 200 аккумуляторов',solar:60, bat:200, seed:37, growth:1.15,\n         cons:{iron:30,copper:25,coal:20,stone:15,water:15,oil:15,wheat:15,potato:10,corn:10,tomato:10}}\n};\nvar PERIODS=[\n  {id:'h1', label:'1 час',    phrase:'за последний час',   min:60,     bin:1},\n  {id:'d1', label:'Сутки',    phrase:'за последние сутки', min:1440,   bin:10},\n  {id:'d7', label:'Неделя',   phrase:'за неделю',          min:10080,  bin:60},\n  {id:'d30',label:'Месяц',    phrase:'за месяц',           min:43200,  bin:240},\n  {id:'d90',label:'3 месяца', phrase:'за 3 месяца',        min:129600, bin:720}\n];\nvar PMAP={}; PERIODS.forEach(function(p){ PMAP[p.id]=p; });\n\nvar SKEYS=['gen','curtail','demand','supply','flow','stored','nameplate','capKWh'].concat(CONSUMERS.map(function(c){return c.id;}));\nvar K=SKEYS.length, KI={}; SKEYS.forEach(function(k,i){ KI[k]=i; });\n// Виртуальные ряды: сумма (с весами) настоящих рядов.\nvar VIRT={\n  g_mining:CONSUMERS.filter(function(c){return c.group==='mining';}).map(function(c){return c.id;}),\n  g_drill: CONSUMERS.filter(function(c){return c.group==='drill';}).map(function(c){return c.id;}),\n  g_farm:  CONSUMERS.filter(function(c){return c.group==='farm';}).map(function(c){return c.id;}),\n  unmet:[['demand',1],['supply',-1]],\n  balance:[['gen',1],['demand',-1]],\n  used:[['gen',1],['curtail',-1]]\n};\n\nvar EN={\n  KWH_PER_UNIT:KWH_PER_UNIT, J_PER_KWH:J_PER_KWH, SOLAR_KW:SOLAR_KW, BATTERY_KWH:BATTERY_KWH, BASE_KWH:BASE_KWH,\n  CONSUMERS:CONSUMERS, GROUPS:GROUPS, SCENARIOS:SCENARIOS, PERIODS:PERIODS, PMAP:PMAP, CAP:CAP, DAY_MIN:DAY_MIN,\n  period:'d1', speed:600, scenario:'mid', cur:{}, counts:{}, paused:false\n};\n\n/* ---------- события ---------- */\nvar handlers={};\nEN.on=function(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); };\nfunction emit(ev,a){ (handlers[ev]||[]).forEach(function(f){ f(a); }); }\n\n/* ---------- физика ---------- */\nvar S={}; SKEYS.forEach(function(k){ S[k]=new Float32Array(BUF); });\nvar st={}, SC=null, P=new Float64Array(K), dem=new Float64Array(CONSUMERS.length);\n\nfunction mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nfunction sunFactor(clockSec){\n  var t=clockSec%86400;\n  if(t<21600||t>72000) return 0;\n  return Math.sin((t-21600)/50400*Math.PI);\n}\nEN.sunFactor=sunFactor;\n\nfunction countsFor(dayIdx){\n  var g=Math.pow(Math.min(1,Math.max(0,dayIdx/CAP_DAYS)),SC.growth||1.15), n={};\n  n.solar=Math.max(1,Math.ceil(SC.solar*g));\n  n.bat=SC.bat>0?Math.ceil(SC.bat*Math.min(1,g*1.08)):0;\n  CONSUMERS.forEach(function(c){ var f=SC.cons[c.id]||0; n[c.id]=f?Math.ceil(f*g):0; });\n  return n;\n}\nfunction rollDuty(){\n  for(var i=0;i<CONSUMERS.length;i++){\n    var r=st.rng();\n    st.duty[i]= r<.68?1: r<.83?.85: r<.93?.6: r<.98?.3: 0; // доля установок группы, реально работающих в этот час\n  }\n}\nfunction prep(){\n  var a=Math.floor((st.secs+OFFSET_MIN*60)/3600);\n  if(a!==st.hr){ st.hr=a; rollDuty(); }\n  var d=Math.floor((st.secs+OFFSET_MIN*60)/86400);\n  if(d!==st.dy){ st.dy=d; st.counts=countsFor(d); EN.counts=st.counts; }\n}\nfunction physics(dt){\n  var clock=(st.secs+OFFSET_MIN*60)%86400, sun=sunFactor(clock), n=st.counts;\n  var gen=n.solar*SOLAR_KW*sun, np=n.solar*SOLAR_KW, D=0, i;\n  for(i=0;i<CONSUMERS.length;i++){ dem[i]=n[CONSUMERS[i].id]*CONSUMERS[i].kw*st.duty[i]; D+=dem[i]; }\n  var cap=BASE_KWH+n.bat*BATTERY_KWH;\n  var avail=st.stored+gen*dt/3600, need=D*dt/3600;\n  var frac=need>1e-12?Math.min(1,avail/need):1;\n  var left=avail-need*frac, ns=Math.min(cap,left), spill=left-ns;\n  P[0]=gen; P[1]=spill*3600/dt; P[2]=D; P[3]=D*frac; P[4]=(ns-st.stored)*3600/dt; P[5]=ns; P[6]=np; P[7]=cap;\n  for(i=0;i<CONSUMERS.length;i++) P[8+i]=dem[i]*frac;\n  st.stored=ns; st.frac=frac; st.sun=sun; st.clock=clock;\n  var c=EN.cur;\n  c.sun=sun; c.gen=gen; c.nameplate=np; c.curtail=P[1]; c.demand=D; c.supply=P[3]; c.frac=frac; c.flow=P[4];\n  c.stored=ns; c.cap=cap; c.pct=cap>0?ns/cap*100:0; c.clock=clock; c.secs=st.secs; c.day=Math.floor((st.secs+OFFSET_MIN*60)/86400)+1;\n  c.cons=c.cons||{};\n  for(i=0;i<CONSUMERS.length;i++){ c.cons[CONSUMERS[i].id]=P[8+i]; }\n  c.duty=st.duty;\n}\nfunction accumulate(dt){ for(var k=0;k<K;k++) st.A[k]+=P[k]*dt; st.acc+=dt; }\nfunction shiftBuffer(){\n  var drop=BUF-CAP;\n  SKEYS.forEach(function(k){ S[k].copyWithin(0,drop,BUF); });\n  st.base+=drop; st.w=CAP;\n}\nfunction commit(){\n  var i=st.w, k;\n  for(k=0;k<K;k++){ S[SKEYS[k]][i]=st.A[k]/st.acc; st.A[k]=0; }\n  st.acc=0; st.w++; st.tMin++; st.dirty=true;\n  if(st.w>=BUF) shiftBuffer();\n}\nfunction advance(dtGame){\n  var remain=dtGame;\n  while(remain>1e-9){\n    prep();\n    var dt=Math.min(remain,60-st.acc,15);\n    if(dt<1e-6) dt=Math.min(remain,60-st.acc);\n    physics(dt); accumulate(dt);\n    st.secs+=dt; remain-=dt;\n    if(st.acc>=60-1e-7) commit();\n  }\n}\n\nEN.load=function(name){\n  SC=SCENARIOS[name]||SCENARIOS.mid; EN.scenario=SCENARIOS[name]?name:'mid';\n  st={secs:0,acc:0,A:new Float64Array(K),w:0,base:0,tMin:0,hr:-1,dy:-1,rng:mulberry(SC.seed),duty:new Array(CONSUMERS.length).fill(1),\n      counts:{},stored:0,dirty:false};\n  prep(); st.stored=(BASE_KWH+st.counts.bat*BATTERY_KWH)*0.5;\n  for(var m=0;m<CAP;m++){ prep(); physics(60); accumulate(60); st.secs+=60; commit(); }\n  st.dirt N.stat('curtail',p,M):{sum:0};\n  var unmet=d.sum-u.sum, unmetP=dp.sum-up.sum, ratio=d.sum>0?u.sum/d.sum*100:100, ratioP=dp.sum>0?up.sum/dp.sum*100:100;\n  var defMin=EN.deficitMinutes(p), defMinP=has?EN.deficitMinutes(p,M):0;\n  $('kpis').innerHTML=\n    kpi('Выработано',F.energy(g.sum).text,'средняя '+F.power(g.mean).text,delta(g.sum,gp.sum,'good'),'#FFDD57')+\n    kpi('Потреблено',F.energy(u.sum).text,'из '+F.energy(d.sum).text+' нужных',delta(u.sum,up.sum,'neutral'),'#5AA9FF')+\n    kpi('Не хватило',F.energy(unmet).text,'обеспеченность '+F.pct(ratio,1),delta(unmet,unmetP,'bad'),'#F4557B')+\n    kpi('Сброшено излишка',F.energy(c.sum).text,F.pct(g.sum>0?c.sum/g.sum*100:0)+' от выработки',delta(c.sum,cp.sum,'warn'),'#8C93B0')+\n    kpi('Обеспеченность',F.pct(ratio,1),'по энергии',delta(ratio,ratioP,'good'),'#4ADE9B')+\n    kpi('Время дефицита',F.dur(defMin/60),F.pct(defMin/M*100)+' периода',delta(defMin,defMinP,'bad'),'#F0B93D')+\n    kpi('Пик выработки',F.power(g.max).text,'установлено '+F.power(EN.counts.solar*EN.SOLAR_KW).text,delta(g.max,gp.max,'neutral'),'#FFDD57')+\n    kpi('Пик нагрузки',F.power(d.max).text,'средняя '+F.power(d.mean).text,delta(d.max,dp.max,'neutral'),'#5AA9FF')+\n    kpi('Заряд за период',(s.last>=s.first?'+':'−')+F.stored(Math.abs(s.last-s.first)).text,'с '+F.stored(s.first).text+' до '+F.stored(s.last).text,'','#4FD1E7');\n  $('mainNote').textContent='Столбики — энергия, потреблённая группами '+pp.phrase+' (шаг '+(pp.bin<60?pp.bin+' мин':pp.bin<1440?pp.bin/60+' ч':'1 сутки')+'); красное — нехватка; жёлтая линия — выработка.';\n}\n\n/* ---------- баланс ---------- */\nfunction brow(l,v,max,color,txt){ return '<div class=\"j-br\"><span>'+l+'<\/span><div class=\"bar\"><i style=\"width:'+Math.max(0,Math.min(100,max>0?v/max*100:0)).toFixed(1)+'%;background:'+color+'\"><\/i><\/div><b>'+txt+'<\/b><\/div>'; }\nfunction balance(){\n  var p=EN.period, g=EN.stat('gen',p), u=EN.stat('supply',p), c=EN.stat('curtail',p), s=EN.stat('stored',p), d=EN.sta  j;\n  for(i=0;i<out;i++){ var a=Math.floor(i*n/out), b=Math.max(a+1,Math.floor((i+1)*n/out)), s=0; for(j=a;j<b;j++) s+=d[j]; pts.push(s/(b-a)); if(pts[i]>mx) mx=pts[i]; }\n  if(mx<=0) mx=1; var W=96,H=24, path=pts.map(function(v,k){ return (k?'L':'M')+(k*(W-1)/(out-1)).toFixed(1)+' '+(H-2-(v/mx)*(H-4)).toFixed(1); }).join(' ');\n  return '<svg class=\"j-spark\" width=\"'+W+'\" height=\"'+H+'\" viewBox=\"0 0 '+W+' '+H+'\" aria-hidden=\"true\"><path d=\"'+path+' L'+(W-1)+' '+H+' L0 '+H+' Z\" fill=\"'+color+'\" opacity=\".16\"/><path d=\"'+path+'\" fill=\"none\" stroke=\"'+color+'\" stroke-width=\"1.4\"/><\/svg>';\n}\nfunction dcell(cur,prev){\n  if(!EN.hasPrev(EN.period)) return '<span style=\"color:var(--text-muted)\">—<\/span>';\n  if(prev<=0) return cur>0?'<span style=\"color:var(--text-secondary)\">новое<\/span>':'<span style=\"color:var(--text-muted)\">—<\/span>';\n  var pct=(cur-prev)/prev*100; if(Math.abs(pct)<0.5) return '<span style=\"color:var(--text-muted)\">0%<\/span>';\n  return '<span style=\"color:var(--text-secondary)\">'+(pct>0?'▲ ':'▼ ')+Math.abs(pct).toFixed(Math.abs(pct)>=10?0:1)+'%<\/span>';\n}\nfunction buildRows(){\n  var p=EN.period, has=EN.hasPrev(p), M=EN.PMAP[p].min, tot=EN.stat('supply',p).sum, rows=[];\n  EN.CONSUMERS.forEach(function(x){\n    var s=EN.stat(x.id,p); if(s.sum<=0.001&&!EN.counts[x.id]) return;\n    var pv=has?EN.stat(x.id,p,M).sum:0;\n    rows.push({id:x.id,name:x.name,grp:EN.GROUPS.filter(function(g){return g.id===x.group;})[0].name,color:x.color,count:EN.counts[x.id],inst:EN.counts[x.id]*x.kw,mean:s.mean,max:s.max,sum:s.sum,share:tot>0?s.sum/tot*100:0,prev:pv});\n  });\n  rowsCache=rows;\n}\nfunction table(){\n  buildRows(); var p=EN.period, rows=rowsCache.slice(), tot=EN.stat('supply',p), has=EN.hasPrev(p), M=EN.PMAP[p].min;\n  rows.sort(function(a,b){ var x=a[sortCol],y=b[sortCol]; if(typeof x==='string') return sortDir*x.localeCompare(y,'ru'); return sortDir*(x-y); });\n  var cols=[['name','Потребитель'],['count','Ед.' n$('tbl').addEventListener('click',function(e){\n  var th=e.target.closest('th[data-c]'); if(!th||th.classList.contains('nosort')) return;\n  var c=th.dataset.c; if(sortCol===c) sortDir=-sortDir; else { sortCol=c; sortDir=c==='name'?1:-1; } table();\n});\n\n/* ---------- события ---------- */\nfunction events(){\n  var p=EN.period, M=EN.PMAP[p].min, t0=EN.tNow()-M;\n  var gen=EN.strip('gen',M), dem=EN.strip('demand',M), sup=EN.strip('supply',M), st=EN.strip('stored',M), cap=EN.strip('capKWh',M);\n  var at=function(i){ return EN.binLabel(t0,i,1); };\n  var iG=0,iD=0,minRatio=2,iR=0,run=0,runStart=0,bestRun=0,bestStart=0,empty=0,emptyRuns=0,full=0,wasEmpty=false,i;\n  for(i=0;i<M;i++){\n    if(gen[i]>gen[iG]) iG=i; if(dem[i]>dem[iD]) iD=i;\n    var r=dem[i]>0?sup[i]/dem[i]:1; if(r<minRatio){ minRatio=r; iR=i; }\n    var def=dem[i]>0&&dem[i]-sup[i]>0.02*dem[i];\n    if(def){ if(run===0) runStart=i; run++; if(run>bestRun){ bestRun=run; bestStart=runStart; } } else run=0;\n    var isEmpty=cap[i]>0&&st[i]/cap[i]<0.01; if(isEmpty){ empty++; if(!wasEmpty) emptyRuns++; } wasEmpty=isEmpty;\n    if(cap[i]>0&&st[i]/cap[i]>0.995) full++;\n  }\n  var ev=function(color,t,v,s){ return '<div class=\"j-e\"><i style=\"background:'+color+'\"><\/i><div><div class=\"j-e-t\">'+t+'<\/div><div class=\"j-e-v\">'+v+'<\/div><div class=\"j-e-s\">'+s+'<\/div><\/div><\/div>'; };\n  $('events').innerHTML=\n    ev('#FFDD57','Пик выработки',F.power(gen[iG]).text,at(iG))+\n    ev('#5AA9FF','Пик нагрузки',F.power(dem[iD]).text,at(iD))+\n    ev('#F4557B','Самый глубокий провал обеспечения',F.pct(Math.min(1,minRatio)*100,1),minRatio>=0.999?'провалов не было':at(iR))+\n    ev('#F0B93D','Самый долгий дефицит',bestRun?F.dur(bestRun/60):'нет',bestRun?'с '+at(bestStart):'обеспечение было полным')+\n    ev('#4FD1E7','Аккумуляторы были пусты',F.dur(empty/60),emptyRuns?emptyRuns+' раз(а)':'ни разу')+\n    ev('#4ADE9B','Аккумуляторы были полны',F.dur(full/60),F.pct(full/M*100)+' периода');\n}\n\nvar dirty=true, lastHeavy=0;\nfunction heavy(){ kpis(); chMain.draw(); chBat.draw(); balance(); battery(); table(); events(); var g=EN.cur; }\nfunction live(){\n  var c=EN.cur;\n  $('live').innerHTML='<span>Сейчас: выработка <b>'+F.power(c.gen).text+'<\/b><\/span><span>нагрузка <b>'+F.power(c.demand).text+'<\/b><\/span><span>обеспечено <b>'+F.pct(c.frac*100)+'<\/b><\/span><span>заряд <b>'+F.stored(c.stored).text+'<\/b><\/span>';\n}\nEN.on('data',function(){ dirty=true; });\nEN.on('period',function(){ dirty=true; lastHeavy=0; });\nEN.on('reset',function(){ dirty=true; lastHeavy=0; });\nEN.on('frame',function(){ live(); var now=performance.now(); if(dirty&&now-lastHeavy>600){ dirty=false; lastHeavy=now; heavy(); } });\nEN.start();\n})();\n<\/script>\n<\/body>\n<\/html>\n"];
