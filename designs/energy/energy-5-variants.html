a-sel=\"g_'+g.id+'\"><h3>'+g.name+'<\/h3><b id=\"gv_'+g.id+'\">—<\/b><\/button>';\n    list.forEach(function(c){\n      html+='<button type=\"button\" class=\"m-row\" id=\"row_'+c.id+'\" data-sel=\"'+c.id+'\" style=\"--rc:'+c.color+'\"><i><\/i><span>'+c.name+'<\/span><em>×'+EN.counts[c.id]+'<\/em><b id=\"rv_'+c.id+'\">—<\/b><div class=\"m-rowbar\"><i id=\"rb_'+c.id+'\"><\/i><\/div><\/button>';\n    });\n    html+='<\/div>';\n  });\n  $('cons').innerHTML=html;\n}\nfunction buildTiles(){\n  var n=Math.min(EN.counts.solar,24), h=''; for(var i=0;i<n;i++) h+='<i><\/i>'; $('solTiles').innerHTML=h;\n}\n\n/* ---------- потоки ---------- */\nvar svg=$('flows'), NS='http://www.w3.org/2000/svg';\nfunction mkFlow(fromId,toId,color,fn){\n  var base=document.createElementNS(NS,'path'), dash=document.createElementNS(NS,'path');\n  base.setAttribute('class','m-flow-base'); base.setAttribute('stroke',color); dash.setAttribute('class','m-flow-dash'); dash.setAttribute('stroke',color);\n  svg.appendChild(base); svg.appendChild(dash);\n  flows.push({from:fromId,to:toId,base:base,dash:dash,fn:fn,color:color,lastDur:0});\n}\nfunction buildFlows(){\n  svg.innerHTML=''; flows=[];\n  mkFlow('nSun','nSolar','#FFDD57',function(){ return {i:EN.cur.sun,rev:false}; });\n  mkFlow('nSolar','nBus','#FFDD57',function(){ var c=EN.cur; return {i:c.nameplate>0?c.gen/c.nameplate:0,rev:false}; });\n  mkFlow('nBus','nBat','#4FD1E7',function(){ var c=EN.cur, ref=Math.max(c.nameplate,c.demand,1); return {i:Math.min(1,Math.abs(c.flow)/ref*1.6),rev:c.flow<0}; });\n  mkFlow('nBat','nCurt','#8C93B0',function(){ var c=EN.cur; return {i:c.nameplate>0?Math.min(1,c.curtail/c.nameplate*1.6):0,rev:false}; });\n  EN.GROUPS.forEach(function(g){\n    if(!$('grp_'+g.id)) return;\n    var ids=EN.CONSUMERS.filter(function(c){ return c.group===g.id; }).map(function(c){ return c.id; });\n    var inst=ids.reduce(function(a,id){ return a+(EN.counts[id]||0)*EN.CONSUMERS.filter(function(c){return c.id===id;})[0].kw; },0);\n    mkFlow('nBus','grp_'+g.id,g.color,function(){ var now=ids.reduce(function(a,id){ return a+(EN.cur.cons[id]||0); },0); return {i:inst>0?now/inst:0,rev:false}; });\n  });\n}\nfunction layoutFlows(){\n  var host=$('scheme').getBoundingClientRect(), stacked=window.innerWidth<=860;\n  svg.setAttribute('viewBox','0 0 '+host.width+' '+host.height);\n  var firstGrp=true;\n  flows.forEach(function(f){\n    var A=$(f.from), B=$(f.to); if(!A||!B) return;\n    var a=A.getBoundingClientRect(), b=B.getBoundingClientRect(), d;\n    if(stacked){\n      if(f.to.indexOf('grp_')===0){ if(!firstGrp){ f.base.setAttribute('d',''); f.dash.setAttribute('d',''); return; } firstGrp=false; }\n      if(f.from==='nBus'&&f.to==='nBat'){ }\n      var cx=(Math.max(a.left,b.left)+Math.min(a.right,b.right))/2-host.left, y1=a.bottom-host.top, y2=b.top-host.top;\n      if(f.to==='nCurt'){ y1=a.bottom-host.top; y2=b.top-host.top; cx=(Math.max(a.left,b.left)+Math.min(a.right,b.right))/2-host.left; }\n      d='M'+cx+' '+y1+' L'+cx+' '+y2;\n    }else if(a.left<b.right&&b.left<a.right){          // вертикальная связь\n      var cx2=(Math.max(a.left,b.left)+Math.min(a.right,b.right))/2-host.left;\n      var y1v=(a.top<b.top?a.bottom:a.top)-host.top, y2v=(a.top<b.top?b.top:b.bottom)-host.top;\n      d='M'+cx2+' '+y1v+' L'+cx2+' '+y2v;\n    }else{                                              // горизонтальная связь: точки на одной высоте\n      var leftToRight=a.right<=b.left, xa=(leftToRight?a.right:a.left)-host.left, xb=(leftToRight?b.left:b.right)-host.left;\n      var yc=(b.height>a.height?(a.top+a.height/2):(b.top+b.height/2))-host.top;\n      var lo=Math.max(a.top,b.top)-host.top+14, hi=Math.min(a.bottom,b.bottom)-host.top-14;\n      var y= hi>=lo ? Math.min(hi,Math.max(lo,yc)) : yc;\n      var ya=(a.top+a.height/2)-host.top, yb=(b.top+b.height/2)-host.top;\n      if(b.height>a.height) yb=Math.min(b.bottom-host.top-14,Math.max(b.top-host.top+14,ya)); else ya=Math.min(a.bottom-host.top-14,Math.max(a.top-host.top+14,yb));\n      var mx=(xa+xb)/2;\n      d='M'+xa+' '+ya+' C'+mx+' '+ya+' '+mx+' '+yb+' '+xb+' '+yb;\n    }\n    f.base.setAttribute('d',d); f.dash.setAttribute('d',d);\n  });\n}\nfunction animateFlows(){\n  flows.forEach(function(f){\n    var r=f.fn(), i=Math.max(0,Math.min(1,r.i)), on=i>0.01, w=2+7*Math.sqrt(i), dur=Math.max(.35,1.7-1.35*i);\n    f.base.setAttribute('stroke-width',w+4); f.base.style.opacity=on?'.2':'.07';\n    f.dash.setAttribute('stroke-width',Math.max(2.5,w*0.8)); f.dash.style.opacity=on?'1':'0';\n    f.dash.style.strokeDasharray='0.5 '+(9+w*0.6);\n    if(Math.abs(dur-f.lastDur)>0.06){ f.dash.style.animationDuration=dur+'s'; f.lastDur=dur; }\n    f.dash.classList.toggle('rev',!!r.rev);\n  });\n}\n\n/* ---------- живые значения узлов ---------- */\nfunction live(){\n  var c=EN.cur;\n  // солнце\n  $('sunPct').textContent=F.pct(c.sun*100); $('sunTxt').textContent=(c.sun>0?'День':'Ночь')+' · '+EN.clockStr(c.clock);\n  $('sunDisc').style.opacity=Math.max(.25,c.sun); $('sunRays').style.opacity=Math.max(.1,c.sun); $('moonCut').setAttribute('opacity',c.sun>0?0:1);\n  $('sunDisc').setAttribute('fill',c.sun>0?'#FFDD57':'#C9D2EE');\n  // панели\n  $('solCnt').textContent='×'+EN.counts.solar; $('solGen').textContent=F.power(c.gen).text; $('solOf').textContent='из '+F.power(c.nameplate).text+' установленных';\n  $('solBar').style.width=(c.nameplate>0?c.gen/c.nameplate*100:0).toFixed(1)+'%';\n  var tiles=$('solTiles').children; for(var i=0;i<tiles.length;i++) tiles[i].style.opacity=(0.12+0.88*c.sun).toFixed(2);\n  // шина\n  var pct=c.frac*100; $('ringPct').textContent=F.pct(pct,pct<99.5&&pct>0?1:0);\n  var arc=$('ringArc'); arc.setAttribute('stroke-dasharray',(302*c.frac).toFixed(1)+' 302'); arc.setAttribute('stroke',c.frac>=.999?'#4ADE9B':c.frac>=.5?'#F0B93D':'#F4557B');\n  $('busDem').textContent=F.power(c.demand).text; $('busSup').textContent=F.power(c.supply).text; $('busGen').textContent=F.power(c.gen).text;\n  $('busFlow').textContent=Math.abs(c.flow)<1?'0':(c.flow>0?'+':'−')+F.power(Math.abs(c.flow)).text;\n  $('busAuto').textContent=c.demand>1?F.dur(c.stored/c.demand):'∞';\n  $('busState').innerHTML= c.frac>=.999?'<span style=\"color:var(--good)\">● Норма<\/span>' : c.frac<.02?'<span style=\"color:var(--bad)\">● Блэкаут<\/span>' : '<span style=\"color:#F0B93D\">● Просадка<\/span>';\n  // аккумулятор\n  $('batCnt').textContent=EN.counts.bat?'×'+EN.counts.bat:'базовый блок'; $('batJ').textContent=F.stored(c.stored).text; $('batOf').textContent='из '+F.stored(c.cap).text;\n  $('batBar').style.width=c.pct.toFixed(1)+'%'; $('batKwh').textContent=F.energy(c.stored).text+' / '+F.energy(c.cap).text;\n  var h=62*c.pct/100; $('batLevel').setAttribute('y',72-h); $('batLevel').setAttribute('height',h); $('batLevel').setAttribute('fill',c.pct<15?'#F4557B':'#4FD1E7');\n  $('batBolt').style.opacity=Math.abs(c.flow)<1?.2:.9;\n  $('batFlowTxt').textContent= Math.abs(c.flow)<1?'Без изменений' : c.flow>0?'Заряд +'+F.power(c.flow).text+' · полон через '+F.dur((c.cap-c.stored)/c.flow) : 'Разряд −'+F.power(-c.flow).text+' · пуст через '+F.dur(c.stored/-c.flow);\n  // сброс\n  $('curtV').textContent=c.curtail>1?F.power(c.curtail).text:'нет'; $('nCurt').classList.toggle('idle',c.curtail<=1);\n  // потребители\n  EN.GROUPS.forEach(function(g){\n    var el=$('gv_'+g.id); if(!el) return;\n    var sum=0; EN.CONSUMERS.forEach(function(x){ if(x.group===g.id) sum+=c.cons[x.id]||0; }); el.textContent=F.power(sum).text;\n  });\n  EN.CONSUMERS.forEach(function(x){\n    var v=$('rv_'+x.id); if(!v) return; var now=c.cons[x.id]||0, inst=EN.counts[x.id]*x.kw;\n    v.textContent=F.power(now).text; $('rb_'+x.id).style.width=(inst>0?now/inst*100:0).toFixed(0)+'%';\n  });\n}\n\n/* ---------- история выбранного узла ---------- */\nvar chart=EN.chart($('hChart'),{kind:'line',unit:'power',height:280,series:[]}), legendSeries=[];\nfunction cfgFor(id){\n  var recipe=EN.CONSUMERS.filter(function(c){return c.id===id;})[0], grp=EN.GROUPS.filter(function(g){return 'g_'+g.id===id;})[0];\n  if(id==='solar') return {title:'Солнечные панели',sub:'Выработка, сброс излишка и установленная мощность всех панелей базы.',unit:'power',kind:'line',stack:false,key:'gen',\n      series:[{key:'gen',label:'Выработка',color:'#FFDD57',fill:true},{key:'curtail',label:'Сброс излишка',color:'#8C93B0',width:1.2},{key:'nameplate',label:'Установленная мощность',color:'#FFDD57',dash:[5,4],width:1.1}]};\n  if(id==='bus') return {title:'Шина базы: обеспечение',sub:'Сколько энергии просили потребители и сколько им реально досталось. Красное — нехватка.',unit:'power',kind:'line',stack:false,key:'supply',\n      series:[{key:'supply',label:'Получено',color:'#4ADE9B',fill:true},{key:'demand',label:'Потребность',color:'#B9C2E0',dash:[4,3],width:1.3}],between:{top:'demand',bottom:'supply',color:'#F4557B'}};\n  if(id==='batt') return {title:'Аккумуляторы: заряд',sub:'Запас энергии в джоулях. Пунктир — полная ёмкость всех аккумуляторов.',unit:'joule',kind:'line',stack:false,key:'stored',stored:true,\n      series:[{key:'stored',label:'Заряд',color:'#4FD1E7',fill:true},{key:'capKWh',label:'Ёмкость',color:'#4FD1E7',dash:[5,4],width:1.1}]};\n  if(id==='curt') return {title:'Сброс излишка',sub:'Энергия, которую некуда было девать: аккумуляторы полны, а панели ещё дают ток.',unit:'power',kind:'line',stack:false,key:'curtail',\n      series:[{key:'curtail',label:'Сброс',color:'#8C93B0',fill:true}]};\n  if(grp){ var list=EN.CONSUMERS.filter(function(c){ return c.group===grp.id&&EN.counts[c.id]>0; });\n    return {title:grp.name,sub:'Потребление всех установок группы, по видам.',unit:'power',kind:'area',stack:true,key:'g_'+grp.id,\n      series:list.map(function(c){ return {key:c.id,label:c.name,color:c.color}; })}; }\n  if(recipe) return {title:recipe.name,sub:'Потребление установок этого вида: '+EN.counts[recipe.id]+' шт. по '+F.power(recipe.kw).text+' при полной загрузке.',unit:'power',kind:'line',stack:false,key:recipe.id,\n      series:[{key:recipe.id,label:recipe.name,color:recipe.color,fill:true}]};\n}\nvar cfg=null;\nfunction stat(l,v){ return '<div class=\"m-stat\"><div class=\"m-stat-l\">'+l+'<\/div><div class=\"m-stat-v\">'+v+'<\/div><\/div>'; }\nfunction renderHist(rebuild){\n  if(rebuild||!cfg){\n    cfg=cfgFor(sel)||cfgFor('solar');\n    var o=chart.o; o.kind=cfg.kind; o.stack=cfg.stack; o.unit=cfg.unit; o.series=cfg.series; o.between=cfg.between||null; o.refs=[];\n    $('hTitle').textContent=cfg.title; $('hSub').textContent=cfg.sub;\n    EN.legend($('hLegend'),cfg.series,function(){ chart.draw(); });\n  }\n  chart.draw();\n  var p=EN.period, s=EN.stat(cfg.key,p), h='';\n  if(cfg.stored){ h=stat('Среднее',F.stored(s.mean).text)+stat('Минимум',F.stored(s.min).text)+stat('Максимум',F.stored(s.max).text)+stat('Сейчас',F.stored(EN.cur.stored).text)+stat('Ёмкость',F.stored(EN.cur.cap).text); }\n  else{\n    h=stat('Среднее',F.power(s.mean).text)+stat('Пик',F.power(s.max).text)+stat('Минимум',F.power(s.min).text)+stat('Энергия '+EN.PMAP[p].phrase,F.energy(s.sum).text);\n    if(cfg.key==='supply'){ var d=EN.stat('demand',p); h+=stat('Обеспеченность',F.pct(d.sum>0?s.sum/d.sum*100:100,1))+stat('Минут дефицита',String(EN.deficitMinutes(p))); }\n    if(cfg.key==='gen'){ var cu=EN.stat('curtail',p); h+=stat('Сброшено',F.energy(cu.sum).text); }\n  }\n  $('hStats').innerHTML=h;\n  $('solEn').textContent=F.energy(EN.stat('gen',p).sum).text;\n}\nfunction mark(){\n  document.querySelectorAll('[data-sel]').forEach(function(b){\n    var on=b.dataset.sel===sel||(sel==='solar'&&b.id==='nSun'&&false);\n    b.classList.toggle('sel',b.id==='nSun'?false:on);\n  });\n}\ndocument.addEventListener('click',function(e){\n  var b=e.target.closest('[data-sel]'); if(!b) return;\n  sel=b.dataset.sel; mark(); renderHist(true);\n});\n\n/* ---------- цикл ---------- */\nvar dirty=true, lastHeavy=0, lastLayout=0;\nEN.on('data',function(){ dirty=true; });\nEN.on('period',function(){ dirty=true; lastHeavy=0; });\nEN.on('reset',function(){ buildCons(); buildTiles(); buildFlows(); mark(); dirty=true; lastHeavy=0; renderHist(true); layoutFlows(); });\nEN.on('frame',function(){\n  live(); animateFlows();\n  var now=performance.now();\n  if(now-lastLayout>400){ lastLayout=now; layoutFlows(); }\n  if(dirty&&now-lastHeavy>400){ dirty=false; lastHeavy=now; renderHist(false); }\n});\nwindow.addEventListener('resize',layoutFlows);\nif(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutFlows);\nEN.start();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Энергосистема · Вариант 3 · Батарейный банк<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>/* Общие стили демо-страниц энергосистемы: палитра игры (css/base.css), панель демо-управления,\n   вкладки периодов, подсказки графиков. Каждый вариант добавляет свои стили поверх. */\n:root{\n  color-scheme:dark;\n  --bg:#0A0D18;--panel:#12172A;--card:#171D33;--card-hover:#1E2640;--border:#293150;--border-strong:#3A4468;\n  --text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;\n  --tier0:#4FD1E7;--tier1:#F2A93B;--energy:#FFDD57;--water:#49B8F0;--good:#4ADE9B;--bad:#F4557B;--skill:#B388FF;--ink:#0A0D18;\n  --supply:#4ADE9B;--prod:#FFDD57;--batt:#4FD1E7;--demand:#B9C2E0;\n  --en-grid:rgba(255,255,255,.07);--en-night:rgba(4,7,20,.55);\n  --font-display:'Rajdhani',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;\n}\n*{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.45;}\nbutton{font:inherit;color:inherit;}\n.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.en-page{max-width:1240px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:16px;}\n.en-eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}\n.en-h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:.01em;}\n.en-sub{font-size:13px;color:var(--text-secondary);margin:4px 0 0;max-width:78ch;}\n.en-back{display:inline-block;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:6px;}\n.en-back:hover{color:var(--text-primary);}\n\n/* панель демо-управления */\n.en-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:9px 14px;border-radius:12px;background:linear-gradient(180deg,#1A2143,#0E1328);border:1px solid #2B3563;}\n.en-ctl-g{display:flex;align-items:center;gap:9px;}\n.en-ctl-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}\n.en-btns{display:inline-flex;gap:4px;flex-wrap:wrap;}\n.en-btn{font-family:var(--font-mono);font-size:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;}\n.en-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-btn.active{background:var(--skill);border-color:var(--skill);color:#0A0D18;}\n.en-btn:focus-visible,.en-tab:focus-visible,.en-chip:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.en-ctl-clock{margin-left:auto;}\n.en-ctl-clock b{font-size:14px;font-weight:500;color:var(--text-primary);}\n\n/* вкладки периодов */\n.en-tabs{display:flex;gap:4px;flex-wrap:wrap;}\n.en-tab{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;\n  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;}\n.en-tab:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}\n\n/* графики */\n.en-chartbox{width:100%;}\n.en-chartbox canvas{display:block;touch-action:pan-y;}\n.en-tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;max-width:260px;padding:8px 10px;border-radius:8px;background:rgba(10,13,24,.96);border:1px solid var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:12px;}\n.en-tip[hidden]{display:none;}\n.en-tip-t{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-bottom:5px;white-space:nowrap;}\n.en-tip-row{display:flex;align-items:center;gap:7px;padding:1px 0;}\n.en-tip-row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}\n.en-tip-row span{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.en-tip-row b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap;}\n.en-tip-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}\n.en-legend{display:flex;flex-wrap:wrap;gap:5px;}\n.en-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}\n.en-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}\n.en-chip:hover{color:var(--text-primary);}\n.en-chip.off{opacity:.42;}\n.en-chip.off i{background:var(--border-strong)!important;}\n\n@media (max-width:640px){\n  .en-page{padding:14px 12px 48px;}\n  .en-h1{font-size:24px;}\n  .en-ctl{padding:9px 10px;gap:8px 14px;}\n  .en-ctl-clock{margin-left:0;}\n  .en-tab{padding:7px 11px;font-size:13px;}\n}\n@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }\n<\/style>\n<style>\n/* Вариант 3 — «Батарейный банк»: главный герой — заряд аккумуляторов, остальное вокруг него. */\n.b-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;}\n.b-card{background:linear-gradient(180deg,#171D33,#10162A);border:1px solid var(--border);border-radius:16px;padding:16px 18px;min-width:0;}\n.b-rack{background:radial-gradient(100% 80% at 50% 0%,rgba(79,209,231,.10),transparent 65%),linear-gradient(180deg,#131A32,#0C1124);border-color:#24406A;}\n.b-rh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}\n.b-rh h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.02em;}\n.b-rh span{font-size:12px;color:var(--text-secondary);}\n.b-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:14px 10px;padding:14px 10px 6px;border-radius:12px;background:#080C1B;border:1px solid #16203C;}\n.b-cw{position:relative;padding-top:6px;}\n.b-cw::before{content:\"\";position:absolute;top:0;left:50%;width:36%;height:6px;transform:translateX(-50%);border-radius:2px 2px 0 0;background:#4B5680;}\n.b-cell{position:relative;aspect-ratio:.58;border:2px solid #4B5680;border-radius:8px;background:#0B1022;overflow:hidden;}\n.b-cf{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#7CEBFA,#1D9CB5);transition:height .5s;}\n.b-cf::after{content:\"\";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.55);}\n.b-cell::after{content:\"\";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22%,rgba(8,12,27,.55) 22% 24%);pointer-events:none;}\n.b-cell.low .b-cf{background:linear-gradient(180deg,#FF8FA8,#C0334F);}\n.b-cell.front{border-color:#7CEBFA;box-shadow:0 0 14px rgba(79,209,231,.45);}\n.charging .b-cell.front .b-cf::after{animation:b-pulse 1s ease-in-out infinite;}\n.discharging .b-cell.front{border-color:#F0B93D;box-shadow:0 0 14px rgba(240,185,61,.4);}\n.discharging .b-cell.front .b-cf{background:linear-gradient(180deg,#F8D27A,#C08417);}\n@keyframes b-pulse{0%,100%{opacity:.35;}50%{opacity:1;}}\n.b-rack-foot{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12px;color:var(--text-secondary);}\n.b-rack-foot b{font-family:var(--font-mono);font-weight:500;color:var(--text-primary);}\n\n.b-info{display:flex;flex-direction:column;gap:12px;}\n.b-eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}\n.b-joule{font-family:var(--font-mono);font-size:54px;font-weight:500;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:#7CEBFA;text-shadow:0 0 24px rgba(79,209,231,.35);}\n.b-joule small{font-size:24px;margin-left:8px;color:var(--text-secondary);text-shadow:none;}\n.b-of{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary);margin-top:6px;}\n.b-pctbar{position:relative;height:14px;border-radius:7px;background:#0B1022;box-shadow:inset 0 2px 5px rgba(0,0,0,.6);margin-top:12px;overflow:hidden;}\n.b-pctbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1D9CB5,#7CEBFA);transition:width .4s;}\n.b-pctbar em{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28);}\n.b-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;}\n.b-badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:6px;}\n.b-badge.chg{background:rgba(74,222,155,.16);color:var(--good);}\n.b-badge.dis{background:rgba(240,185,61,.16);color:#F0B93D;}\n.b-badge.idl{background:rgba(79,209,231,.14);color:var(--tier0);}\n.b-badge.emp{background:rgba(244,85,123,.16);color:var(--bad);}\n.b-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;}\n.b-fact{background:#0B1022;border:1px solid #16203C;border-radius:10px;padding:8px 11px;}\n.b-fact-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}\n.b-fact-v{font-family:var(--font-mono);font-size:16px;font-weight:500;margin-top:2px;white-space:nowrap;}\n\n.b-gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}\n.b-gauges{margin-top:auto;}\n.b-gauge{display:flex;flex-direction:column;align-items:center;padding:10px 8px 8px;background:#0B1022;border:1px solid #16203C;border-radius:12px;}\n.b-gauge svg{width:100%;max-width:230px;height:auto;}\n.b-gauge h3{margin:0 0 2px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;align-self:flex-start;}\n.b-gauge .gv{font-family:var(--font-mono);font-size:20px;font-weight:500;margin-top:-6px;}\n.b-gauge .gs{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);}\n\n.b-ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}\n.b-ph h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;flex:1;min-width:160px;letter-spacing:.02em;}\n.b-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}\n.b-flow{display:flex;flex-direction:column;gap:9px;}\n.b-fr{display:grid;grid-template-columns:170px minmax(0,1fr) 190px;gap:10px;align-items:center;font-size:12.5px;}\n.b-fr span{color:var(--text-secondary);}\n.b-fr .bar{height:12px;border-radius:6px;background:#0B1022;overflow:hidden;}\n.b-fr .bar i{display:block;height:100%;border-radius:6px;transition:width .4s;}\n.b-fr b{font-family:var(--font-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;}\n\n@media (max-width:900px){ .b-hero{grid-template-columns:1fr;} .b-two{grid-template-columns:1fr;} }\n@media (max-width:560px){ .b-joule{font-size:40px;} .b-joule small{font-size:18px;} .b-fr{grid-template-columns:96px minmax(0,1fr) 120px;font-size:11.5px;} .b-cells{grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:12px 8px;} }\n<\/style>\n<\/head>\n<body>\n<div class=\"en-page\">\n  <header>\n    <div class=\"en-eyebrow\">Вариант 3 · Батарейный банк<\/div>\n    <h1 class=\"en-h1\">Энергосистема: заряд в центре внимания<\/h1>\n    <p class=\"en-sub\">Аккумуляторы нарисованы стойкой ячеек, которые заполняются по очереди. Рядом — заряд в джоулях и кВт·ч, состояние, автономия и манометры обеспечения и выработки.<\/p>\n  <\/header>\n  <div id=\"ctl\"><\/div>\n\n  <section class=\"b-hero\" id=\"hero\">\n    <div class=\"b-card b-rack\">\n      <div class=\"b-rh\"><h2>Банк аккумуляторов<\/h2><span id=\"rackSub\">—<\/span><\/div>\n      <div class=\"b-cells\" id=\"cells\"><\/div>\n      <div class=\"b-rack-foot\" id=\"rackFoot\"><\/div>\n    <\/div>\n    <div class=\"b-card b-info\">\n      <div>\n        <div class=\"b-eyebrow\">Запас энергии<\/div>\n        <div class=\"b-joule\" id=\"jVal\">—<\/div>\n        <div class=\"b-of\" id=\"jOf\">—<\/div>\n        <div class=\"b-pctbar\"><i id=\"pctFill\" style=\"width:0\"><\/i><em style=\"left:25%\"><\/em><em style=\"left:50%\"><\/em><em style=\"left:75%\"><\/em><\/div>\n        <div class=\"b-state\"><span id=\"stBadge\" class=\"b-badge idl\">—<\/span><span id=\"stTxt\"><\/span><\/div>\n      <\/div>\n      <div class=\"b-facts\">\n        <div class=\"b-fact\"><div class=\"b-fact-l\">Заряд<\/div><div class=\"b-fact-v\" id=\"fPct\">—<\/div><\/div>\n        <div class=\"b-fact\"><div class=\"b-fact-l\">В кВт·ч<\/div><div class=\"b-fact-v\" id=\"fKwh\">—<\/div><\/div>\n        <div class=\"b-fact\"><div class=\"b-fact-l\">Автономия без солнца<\/div><div class=\"b-fact-v\" id=\"fAuto\">—<\/div><\/div>\n        <div class=\"b-fact\"><div class=\"b-fact-l\">Свободное место<\/div><div class=\"b-fact-v\" id=\"fFree\">—<\/div><\/div>\n      <\/div>\n  <div class=\"b-gauges\">\n    <div class=\"b-gauge\"><h3>Обеспечение<\/h3>\n      <svg viewBox=\"0 0 120 72\" aria-hidden=\"true\"><path d=\"M10 62 A50 50 0 0 1 110 62\" fill=\"none\" stroke=\"#0B1022\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n        <path id=\"gSup\" d=\"M10 62 A50 50 0 0 1 110 62\" pathLength=\"100\" fill=\"none\" stroke=\"#4ADE9B\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"0 100\"/><\/svg>\n      <div class=\"gv\" id=\"gSupV\">—<\/div><div class=\"gs\" id=\"gSupS\">—<\/div><\/div>\n    <div class=\"b-gauge\"><h3>Производство<\/h3>\n      <svg viewBox=\"0 0 120 72\" aria-hidden=\"true\"><path d=\"M10 62 A50 50 0 0 1 110 62\" fill=\"none\" stroke=\"#0B1022\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n        <path id=\"gProd\" d=\"M10 62 A50 50 0 0 1 110 62\" pathLength=\"100\" fill=\"none\" stroke=\"#FFDD57\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"0 100\"/><\/svg>\n      <div class=\"gv\" id=\"gProdV\">—<\/div><div class=\"gs\" id=\"gProdS\">—<\/div><\/div>\n  <\/div>\n\n\n    <\/div>\n  <\/section>\n\n  <div id=\"periods\"><\/div>\n\n  <section class=\"b-card\">\n    <div class=\"b-ph\"><h2>История заряда<\/h2><div class=\"en-legend\" id=\"lgBat\"><\/div><\/div>\n    <div id=\"chBat\"><\/div>\n    <div class=\"b-facts\" style=\"grid-template-columns:repeat(auto-fit,minmax(160px,1fr))\" id=\"batStats\"><\/div>\n  <\/section>\n\n  <section class=\"b-two\">\n    <div class=\"b-card\"><div class=\"b-ph\"><h2>Обеспечение<\/h2><\/div><div class=\"en-legend\" id=\"lgSup\" style=\"margin-bottom:6px\"><\/div><div id=\"chSup\"><\/div><\/div>\n    <div class=\"b-card\"><div class=\"b-ph\"><h2>Производство<\/h2><\/div><div class=\"en-legend\" id=\"lgProd\" style=\"margin-bottom:6px\"><\/div><div id=\"chProd\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"b-card\">\n    <div class=\"b-ph\"><h2 id=\"flowTitle\">Куда ушла энергия<\/h2><\/div>\n    <div class=\"b-flow\" id=\"flow\"><\/div>\n  <\/section>\n<\/div>\n\n<script>/* Общий «движок» демо-страниц энергосистемы: физика базы, история на 90 суток, единицы, графики.\n *\n * Модель повторяет правила игры (js/core.js): солнечная панель даёт 10 ⚡ за цикл 60 с, установки\n * тратят power ⚡ за свой цикл, аккумулятор 400 ⚡, базовый запас 150 ⚡, а если энергии не хватает,\n * ВСЕ потребители сбавляют ход в одной и той же пропорции (powerFraction). Единица «⚡» здесь\n * считается 1 кВт·ч (KWH_PER_UNIT), поэтому 10 ⚡ за 60 с = 600 кВт, а ёмкость батареи = 400 кВт·ч.\n * В самой игре истории пока нет — при интеграции нужно писать такие же минутные срезы в state.\n */\n(function(root){\n'use strict';\n\nvar KWH_PER_UNIT=1, J_PER_KWH=3.6e6;\nvar DAY_MIN=1440, CAP_DAYS=90, CAP=CAP_DAYS*DAY_MIN, BUF=CAP+10*DAY_MIN;\nvar SOLAR_KW=600*KWH_PER_UNIT, BATTERY_KWH=400*KWH_PER_UNIT, BASE_KWH=150*KWH_PER_UNIT;\nvar OFFSET_MIN=10*60+30; // «сейчас» = 10:30 игрового дня: утро, аккумуляторы заряжаются\n\nvar CONSUMERS=[\n  {id:'iron',  name:'Железная руда', short:'Fe₂O₃', group:'mining', kw:72,    color:'#9FB0C8'},\n  {id:'copper',name:'Медная руда',   short:'Cu₂S',  group:'mining', kw:72,    color:'#E08A4B'},\n  {id:'coal',  name:'Уголь',         short:'C',     group:'mining', kw:60,    color:'#8B85A6'},\n  {id:'stone', name:'Камень',        short:'CaCO₃', group:'mining', kw:56.84, color:'#C2AD82'},\n  {id:'water', name:'Бурение воды',  short:'H₂O',   group:'drill',  kw:51.43, color:'#49B8F0'},\n  {id:'oil',   name:'Бурение нефти', short:'CxHy',  group:'drill',  kw:72,    color:'#B08D57'},\n  {id:'wheat', name:'Пшеница',       short:'Triticum',    group:'farm', kw:30,    color:'#E8D078'},\n  {id:'potato',name:'Картофель',     short:'Solanum tub.',group:'farm', kw:27.69, color:'#A9865B'},\n  {id:'corn',  name:'Кукуруза',      short:'Zea mays',    group:'farm', kw:31.3,  color:'#F0B93D'},\n  {id:'tomato',name:'Томаты',        short:'Solanum lyc.',group:'farm', kw:36,    color:'#E1503D'}\n];\nvar GROUPS=[\n  {id:'mining',name:'Горнодобыча',color:'#C9A227'},\n  {id:'drill', name:'Бурение',    color:'#49B8F0'},\n  {id:'farm',  name:'Фермы',      color:'#8CAF52'}\n];\nvar SCENARIOS={\n  start:{label:'Старт',         hint:'1 панель, без аккумуляторов', solar:1,  bat:0,   seed:11, growth:1,\n         cons:{iron:1,copper:1,water:1}},\n  mid:  {label:'Развитая база', hint:'12 панелей, 45 аккумуляторов',solar:12, bat:45,  seed:23, growth:1.15,\n         cons:{iron:6,copper:5,coal:4,stone:3,water:3,oil:3,wheat:3,potato:2,corn:2,tomato:2}},\n  big:  {label:'Промышленная',  hint:'60 панелей, 200 аккумуляторов',solar:60, bat:200, seed:37, growth:1.15,\n         cons:{iron:30,copper:25,coal:20,stone:15,water:15,oil:15,wheat:15,potato:10,corn:10,tomato:10}}\n};\nvar PERIODS=[\n  {id:'h1', label:'1 час',    phrase:'за последний час',   min:60,     bin:1},\n  {id:'d1', label:'Сутки',    phrase:'за последние сутки', min:1440,   bin:10},\n  {id:'d7', label:'Неделя',   phrase:'за неделю',          min:10080,  bin:60},\n  {id:'d30',label:'Месяц',    phrase:'за месяц',           min:43200,  bin:240},\n  {id:'d90',label:'3 месяца', phrase:'за 3 месяца',        min:129600, bin:720}\n];\nvar PMAP={}; PERIODS.forEach(function(p){ PMAP[p.id]=p; });\n\nvar SKEYS=['gen','curtail','demand','supply','flow','stored','nameplate','capKWh'].concat(CONSUMERS.map(function(c){return c.id;}));\nvar K=SKEYS.length, KI={}; SKEYS.forEach(function(k,i){ KI[k]=i; });\n// Виртуальные ряды: сумма (с весами) настоящих рядов.\nvar VIRT={\n  g_mining:CONSUMERS.filter(function(c){return c.group==='mining';}).map(function(c){return c.id;}),\n  g_drill: CONSUMERS.filter(function(c){return c.group==='drill';}).map(function(c){return c.id;}),\n  g_farm:  CONSUMERS.filter(function(c){return c.group==='farm';}).map(function(c){return c.id;}),\n  unmet:[['demand',1],['supply',-1]],\n  balance:[['gen',1],['demand',-1]],\n  used:[['gen',1],['curtail',-1]]\n};\n\nvar EN={\n  KWH_PER_UNIT:KWH_PER_UNIT, J_PER_KWH:J_PER_KWH, SOLAR_KW:SOLAR_KW, BATTERY_KWH:BATTERY_KWH, BASE_KWH:BASE_KWH,\n  CONSUMERS:CONSUMERS, GROUPS:GROUPS, SCENARIOS:SCENARIOS, PERIODS:PERIODS, PMAP:PMAP, CAP:CAP, DAY_MIN:DAY_MIN,\n  period:'d1', speed:600, scenario:'mid', cur:{}, counts:{}, paused:false\n};\n\n/* ---------- события ---------- */\nvar handlers={};\nEN.on=function(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); };\nfunction emit(ev,a){ (handlers[ev]||[]).forEach(function(f){ f(a); }); }\n\n/* ---------- физика ---------- */\nvar S={}; SKEYS.forEach(function(k){ S[k]=new Float32Array(BUF); });\nvar st={}, SC=null, P=new Float64Array(K), dem=new Float64Array(CONSUMERS.length);\n\nfunction mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nfunction sunFactor(clockSec){\n  var t=clockSec%86400;\n  if(t<21600||t>72000) return 0;\n  return Math.sin((t-21600)/50400*Math.PI);\n}\nEN.sunFactor=sunFactor;\n\nfunction countsFor(dayIdx){\n  var g=Math.pow(Math.min(1,Math.max(0,dayIdx/CAP_DAYS)),SC.growth||1.15), n={};\n  n.solar=Math.max(1,Math.ceil(SC.solar*g));\n  n.bat=SC.bat>0?Math.ceil(SC.bat*Math.min(1,g*1.08)):0;\n  CONSUMERS.forEach(function(c){ var f=SC.cons[c.id]||0; n[c.id]=f?Math.ceil(f*g):0; });\n  return n;\n}\nfunction rollDuty(){\n  for(var i=0;i<CONSUMERS.length;i++){\n    var r=st.rng();\n    st.duty[i]= r<.68?1: r<.83?.85: r<.93?.6: r<.98?.3: 0; // доля установок группы, реально работающих в этот час\n  }\n}\nfunction prep(){\n  var a=Math.floor((st.secs+OFFSET_MIN*60)/3600);\n  if(a!==st.hr){ st.hr=a; rollDuty(); }\n  var d=Math.floor((st.secs+OFFSET_MIN*60)/86400);\n  if(d!==st.dy){ st.dy=d; st.counts=countsFor(d); EN.counts=st.counts; }\n}\nfunction physics(dt){\n  var clock=(st.secs+OFFSET_MIN*60)%86400, sun=sunFactor(clock), n=st.counts;\n  var gen=n.solar*SOLAR_KW*sun, np=n.solar*SOLAR_KW, D=0, i;\n  for(i=0;i<CONSUMERS.length;i++){ dem[i]=n[CONSUMERS[i].id]*CONSUMERS[i].kw*st.duty[i]; D+=dem[i]; }\n  var cap=BASE_KWH+n.bat*BATTERY_KWH;\n  var avail=st.stored+gen*dt/3600, need=D*dt/3600;\n  var frac=need>1e-12?Math.min(1,avail/need):1;\n  var left=avail-need*frac, ns=Math.min(cap,left), spill=left-ns;\n  P[0]=gen; P[1]=spill*3600/dt; P[2]=D; P[3]=D*frac; P[4]=(ns-st.stored)*3600/dt; P[5]=ns; P[6]=np; P[7]=cap;\n  for(i=0;i<CONSUMERS.length;i++) P[8+i]=dem[i]*frac;\n  st.stored=ns; st.frac=frac; st.sun=sun; st.clock=clock;\n  var c=EN.cur;\n  c.sun=sun; c.gen=gen; c.nameplate=np; c.curtail=P[1]; c.demand=D; c.supply=P[3]; c.frac=frac; c.flow=P[4];\n  c.stored=ns; c.cap=cap; c.pct=cap>0?ns/cap*100:0; c.clock=clock; c.secs=st.secs; c.day=Math.floor((st.secs+OFFSET_MIN*60)/86400)+1;\n  c.cons=c.cons||{};\n  for(i=0;i<CONSUMERS.length;i++){ c.cons[CONSUMERS[i].id]=P[8+i]; }\n  c.duty=st.duty;\n}\nfunction accumulate(dt){ for(var k=0;k<K;k++) st.A[k]+=P[k]*dt; st.acc+=dt; }\nfunction shiftBuffer(){\n  var drop=BUF-CAP;\n  SKEYS.forEach(function(k){ S[k].copyWithin(0,drop,BUF); });\n  st.base+=drop; st.w=CAP;\n}\nfunction commit(){\n  var i=st.w, k;\n  for(k=0;k<K;k++){ S[SKEYS[k]][i]=st.A[k]/st.acc; st.A[k]=0; }\n  st.acc=0; st.w++; st.tMin++; st.dirty=true;\n  if(st.w>=BUF) shiftBuffer();\n}\nfunction advance(dtGame){\n  var remain=dtGame;\n  while(remain>1e-9){\n    prep();\n    var dt=Math.min(remain,60-st.acc,15);\n    if(dt<1e-6) dt=Math.min(remain,60-st.acc);\n    physics(dt); accumulate(dt);\n    st.secs+=dt; remain-=dt;\n    if(st.acc>=60-1e-7) commit();\n  }\n}\n\nEN.load=function(name){\n  SC=SCENARIOS[name]||SCENARIOS.mid; EN.scenario=SCENARIOS[name]?name:'mid';\n  st={secs:0,acc:0,A:new Float64Array(K),w:0,base:0,tMin:0,hr:-1,dy:-1,rng:mulberry(SC.seed),duty:new Array(CONSUMERS.length).fill(1),\n      counts:{},stored:0,dirty:false};\n  prep(); st.stored=(BASE_KWH+st.counts.bat*BATTERY_KWH)*0.5;\n  for(var m=0;m<CAP;m++){ prep(); physics(60); accumulate(60); st.secs+=60; commit(); }\n  st.dirty=false;\n  prep(); physics(1e-3); // актуальные «текущие» значения\n  emit('reset'); emit('data');\n};\nEN.setSpeed=function(v){ EN.speed=v; emit('speed'); };\nEN.setPeriod=function(id){ if(!PMAP[id]) return; EN.period=id; emit('period'); };\n\nvar lastTs=0;\nEN.run=function(){\n  function f(ts){\n    var dtR=lastTs?Math.min(0.25,(ts-lastTs)/1000):0; lastTs=ts;\n    if(EN.speed>0){ advance(dtR*EN.speed); }\n    if(st.dirty){ st.dirty=false; emit('data'); }\n    emit('frame',dtR);\n    root.requestAnimationFrame(f);\n  }\n  root.requestAnimationFrame(f);\n};\n\n/* ---------- чтение истории ---------- */\nfunction members(k){ var v=VIRT[k]; if(!v) return [[k,1]]; return v.map(function(m){ return typeof m==='string'?[m,1]:m; }); }\n// Ряды по бинам за период. mode: mean | energy (кВт·ч за бин) | max | min | last\nEN.series=function(keys,pid,mode,offsetMin){\n  var pp=PMAP[pid], n=pp.min/pp.bin, off=offsetMin||0, start=st.w-pp.min-off, out={n:n,bin:pp.bin,t0:st.tMin-pp.min-off,keys:{}};\n  mode=mode||'mean';\n  keys.forEach(function(key){\n    var ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), arr=new Float64Array(n);\n    for(var b=0;b<n;b++){\n      var s=start+b*pp.bin, acc=0, mx=-Infinity, mn=Infinity, v=0;\n      for(var i=0;i<pp.bin;i++){\n        v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n        acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n      }\n      arr[b]= mode==='mean'?acc/pp.bin : mode==='energy'?acc/60 : mode==='max'?mx : mode==='min'?mn : v;\n    }\n    out.keys[key]=arr;\n  });\n  return out;\n};\n// Итоги по ряду за период: mean/max/min (кВт или кВт·ч для stored) и sum (кВт·ч).\nEN.stat=function(key,pid,offsetMin){\n  var pp=PMAP[pid], ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), off=offsetMin||0, s=st.w-pp.min-off, acc=0, mx=-Infinity, mn=Infinity;\n  for(var i=0;i<pp.min;i++){\n    var v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n    acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n  }\n  return {mean:acc/pp.min, max:mx, min:mn, sum:acc/60, first:valueAt(key,s), last:valueAt(key,s+pp.min-1)};\n};\nfunction valueAt(key,idx){ var v=0; members(key).forEach(function(m){ v+=S[m[0]][idx]*m[1]; }); return v; }\nEN.deficitMinutes=function(pid,offsetMin){\n  var pp=PMAP[pid], off=offsetMin||0, s=st.w-pp.min-off, c=0, d=S.demand, u=S.supply;\n  for(var i=0;i<pp.min;i++){ if(d[s+i]-u[s+i]>0.02*d[s+i]+1e-6) c++; }\n  return c;\n};\nEN.tNow=function(){ return st.tMin; };\nEN.hasPrev=function(pid){ return PMAP[pid].min*2<=CAP; };\nEN.timeOf=function(absMin){\n  var t=absMin+OFFSET_MIN;\n  var day=Math.floor(t/DAY_MIN)+1, m=((t%DAY_MIN)+DAY_MIN)%DAY_MIN;\n  return {day:day,hh:Math.floor(m/60),mm:m%60,clock:m};\n};\nfunction p2(n){ return (n<10?'0':'')+n; }\nEN.clockStr=function(sec){ var m=Math.floor((sec%86400)/60); return p2(Math.floor(m/60))+':'+p2(m%60); };\nEN.nowStr=function(){ var c=EN.cur; return 'День '+c.day+' · '+EN.clockStr(c.clock); };\nEN.binLabel=function(t0,i,bin){\n  var a=EN.timeOf(t0+i*bin), b=EN.timeOf(t0+(i+1)*bin);\n  var s='День '+a.day+' · '+p2(a.hh)+':'+p2(a.mm);\n  if(bin>1) s+=' – '+p2(b.hh)+':'+p2(b.mm);\n  return s;\n};\n// Сетка «день × час» (для тепловой карты и суточного профиля). Пустые ячейки — NaN.\nEN.grid=function(key,days){\n  var lastAbs=st.tMin-1, lastDay=Math.floor((lastAbs+OFFSET_MIN)/DAY_MIN), rows=[], d, h;\n  var startAbs=st.tMin-CAP;\n  for(d=lastDay-days+1;d<=lastDay;d++){\n    var cells=new Float64Array(24);\n    for(h=0;h<24;h++){\n      var a0=d*DAY_MIN+h*60-OFFSET_MIN, sum=0, cnt=0;\n      for(var m=0;m<60;m++){\n        var ab=a0+m; if(ab<startAbs||ab>lastAbs) continue;\n        sum+=valueAt(key,ab-st.base); cnt++;\n      }\n      cells[h]=cnt?sum/cnt:NaN;\n    }\n    rows.push({day:d+1,cells:cells});\n  }\n  return rows;\n};\n// Последние N минут по одной точке (для «полоски» часа).\nEN.strip=function(key,minutes){\n  var out=new Float64Array(minutes), s=st.w-minutes;\n  for(var i=0;i<minutes;i++) out[i]=valueAt(key,s+i);\n  return out;\n};\n\n/* ---------- форматирование ---------- */\nvar PSC=[[1e-3,'Вт'],[1,'кВт'],[1e3,'МВт'],[1e6,'ГВт']];               // база: кВт\nvar ESC=[[1e-3,'Вт·ч'],[1,'кВт·ч'],[1e3,'МВт·ч'],[1e6,'ГВт·ч'],[1e9,'ТВт·ч']]; // база: кВт·ч\nvar JSC=[[1,'Дж'],[1e3,'кДж'],[1e6,'МДж'],[1e9,'ГДж'],[1e12,'ТДж']];    // база: Дж\nfunction digitsFor(a){ return a>=100?0:a>=10?1:2; }\nfunction pickScale(sc,v,def){\n  var a=Math.  class=\"en-btn\" data-sp=\"'+a[0]+'\">'+a[1]+'<\/button>'; }).join('');\n  host.innerHTML='<div class=\"en-ctl-g\"><span class=\"en-ctl-l\">Демо-база<\/span><span class=\"en-btns\">'+sc+'<\/span><\/div>'+\n    '<div class=\"en-ctl-g\"><span class=\"en-ctl-l\">Скорость<\/span><span class=\"en-btns\">'+sp+'<\/span><\/div>'+\n    '<div class=\"en-ctl-g en-ctl-clock\"><span class=\"en-ctl-l\">Игровое время<\/span><b id=\"enClock\" class=\"mono\">—<\/b><\/div>';\n  function sync(){\n    host.querySelectorAll('[data-sc]').forEach(function(b){ b.classList.toggle('active',b.dataset.sc===EN.scenario); });\n    host.querySelectorAll('[data-sp]').forEach(function(b){ b.classList.toggle('active',Number(b.dataset.sp)===EN.speed); });\n  }\n  host.addEventListener('click',function(e){\n    var a=e.target.closest('[data-sc]'); if(a){ EN.load(a.dataset.sc); sync(); return; }\n    var b=e.target.closest('[data-sp]'); if(b){ EN.setSpeed(Number(b.dataset.sp)); sync(); }\n  });\n  var clk=host.querySelector('#enClock');\n  EN.on('frame',function(){ clk.textContent=EN.nowStr(); });\n  sync();\n};\nEN.start=function(){ EN.load(EN.scenario); EN.run(); };\n\nroot.EN=EN;\nif(typeof module!=='undefined') module.exports=EN;\n})(typeof window!=='undefined'?window:global);\n<\/script>\n<script>\n(function(){\nvar $=function(id){ return document.getElementById(id); }, F=EN.fmt;\nEN.mountControls($('ctl')); EN.mountPeriods($('periods'));\n\n/* ---------- стойка ячеек ---------- */\nvar cellEls=[], cellCount=1;\nfunction buildRack(){\n  var bat=EN.counts.bat; cellCount=Math.min(40,Math.max(1,bat));\n  var h=''; for(var i=0;i<cellCount;i++) h+='<div class=\"b-cw\"><div class=\"b-cell\"><i class=\"b-cf\"><\/i><\/div><\/div>';\n  $('cells').style.gridTemplateColumns=cellCount<=4?'repeat(auto-fill,minmax(96px,120px))':'';\n  $('cells').style.justifyContent=cellCount<=4?'center':'';\n  $('cells').innerHTML=h; cellEls=[].slice.call($('cells').querySelectorAll('.b-cell'));\n  var per=EN.cur.cap/cellCoun innerHTML='<span>Ёмкость <b>'+cp.text+'<\/b><\/span><span>Базовый запас <b>'+F.stored(EN.BASE_KWH).text+'<\/b><\/span><span>Один аккумулятор <b>'+F.stored(EN.BATTERY_KWH).text+'<\/b><\/span>';\n  // манометры\n  $('gSup').setAttribute('stroke-dasharray',(c.frac*100).toFixed(1)+' 100'); $('gSup').setAttribute('stroke',c.frac>=.999?'#4ADE9B':c.frac>=.5?'#F0B93D':'#F4557B');\n  $('gSupV').textContent=F.pct(c.frac*100,c.frac>0&&c.frac<.995?1:0); $('gSupS').textContent=F.power(c.supply).text+' из '+F.power(c.demand).text;\n  var np=c.nameplate>0?c.gen/c.nameplate:0;\n  $('gProd').setAttribute('stroke-dasharray',(np*100).toFixed(1)+' 100'); $('gProdV').textContent=F.power(c.gen).text; $('gProdS').textContent='из '+F.power(c.nameplate).text+' · солнце '+F.pct(c.sun*100);\n}\n\n/* ---------- графики ---------- */\nvar chBat=EN.chart($('chBat'),{kind:'line',unit:'joule',height:300,\n  series:[{key:'stored',label:'Заряд',color:'#4FD1E7',fill:true},{key:'capKWh',label:'Ёмкость',color:'#4FD1E7',dash:[5,4],width:1.1}]});\nvar chSup=EN.chart($('chSup'),{kind:'line',unit:'power',height:220,\n  series:[{key:'supply',label:'Получено',color:'#4ADE9B',fill:true},{key:'demand',label:'Потребность',color:'#B9C2E0',dash:[4,3],width:1.3}],between:{top:'demand',bottom:'supply',color:'#F4557B'}});\nvar chProd=EN.chart($('chProd'),{kind:'line',unit:'power',height:220,\n  series:[{key:'gen',label:'Выработка',color:'#FFDD57',fill:true},{key:'nameplate',label:'Установлено',color:'#FFDD57',dash:[5,4],width:1.1}]});\nfunction legends(){\n  EN.legend($('lgBat'),chBat.o.series,function(){ chBat.draw(); });\n  EN.legend($('lgSup'),chSup.o.series,function(){ chSup.draw(); });\n  EN.legend($('lgProd'),chProd.o.series,function(){ chProd.draw(); });\n}\n\n/* ---------- итоги за период ---------- */\nfunction fact(l,v){ return '<div class=\"b-fact\"><div class=\"b-fact-l\">'+l+'<\/div><div class=\"b-fact-v\">'+v+'<\/div><\/div>'; }\nfunction frow(l,val,max,color,txt){ return '<div class=\"b-fr\"><span>'+l+'<\/span><div class=\"bar\"><i style=\"width:'+Math.max(0,Math.min(100,max>0?val/max*100:0)).toFixed(1)+'%;background:'+color+'\"><\/i><\/div><b>'+txt+'<\/b><\/div>'; }\nfunction heavy(){\n  var p=EN.period, pp=EN.PMAP[p], s=EN.stat('stored',p), fl=EN.series(['flow'],p,'mean').keys.flow, bin=EN.PMAP[p].bin;\n  var dis=0, chg=0, disMin=0, chgMin=0;\n  for(var i=0;i<fl.length;i++){ if(fl[i]<-1){ dis+=-fl[i]*bin/60; disMin+=bin; } else if(fl[i]>1){ chg+=fl[i]*bin/60; chgMin+=bin; } }\n  $('batStats').innerHTML=fact('Минимум',F.stored(s.min).text)+fact('Среднее',F.stored(s.mean).text)+fact('Максимум',F.stored(s.max).text)+\n    fact('Отдано '+pp.phrase,F.stored(dis).text)+fact('Принято '+pp.phrase,F.stored(chg).text)+fact('Циклов разряда',(dis/Math.max(1,EN.cur.cap)).toFixed(dis/EN.cur.cap>=10?0:1))+\n    fact('Время в разряде',F.dur(disMin/60))+fact('Время в заряде',F.dur(chgMin/60));\n  var g=EN.stat('gen',p), u=EN.stat('supply',p), cu=EN.stat('curtail',p), d=EN.stat('demand',p), dSt=s.last-s.first;\n  $('flowTitle').textContent='Куда ушла энергия '+pp.phrase;\n  $('flow').innerHTML=frow('Выработано',g.sum,g.sum,'#FFDD57',F.energy(g.sum).text)+\n    frow('Потреблено базой',u.sum,g.sum,'#4ADE9B',F.energy(u.sum).text+' · '+F.pct(g.sum>0?u.sum/g.sum*100:0))+\n    frow('В аккумуляторы (итого)',Math.max(0,dSt),g.sum,'#4FD1E7',(dSt>=0?'+':'−')+F.energy(Math.abs(dSt)).text)+\n    frow('Сброшено излишка',cu.sum,g.sum,'#8C93B0',F.energy(cu.sum).text+' · '+F.pct(g.sum>0?cu.sum/g.sum*100:0))+\n    frow('Не хватило базе',d.sum-u.sum,d.sum,'#F4557B',F.energy(d.sum-u.sum).text);\n  chBat.draw(); chSup.draw(); chProd.draw();\n}\n\nvar dirty=true, lastHeavy=0;\nEN.on('data',function(){ dirty=true; });\nEN.on('period',function(){ dirty=true; lastHeavy=0; });\nEN.on('reset',function(){ buildRack(); legends(); dirty=true; lastHeavy=0; });\nEN.on('frame',function(){\n  live(); var now=performance.now();\n  if(dirty&&now-lastHeavy>400){ dirty=false; lastHeavy=now; heavy(); }\n});\nEN.start();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Энергосистема · Вариант 4 · Циферблат и календарь<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>/* Общие стили демо-страниц энергосистемы: палитра игры (css/base.css), панель демо-управления,\n   вкладки периодов, подсказки графиков. Каждый вариант добавляет свои стили поверх. */\n:root{\n  color-scheme:dark;\n  --bg:#0A0D18;--panel:#12172A;--card:#171D33;--card-hover:#1E2640;--border:#293150;--border-strong:#3A4468;\n  --text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;\n  --tier0:#4FD1E7;--tier1:#F2A93B;--energy:#FFDD57;--water:#49B8F0;--good:#4ADE9B;--bad:#F4557B;--skill:#B388FF;--ink:#0A0D18;\n  --supply:#4ADE9B;--prod:#FFDD57;--batt:#4FD1E7;--demand:#B9C2E0;\n  --en-grid:rgba(255,255,255,.07);--en-night:rgba(4,7,20,.55);\n  --font-display:'Rajdhani',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;\n}\n*{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.45;}\nbutton{font:inherit;color:inherit;}\n.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.en-page{max-width:1240px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:16px;}\n.en-eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}\n.en-h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:.01em;}\n.en-sub{font-size:13px;color:var(--text-secondary);margin:4px 0 0;max-width:78ch;}\n.en-back{display:inline-block;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:6px;}\n.en-back:hover{color:var(--text-primary);}\n\n/* панель демо-управления */\n.en-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:9px 14px;border-radius:12px;background:linear-gradient(180deg,#1A2143,#0E1328);border:1px solid #2B3563;}\n.en-ctl-g{display:flex;align-items:center;gap:9px;}\n.en-ctl-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}\n.en-btns{display:inline-flex;gap:4px;flex-wrap:wrap;}\n.en-btn{font-family:var(--font-mono);font-size:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;}\n.en-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-btn.active{background:var(--skill);border-color:var(--skill);color:#0A0D18;}\n.en-btn:focus-visible,.en-tab:focus-visible,.en-chip:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.en-ctl-clock{margin-left:auto;}\n.en-ctl-clock b{font-size:14px;font-weight:500;color:var(--text-primary);}\n\n/* вкладки периодов */\n.en-tabs{display:flex;gap:4px;flex-wrap:wrap;}\n.en-tab{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;\n  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;}\n.en-tab:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}\n\n/* графики */\n.en-chartbox{width:100%;}\n.en-chartbox canvas{display:block;touch-action:pan-y;}\n.en-tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;max-width:260px;padding:8px 10px;border-radius:8px;background:rgba(10,13,24,.96);border:1px solid var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:12px;}\n.en-tip[hidden]{display:none;}\n.en-tip-t{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-bottom:5px;white-space:nowrap;}\n.en-tip-row{display:flex;align-items:center;gap:7px;padding:1px 0;}\n.en-tip-row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}\n.en-tip-row span{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.en-tip-row b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap;}\n.en-tip-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}\n.en-legend{display:flex;flex-wrap:wrap;gap:5px;}\n.en-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}\n.en-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}\n.en-chip:hover{color:var(--text-primary);}\n.en-chip.off{opacity:.42;}\n.en-chip.off i{background:var(--border-strong)!important;}\n\n@media (max-width:640px){\n  .en-page{padding:14px 12px 48px;}\n  .en-h1{font-size:24px;}\n  .en-ctl{padding:9px 10px;gap:8px 14px;}\n  .en-ctl-clock{margin-left:0;}\n  .en-tab{padding:7px 11px;font-size:13px;}\n}\n@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }\n<\/style>\n<style>\n/* Вариант 4 — «Циферблат и календарь»: суточный ритм на круглом циферблате + тепловая карта «день × час». */\n.c-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}\n.c-mini{background:linear-gradient(180deg,#171D33,#12172A);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:0;}\n.c-mini-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);}\n.c-mini-v{font-family:var(--font-mono);font-size:22px;font-weight:500;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;}\n.c-mini-s{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);margin-top:1px;}\n.c-mbar{height:6px;border-radius:3px;background:#0B1022;margin-top:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}\n.c-mbar i{display:block;height:100%;transition:width .35s;}\n\n.c-main{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:14px;align-items:start;}\n.c-card{background:linear-gradient(180deg,#151B31,#0F1424);border:1px solid var(--border);border-radius:16px;padding:14px 16px;min-width:0;}\n.c-card h2{margin:0 0 2px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.02em;}\n.c-card p.c-note{margin:0 0 8px;font-size:12px;color:var(--text-secondary);}\n.c-dial svg{display:block;width:100%;height:auto;}\n.c-dial text{font-family:var(--font-mono);}\n.c-wedge{fill:transparent;cursor:crosshair;}\n.c-wedge:hover{fill:rgba(255,255,255,.07);}\n.c-read{min-height:64px;margin-top:6px;padding:9px 12px;border-radius:10px;background:#0B1022;border:1px solid #16203C;font-size:12.5px;color:var(--text-secondary);}\n.c-read b{font-family:var(--font-mono);font-weight:500;color:var(--text-primary);}\n.c-read .r{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:3px;}\n.c-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-secondary);margin-top:8px;}\n.c-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}\n\n.c-tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;}\n.c-tools .en-btn{font-family:var(--font-body);font-size:12.5px;padding:6px 12px;}\n.c-tools .en-btn.active{background:var(--tier0);border-color:var(--tier0);color:#0A0D18;}\n.c-hm{position:relative;}\n.c-hm canvas{display:block;width:100%;cursor:crosshair;}\n.c-legend{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-secondary);font-family:var(--font-mono);}\n.c-legend .grad{flex:1;max-width:280px;height:10px;border-radius:5px;border:1px solid #16203C;}\n\n.c-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}\n.c-kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;}\n.c-kpi-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}\n.c-kpi-v{font-family:var(--font-mono);font-size:17px;font-weight:500;margin-top:2px;white-space:nowrap;}\n.c-kpi-s{font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);}\n\n@media (max-width:980px){ .c-main{grid-template-columns:1fr;} .c-head{grid-template-columns:1fr;} }\n<\/style>\n<\/head>\n<body>\n<div class=\"en-page\">\n  <header>\n    <div class=\"en-eyebrow\">Вариант 4 · Циферблат и календарь<\/div>\n    <h1 class=\"en-h1\">Суточный ритм энергосистемы<\/h1>\n    <p class=\"en-sub\">На циферблате видно, в какие часы суток база вырабатывает и тратит энергию (усреднённо за выбранный период). Тепловая карта показывает то же по дням: где были провалы и излишки.<\/p>\n  <\/header>\n  <div id=\"ctl\"><\/div>\n\n  <section class=\"c-head\">\n    <div class=\"c-mini\"><div class=\"c-mini-l\">Обеспечение<\/div><div class=\"c-mini-v\" id=\"hSup\">—<\/div><div class=\"c-mini-s\" id=\"hSupS\">—<\/div><div class=\"c-mbar\"><i id=\"hSupB\" style=\"width:0\"><\/i><\/div><\/div>\n    <div class=\"c-mini\"><div class=\"c-mini-l\">Производство<\/div><div class=\"c-mini-v\" id=\"hProd\">—<\/div><div class=\"c-mini-s\" id=\"hProdS\">—<\/div><div class=\"c-mbar\"><i id=\"hProdB\" style=\"width:0;background:#FFDD57\"><\/i><\/div><\/div>\n    <div class=\"c-mini\"><div class=\"c-mini-l\">Заряд аккумулятора<\/div><div class=\"c-mini-v\" id=\"hBat\">—<\/div><div class=\"c-mini-s\" id=\"hBatS\">—<\/div><div class=\"c-mbar\"><i id=\"hBatB\" style=\"width:0;background:#4FD1E7\"><\/i><\/div><\/div>\n  <\/section>\n\n  <div id=\"periods\"><\/div>\n\n  <section class=\"c-main\">\n    <div class=\"c-card c-dial\">\n      <h2>Профиль суток<\/h2>\n      <p class=\"c-note\" id=\"dialNote\">—<\/p>\n      <svg id=\"dial\" viewBox=\"0 0 480 480\" role=\"img\" aria-label=\"Суточный циферблат выработки и потребления\"><\/svg>\n      <div class=\"c-read\" id=\"dialRead\">Наведите курсор на любой час циферблата.<\/div>\n      <div class=\"c-key\"><span><i style=\"background:#FFDD57\"><\/i>Выработка (наружу)<\/span><span><i style=\"background:#5AA9FF\"><\/i>Потребление (внутрь)<\/span><span><i style=\"background:#4FD1E7\"><\/i>Заряд в центре<\/span><\/div>\n    <\/div>\n    <div class=\"c-card\">\n      <h2>Календарь по часам<\/h2>\n      <p class=\"c-note\" id=\"hmNote\">—<\/p>\n      <div class=\"c-tools\" id=\"hmTools\" role=\"group\" aria-label=\"Показатель тепловой карты\"><\/div>\n      <div class=\"c-hm\" id=\"hm\"><canvas id=\"hmCv\"><\/canvas><\/div>\n      <div class=\"c-read\" id=\"hmRead\" style=\"margin-top:10px\">Наведите курсор на ячейку карты.<\/div>\n      <div class=\"c-legend\"><span id=\"lgMin\">—<\/span><div class=\"grad\" id=\"lgGrad\"><\/div><span id=\"lgMax\">—<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"c-strip\" id=\"strip\"><\/section>\n<\/div>\n\n<script>/* Общий «движок» демо-страниц энергосистемы: физика базы, история на 90 суток, единицы, графики.\n *\n * Модель повторяет правила игры (js/core.js): солнечная панель даёт 10 ⚡ за цикл 60 с, установки\n * тратят power ⚡ за свой цикл, аккумулятор 400 ⚡, базовый запас 150 ⚡, а если энергии не хватает,\n * ВСЕ потребители сбавляют ход в одной и той же пропорции (powerFraction). Единица «⚡» здесь\n * считается 1 кВт·ч (KWH_PER_UNIT), поэтому 10 ⚡ за 60 с = 600 кВт, а ёмкость батареи = 400 кВт·ч.\n * В самой игре истории пока нет — при интеграции нужно писать такие же минутные срезы в state.\n */\n(function(root){\n'use strict';\n\nvar KWH_PER_UNIT=1, J_PER_KWH=3.6e6;\nvar DAY_MIN=1440, CAP_DAYS=90, CAP=CAP_DAYS*DAY_MIN, BUF=CAP+10*DAY_MIN;\nvar SOLAR_KW=600*KWH_PER_UNIT, BATTERY_KWH=400*KWH_PER_UNIT, BASE_KWH=150*KWH_PER_UNIT;\nvar OFFSET_MIN=10*60+30; // «сейчас» = 10:30 игрового дня: утро, аккумуляторы заряжаются\n\nvar CONSUMERS=[\n  {id:'iron',  name:'Железная руда', short:'Fe₂O₃', group:'mining', kw:72,    color:'#9FB0C8'},\n  {id:'copper',name:'Медная руда',   short:'Cu₂S',  group:'mining', kw:72,    color:'#E08A4B'},\n  {id:'coal',  name:'Уголь',         short:'C',     group:'mining', kw:60,    color:'#8B85A6'},\n  {id:'stone', name:'Камень',        short:'CaCO₃', group:'mining', kw:56.84, color:'#C2AD82'},\n  {id:'water', name:'Бурение воды',  short:'H₂O',   group:'drill',  kw:51.43, color:'#49B8F0'},\n  {id:'oil',   name:'Бурение нефти', short:'CxHy',  group:'drill',  kw:72,    color:'#B08D57'},\n  {id:'wheat', name:'Пшеница',       short:'Triticum',    group:'farm', kw:30,    color:'#E8D078'},\n  {id:'potato',name:'Картофель',     short:'Solanum tub.',group:'farm', kw:27.69, color:'#A9865B'},\n  {id:'corn',  name:'Кукуруза',      short:'Zea mays',    group:'farm', kw:31.3,  color:'#F0B93D'},\n  {id:'tomato',name:'Томаты',        short:'Solanum lyc.',group:'farm', kw:36,    color:'#E1503D'}\n];\nvar GROUPS=[\n  {id:'mining',name:'Горнодобыча',color:'#C9A227'},\n  {id:'drill', name:'Бурение',    color:'#49B8F0'},\n  {id:'farm',  name:'Фермы',      color:'#8CAF52'}\n];\nvar SCENARIOS={\n  start:{label:'Старт',         hint:'1 панель, без аккумуляторов', solar:1,  bat:0,   seed:11, growth:1,\n         cons:{iron:1,copper:1,water:1}},\n  mid:  {label:'Развитая база', hint:'12 панелей, 45 аккумуляторов',solar:12, bat:45,  seed:23, growth:1.15,\n         cons:{iron:6,copper:5,coal:4,stone:3,water:3,oil:3,wheat:3,potato:2,corn:2,tomato:2}},\n  big:  {label:'Промышленная',  hint:'60 панелей, 200 аккумуляторов',solar:60, bat:200, seed:37, growth:1.15,\n         cons:{iron:30,copper:25,coal:20,stone:15,water:15,oil:15,wheat:15,potato:10,corn:10,tomato:10}}\n};\nvar PERIODS=[\n  {id:'h1', label:'1 час',    phrase:'за последний час',   min:60,     bin:1},\n  {id:'d1', label:'Сутки',    phrase:'за последние сутки', min:1440,   bin:10},\n  {id:'d7', label:'Неделя',   phrase:'за неделю',          min:10080,  bin:60},\n  {id:'d30',label:'Месяц',    phrase:'за месяц',           min:43200,  bin:240},\n  {id:'d90',label:'3 месяца', phrase:'за 3 месяца',        min:129600, bin:720}\n];\nvar PMAP={}; PERIODS.forEach(function(p){ PMAP[p.id]=p; });\n\nvar SKEYS=['gen','curtail','demand','supply','flow','stored','nameplate','capKWh'].concat(CONSUMERS.map(function(c){return c.id;}));\nvar K=SKEYS.length, KI={}; SKEYS.forEach(function(k,i){ KI[k]=i; });\n// Виртуальные ряды: сумма (с весами) настоящих рядов.\nvar VIRT={\n  g_mining:CONSUMERS.filter(function(c){return c.group==='mining';}).map(function(c){return c.id;}),\n  g_drill: CONSUMERS.filter(function(c){return c.group==='drill';}).map(function(c){return c.id;}),\n  g_farm:  CONSUMERS.filter(function(c){return c.group==='farm';}).map(function(c){return c.id;}),\n  unmet:[['demand',1],['supply',-1]],\n  balance:[['gen',1],['demand',-1]],\n  used:[['gen',1],['curtail',-1]]\n};\n\nvar EN={\n  KWH_PER_UNIT:KWH_PER_UNIT, J_PER_KWH:J_PER_KWH, SOLAR_KW:SOLAR_KW, BATTERY_KWH:BATTERY_KWH, BASE_KWH:BASE_KWH,\n  CONSUMERS:CONSUMERS, GROUPS:GROUPS, SCENARIOS:SCENARIOS, PERIODS:PERIODS, PMAP:PMAP, CAP:CAP, DAY_MIN:DAY_MIN,\n  period:'d1', speed:600, scenario:'mid', cur:{}, counts:{}, paused:false\n};\n\n/* ---------- события ---------- */\nvar handlers={};\nEN.on=function(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); };\nfunction emit(ev,a){ (handlers[ev]||[]).forEach(function(f){ f(a); }); }\n\n/* ---------- физика ---------- */\nvar S={}; SKEYS.forEach(function(k){ S[k]=new Float32Array(BUF); });\nvar st={}, SC=null, P=new Float64Array(K), dem=new Float64Array(CONSUMERS.length);\n\nfunction mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nfunction sunFactor(clockSec){\n  var t=clockSec%86400;\n  if(t<21600||t>72000) return 0;\n  return Math.sin((t-21600)/50400*Math.PI);\n}\nEN.sunFactor=sunFactor;\n\nfunction countsFor(dayIdx){\n  var g=Math.pow(Math.min(1,Math.max(0,dayIdx/CAP_DAYS)),SC.growth||1.15), n={};\n  n.solar=Math.max(1,Math.ceil(SC.solar*g));\n  n.bat=SC.bat>0?Math.ceil(SC.bat*Math.min(1,g*1.08)):0;\n  CONSUMERS.forEach(function(c){ var f=SC.cons[c.id]||0; n[c.id]=f?Math.ceil(f*g):0; });\n  return n;\n}\nfunction rollDuty(){\n  for(var i=0;i<CONSUMERS.length;i++){\n    var r=st.rng();\n    st.duty[i]= r<.68?1: r<.83?.85: r<.93?.6: r<.98?.3: 0; // доля установок группы, реально работающих в этот час\n  }\n}\nfunction prep(){\n  var a=Math.floor((st.secs+OFFSET_MIN*60)/3600);\n  if(a!==st.hr){ st.hr=a; rollDuty(); }\n  var d=Math.floor((st.secs+OFFSET_MIN*60)/86400);\n  if(d!==st.dy){ st.dy=d; st.counts=countsFor(d); EN.counts=st.counts; }\n}\nfunction physics(dt){\n  var clock=(st.secs+OFFSET_MIN*60)%86400, sun=sunFactor(clock), n=st.counts;\n  var gen=n.solar*SOLAR_KW*sun, np=n.solar*SOLAR_KW, D=0, i;\n  for(i=0;i<CONSUMERS.length;i++){ dem[i]=n[CONSUMERS[i].id]*CONSUMERS[i].kw*st.duty[i]; D+=dem[i]; }\n  var cap=BASE_KWH+n.bat*BATTERY_KWH;\n  var avail=st.stored+gen*dt/3600, need=D*dt/3600;\n  var frac=need>1e-12?Math.min(1,avail/need):1;\n  var left=avail-need*frac, ns=Math.min(cap,left), spill=left-ns;\n  P[0]=gen; P[1]=spill*3600/dt; P[2]=D; P[3]=D*frac; P[4]=(ns-st.stored)*3600/dt; P[5]=ns; P[6]=np; P[7]=cap;\n  for(i=0;i<CONSUMERS.length;i++) P[8+i]=dem[i]*frac;\n  st.stored=ns; st.frac=frac; st.sun=sun; st.clock=clock;\n  var c=EN.cur;\n  c.sun=sun; c.gen=gen; c.nameplate=np; c.curtail=P[1]; c.demand=D; c.supply=P[3]; c.frac=frac; c.flow=P[4];\n  c.stored=ns; c.cap=cap; c.pct=cap>0?ns/cap*100:0; c.clock=clock; c.secs=st.secs; c.day=Math.floor((st.secs+OFFSET_MIN*60)/86400)+1;\n  c.cons=c.cons||{};\n  for(i=0;i<CONSUMERS.length;i++){ c.cons[CONSUMERS[i].id]=P[8+i]; }\n  c.duty=st.duty;\n}\nfunction accumulate(dt){ for(var k=0;k<K;k++) st.A[k]+=P[k]*dt; st.acc+=dt; }\nfunction shiftBuffer(){\n  var drop=BUF-CAP;\n  SKEYS.forEach(function(k){ S[k].copyWithin(0,drop,BUF); });\n  st.base+=drop; st.w=CAP;\n}\nfunction commit(){\n  var i=st.w, k;\n  for(k=0;k<K;k++){ S[SKEYS[k]][i]=st.A[k]/st.acc; st.A[k]=0; }\n  st.acc=0; st.w++; st.tMin++; st.dirty=true;\n  if(st.w>=BUF) shiftBuffer();\n}\nfunction advance(dtGame){\n  var remain=dtGame;\n  while(remain>1e-9){\n    prep();\n    var dt=Math.min(remain,60-st.acc,15);\n    if(dt<1e-6) dt=Math.min(remain,60-st.acc);\n    physics(dt); accumulate(dt);\n    st.secs+=dt; remain-=dt;\n    if(st.acc>=60-1e-7) commit();\n  }\n}\n\nEN.load=function(name){\n  SC=SCENARIOS[name]||SCENARIOS.mid; EN.scenario=SCENARIOS[name]?name:'mid';\n  st={secs:0,acc:0,A:new Float64Array(K),w:0,base:0,tMin:0,hr:-1,dy:-1,rng:mulberry(SC.seed),duty:new Array(CONSUMERS.length).fill(1),\n      counts:{},stored:0,dirty:false};\n  prep(); st.stored=(BASE_KWH+st.counts.bat*BATTERY_KWH)*0.5;\n  for(var m=0;m<CAP;m++){ prep(); physics(60); accumulate(60); st.secs+=60; commit(); }\n  st.dirty=false;\n  prep(); physics(1e-3); // актуальные «текущие» значения\n  emit('reset'); emit('data');\n};\nEN.setSpeed=function(v){ EN.speed=v; emit('speed'); };\nEN.setPeriod=function(id){ if(!PMAP[id]) return; EN.period=id; emit('period'); };\n\nvar lastTs=0;\nEN.run=function(){\n  function f(ts){\n    var dtR=lastTs?Math.min(0.25,(ts-lastTs)/1000):0; lastTs=ts;\n    if(EN.speed>0){ advance(dtR*EN.speed); }\n    if(st.dirty){ st.dirty=false; emit('data'); }\n    emit('frame',dtR);\n    root.requestAnimationFrame(f);\n  }\n  root.requestAnimationFrame(f);\n};\n\n/* ---------- чтение истории ---------- */\nfunction members(k){ var v=VIRT[k]; if(!v) return [[k,1]]; return v.map(function(m){ return typeof m==='string'?[m,1]:m; }); }\n// Ряды по бинам за период. mode: mean | energy (кВт·ч за бин) | max | min | last\nEN.series=function(keys,pid,m — провалы, зелёное — норма.'},\n  {id:'gen', label:'Выработка',   note:'Сколько вырабатывали панели.'},\n  {id:'dem', label:'Потребление', note:'Сколько энергии просили установки.'},\n  {id:'chg', label:'Заряд',       note:'Наполненность аккумуляторов в процентах.'}\n], metric='bal', hm={cells:null,rows:0,cols:24,label:[]}, cv=$('hmCv'), ctx=cv.getContext('2d'), hmHover=null, geom=null;\nfunction buildTools(){\n  $('hmTools').innerHTML=METRICS.map(function(m){ return '<button type=\"button\" class=\"en-btn'+(m.id===metric?' active':'')+'\" data-m=\"'+m.id+'\">'+m.label+'<\/button>'; }).join('');\n}\n$('hmTools').addEventListener('click',function(e){ var b=e.target.closest('[data-m]'); if(!b) return; metric=b.dataset.m; buildTools(); heavy(); });\nfunction lerp(a,b,t){ return a+(b-a)*t; }\nfunction mix(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }\nvar DARK=[13,19,38];\nfunction colorOf(v,scale){\n  if(v!==v) return null;\n  var t;\n  if(metric==='bal'){ t=Math.max(-1,Math.min(1,v/scale)); return t>=0?mix(DARK,[74,222,155],Math.pow(t,.7)):mix(DARK,[244,85,123],Math.pow(-t,.7)); }\n  if(metric==='sup'){ t=Math.max(0,Math.min(1,v/100)); return t<.6?mix([244,85,123],[240,185,61],t/.6):mix([240,185,61],[74,222,155],(t-.6)/.4); }\n  t=Math.max(0,Math.min(1,v/scale)); var base=metric==='gen'?[255,221,87]:metric==='dem'?[90,169,255]:[79,209,231]; return mix(DARK,base,Math.pow(t,.8));\n}\nfunction cellValues(days){\n  var p=EN.period;\n  if(p==='h1'){\n    var s=function(k){ return EN.strip(k,60); };\n    var A=metric==='bal'?s('balance'):metric==='gen'?s('gen'):metric==='dem'?s('demand'):null, out=new Float64Array(60), i;\n    if(metric==='sup'){ var su=s('supply'), de=s('demand'); for(i=0;i<60;i++) out[i]=de[i]>0?su[i]/de[i]*100:100; }\n    else if(metric==='chg'){ var st=s('stored'), cp=s('capKWh'); for(i=0;i<60;i++) out[i]=cp[i]>0?st[i]/cp[i]*100:0; }\n    else out=A;\n    return {rows:1,cols:60,cells:out,labels:['последний час']};\n  }\n  var g=function(k){ return EN.grid(k,days); }, rows, out, r, h;\n  if(metric==='sup'){ var a=g('supply'), b=g('demand'); rows=a; out=new Float64Array(days*24); for(r=0;r<days;r++) for(h=0;h<24;h++){ var d=b[r].cells[h]; out[r*24+h]=d>0?a[r].cells[h]/d*100:(d===d?100:NaN); } }\n  else if(metric==='chg'){ var a2=g('stored'), b2=g('capKWh'); rows=a2; out=new Float64Array(days*24); for(r=0;r<days;r++) for(h=0;h<24;h++){ var c=b2[r].cells[h]; out[r*24+h]=c>0?a2[r].cells[h]/c*100:NaN; } }\n  else { rows=g(metric==='bal'?'balance':metric==='gen'?'gen':'demand'); out=new Float64Array(days*24); for(r=0;r<days;r++) for(h=0;h<24;h++) out[r*24+h]=rows[r].cells[h]; }\n  return {rows:days,cols:24,cells:out,labels:rows.map(function(x){ return x.day; })};\n}\nfunction drawHeat(){\n  var p=EN.period, days=p==='h1'?1:p==='d1'?2:p==='d7'?7:p==='d30'?30:90, d=cellValues(days);\n  var W=$('hm').clientWidth; if(!W) return;\n  var ml=40, mt=20, mr=4, cw=(W-ml-mr)/d.cols, ch=d.rows===1?34:Math.max(5,Math.min(24,Math.floor(360/d.rows))), H=mt+d.rows*ch+6, dpr=window.devicePixelRatio||1;\n  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);\n  var scale=1, i, vmax=0;\n  for(i=0;i<d.cells.length;i++){ var v=d.cells[i]; if(v===v){ var av=metric==='bal'?Math.abs(v):v; if(av>vmax) vmax=av; } }\n  scale=vmax>0?vmax:1;\n  ctx.font='11px \"IBM Plex Mono\",monospace'; ctx.fillStyle='#606A8A'; ctx.textBaseline='alphabetic';\n  if(d.cols===24){ ctx.textAlign='center'; for(var h=0;h<24;h+=3) ctx.fillText((h<10?'0':'')+h,ml+cw*(h+0.5),12); }\n  else { ctx.textAlign='center'; [0,15,30,45].forEach(function(m){ ctx.fillText('−'+(60-m)+' м',ml+cw*(m+0.5),12); }); ctx.fillText('сейчас',ml+cw*59.2,12); }\n  var step=Math.max(1,Math.ceil(d.rows/9)); ctx.textAlign='right';\n  for(var r=0;r<d.rows;r++){\n    if(d.cols===24&&(r%step===0||r===d.rows-1)){ ctx.fillStyle='#606A8A'; ctx.fillText('Д'+d.labels[r],ml-6,mt+r*ch+ch/2+4); }\n    for(var c=0;c<d.cols;c++){\n      var col=colorOf(d.cells[r*d.cols+c],scale), x=ml+c*cw, y=mt+r*ch;\n      if(col){ ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')'; ctx.fillRect(x,y,cw+0.6,ch+0.6); }\n      else { ctx.fillStyle='#0A0F20'; ctx.fillRect(x,y,cw+0.6,ch+0.6); }\n    }\n  }\n  if(ch>=8&&d.cols===24){ ctx.strokeStyle='rgba(8,12,27,.55)'; ctx.lineWidth=1; for(var rr=1;rr<d.rows;rr++){ ctx.beginPath(); ctx.moveTo(ml,mt+rr*ch+.5); ctx.lineTo(W-mr,mt+rr*ch+.5); ctx.stroke(); } }\n  geom={ml:ml,mt:mt,cw:cw,ch:ch,d:d,scale:scale};\n  if(hmHover&&hmHover.r<d.rows&&hmHover.c<d.cols){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(ml+hmHover.c*cw,mt+hmHover.r*ch,cw,ch); }\n  var m=METRICS.filter(function(x){ return x.id===metric; })[0]; $('hmNote').textContent=m.note+' '+(p==='h1'?'Одна строка — минуты последнего часа.':'Строки — игровые дни, столбцы — часы суток.');\n  // легенда\n  var g=$('lgGrad'), stops=[], N=8, t;\n  for(i=0;i<=N;i++){ t=i/N; var v=metric==='bal'?(t*2-1)*scale:metric==='sup'||metric==='chg'?t*100:t*scale, cc=colorOf(v,scale); stops.push('rgb('+Math.round(cc[0])+','+Math.round(cc[1])+','+Math.round(cc[2])+')'); }\n  g.style.background='linear-gradient(90deg,'+stops.join(',')+')';\n  var fm=function(v){ return metric==='sup'||metric==='chg'?F.pct(v):(v<0?'−':(metric==='bal'?'+':''))+F.power(Math.abs(v)).text; };\n  $('lgMin').textContent=metric==='bal'?fm(-scale):metric==='sup'||metric==='chg'?'0%':'0'; $('lgMax').textContent=fm(metric==='sup'||metric==='chg'?100:scale);\n}\ncv.addEventListener('pointermove',function(e){\n  if(!geom) return; var r=cv.getBoundingClientRect(), x=e.clientX-r.left-geom.ml, y=e.clientY-r.top-geom.mt;\n  var c=Math.floor(x/geom.cw), rr=Math.floor(y/geom.ch);\n  if(c<0||rr<0||c>=geom.d.cols||rr>=geom.d.rows){ hmHover=null; drawHeat(); return; }\n  hmHover={r:rr,c:c}; drawHeat();\n  var v=geom.d.cells[rr*geom.d.cols+c], txt;\n  if(v!==v) txt='нет данных'; else if(me
