<style>
:root{color-scheme:dark;--bg:#0A0D18;--card:#171D33;--border:#293150;--border-strong:#3A4468;--text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;--tier1:#F2A93B;}
*{box-sizing:border-box;} html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;}

.tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}
.tab:hover{color:var(--text-primary);border-color:var(--border-strong);}
.tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}
.tab:focus-visible{outline:2px solid #4FD1E7;outline-offset:2px;}
.tab b{font-family:'IBM Plex Mono',monospace;font-weight:500;margin-right:6px;opacity:.7;}
.frames{flex:1;position:relative;min-height:0;}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none;}
iframe.on{display:block;}
@media (max-width:640px){ .bar h1{display:none;} }
</style>

<script>
var NAMES=["Диспетчерская", "Мнемосхема", "Батарейный банк", "Циферблат и календарь", "Журнал"];
var DOCS=["<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Энергосистема · Вариант 1 · Диспетчерская<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>/* Общие стили демо-страниц энергосистемы: палитра игры (css/base.css), панель демо-управления,\n   вкладки периодов, подсказки графиков. Каждый вариант добавляет свои стили поверх. */\n:root{\n  color-scheme:dark;\n  --bg:#0A0D18;--panel:#12172A;--card:#171D33;--card-hover:#1E2640;--border:#293150;--border-strong:#3A4468;\n  --text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;\n  --tier0:#4FD1E7;--tier1:#F2A93B;--energy:#FFDD57;--water:#49B8F0;--good:#4ADE9B;--bad:#F4557B;--skill:#B388FF;--ink:#0A0D18;\n  --supply:#4ADE9B;--prod:#FFDD57;--batt:#4FD1E7;--demand:#B9C2E0;\n  --en-grid:rgba(255,255,255,.07);--en-night:rgba(4,7,20,.55);\n  --font-display:'Rajdhani',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;\n}\n*{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.45;}\nbutton{font:inherit;color:inherit;}\n.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.en-page{max-width:1240px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:16px;}\n.en-eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}\n.en-h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:.01em;}\n.en-sub{font-size:13px;color:var(--text-secondary);margin:4px 0 0;max-width:78ch;}\n.en-back{display:inline-block;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:6px;}\n.en-back:hover{color:var(--text-primary);}\n\n/* панель демо-управления */\n.en-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:9px 14px;border-radius:12px;background:linear-gradient(180deg,#1A2143,#0E1328);border:1px solid #2B3563;}\n.en-ctl-g{display:flex;align-items:center;gap:9px;}\n.en-ctl-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}\n.en-btns{display:inline-flex;gap:4px;flex-wrap:wrap;}\n.en-btn{font-family:var(--font-mono);font-size:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;}\n.en-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-btn.active{background:var(--skill);border-color:var(--skill);color:#0A0D18;}\n.en-btn:focus-visible,.en-tab:focus-visible,.en-chip:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.en-ctl-clock{margin-left:auto;}\n.en-ctl-clock b{font-size:14px;font-weight:500;color:var(--text-primary);}\n\n/* вкладки периодов */\n.en-tabs{display:flex;gap:4px;flex-wrap:wrap;}\n.en-tab{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;\n  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;}\n.en-tab:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}\n\n/* графики */\n.en-chartbox{width:100%;}\n.en-chartbox canvas{display:block;touch-action:pan-y;}\n.en-tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;max-width:260px;padding:8px 10px;border-radius:8px;background:rgba(10,13,24,.96);border:1px solid var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:12px;}\n.en-tip[hidden]{display:none;}\n.en-tip-t{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-bottom:5px;white-space:nowrap;}\n.en-tip-row{display:flex;align-items:center;gap:7px;padding:1px 0;}\n.en-tip-row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}\n.en-tip-row span{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.en-tip-row b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap;}\n.en-tip-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}\n.en-legend{display:flex;flex-wrap:wrap;gap:5px;}\n.en-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}\n.en-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}\n.en-chip:hover{color:var(--text-primary);}\n.en-chip.off{opacity:.42;}\n.en-chip.off i{background:var(--border-strong)!important;}\n\n@media (max-width:640px){\n  .en-page{padding:14px 12px 48px;}\n  .en-h1{font-size:24px;}\n  .en-ctl{padding:9px 10px;gap:8px 14px;}\n  .en-ctl-clock{margin-left:0;}\n  .en-tab{padding:7px 11px;font-size:13px;}\n}\n@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }\n<\/style>\n<style>\n/* Вариант 1 — «Диспетчерская»: плотный инженерный дашборд в духе окна «Информация об электрической сети». */\n.d-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}\n.d-card{background:linear-gradient(180deg,#171D33,#12172A);border:1px solid var(--border);border-radius:12px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:9px;min-width:0;}\n.d-title{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px;}\n.d-info{width:15px;height:15px;border-radius:50%;background:var(--tier0);color:#0A0D18;font-size:10px;font-weight:700;display:inline-grid;place-items:center;font-style:normal;cursor:help;}\n.d-bar{position:relative;height:36px;border-radius:7px;background:#0B1022;box-shadow:inset 0 2px 6px rgba(0,0,0,.65);overflow:hidden;border:1px solid #070A16;}\n.d-fill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .35s;}\n.d-fill.sup{background:linear-gradient(180deg,#3FE85A,#22B93C);}\n.d-fill.prod{background:linear-gradient(180deg,#F4D34A,#C79B12);}\n.d-fill.batt{background:linear-gradient(180deg,#5BE2F5,#1D9CB5);}\n.d-fill.warn{background:linear-gradient(180deg,#F0B93D,#C08417);}\n.d-fill.bad{background:linear-gradient(180deg,#F4557B,#B8304F);}\n.d-val{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:14px;font-weight:500;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;}\n.d-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-secondary);align-items:center;}\n.d-meta b{color:var(--text-primary);font-weight:500;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.d-badge{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;}\n.d-badge.ok{background:rgba(74,222,155,.16);color:var(--good);}\n.d-badge.warn{background:rgba(240,185,61,.16);color:#F0B93D;}\n.d-badge.bad{background:rgba(244,85,123,.16);color:var(--bad);}\n.d-badge.info{background:rgba(79,209,231,.14);color:var(--tier0);}\n\n.d-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}\n.d-kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;}\n.d-kpi-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}\n.d-kpi-v{font-family:var(--font-mono);font-size:18px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;}\n.d-kpi-s{font-size:11px;color:var(--text-secondary);margin-top:1px;font-family:var(--font-mono);}\n\n.d-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}\n.d-panel{background:#0F1424;border:1px solid var(--border);border-radius:12px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;min-width:0;}\n.d-panel .en-legend{min-height:26px;}\n.d-ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n.d-ph h2{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0;letter-spacing:.02em;flex:1;min-width:120px;}\n.d-sel{font:inherit;font-size:12.5px;color:var(--text-primary);background:var(--card);border:1px solid var(--border-strong);border-radius:7px;padding:5px 26px 5px 9px;cursor:pointer;appearance:none;\n  background-image:linear-gradient(45deg,transparent 50%,#9CA6C4 50%),linear-gradient(135deg,#9CA6C4 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;}\n.d-foot{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--text-secondary);padding-top:6px;border-top:1px solid var(--border);margin-top:auto;}\n.d-foot b{color:var(--text-primary);font-family:var(--font-mono);font-weight:500;}\n\n.d-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#0F1424;}\n.d-table{width:100%;border-collapse:collapse;min-width:760px;font-size:12.5px;}\n.d-table th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500;text-align:right;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}\n.d-table th:first-child,.d-table td:first-child{text-align:left;}\n.d-table td{padding:7px 12px;text-align:right;border-bottom:1px solid rgba(41,49,80,.55);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}\n.d-table td:first-child{font-family:var(--font-body);}\n.d-table tr.grp td{background:#131A30;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary);text-align:left;}\n.d-table tr.tot td{font-weight:500;color:var(--text-primary);background:#131A30;border-bottom:none;}\n.d-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:-1px;}\n.d-mini{display:inline-block;width:70px;height:6px;border-radius:3px;background:#0B1022;vertical-align:middle;margin-left:8px;overflow:hidden;}\n.d-mini i{display:block;height:100%;}\n.dim{color:var(--text-muted);}\n\n@media (max-width:980px){ .d-top{grid-template-columns:1fr;} .d-charts{grid-template-columns:1fr;} }\n<\/style>\n<\/head>\n<body>\n<div class=\"en-page\">\n  <header>\n    <div class=\"en-eyebrow\">Вариант 1 · Диспетчерская<\/div>\n    <h1 class=\"en-h1\">Информация об энергосистеме<\/h1>\n    <p class=\"en-sub\">Три главных показателя сверху, ниже — история за любой период и построчный учёт каждого источника и потребителя. Ближе всего к окну электросети из Factorio.<\/p>\n  <\/header>\n\n  <div id=\"ctl\"><\/div>\n\n  <section class=\"d-top\">\n    <div class=\"d-card\">\n      <div class=\"d-title\">Обеспечение <i class=\"d-info\" title=\"Сколько энергии база получает от того, что ей нужно прямо сейчас. Если меньше 100% — установки сбавляют ход.\">i<\/i><\/div>\n      <div class=\"d-bar\"><i class=\"d-fill sup\" id=\"supFill\"><\/i><span class=\"d-val\" id=\"supVal\">—<\/span><\/div>\n      <div class=\"d-meta\"><span>Обеспечено <b id=\"supPct\">—<\/b><\/span><span id=\"supBadge\" class=\"d-badge ok\">Норма<\/span><span id=\"supNote\"><\/span><\/div>\n    <\/div>\n    <div class=\"d-card\">\n      <div class=\"d-title\">Производство <i class=\"d-info\" title=\"Текущая выработка солнечных панелей относительно их установленной мощности.\">i<\/i><\/div>\n      <div class=\"d-bar\"><i class=\"d-fill prod\" id=\"prodFill\"><\/i><span class=\"d-val\" id=\"prodVal\">—<\/span><\/div>\n      <div class=\"d-meta\"><span>Солнце <b id=\"prodSun\">—<\/b><\/span><span>Панелей <b id=\"prodCnt\">—<\/b><\/span><span id=\"prodNote\"><\/span><\/div>\n    <\/div>\n    <div class=\"d-card\">\n      <div class=\"d-title\">Заряд аккумулятора <i class=\"d-info\" title=\"Запас энергии в аккумуляторах базы. 1 кВт·ч = 3,6 МДж.\">i<\/i><\/div>\n      <div class=\"d-bar\"><i class=\"d-fill batt\" id=\"batFill\"><\/i><span class=\"d-val\" id=\"batVal\">—<\/span><\/div>\n      <div class=\"d-meta\"><span id=\"batFlow\"><\/span><span id=\"batEta\"><\/span><span id=\"batKwh\" class=\"dim\"><\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <div id=\"periods\"><\/div>\n  <section class=\"d-strip\" id=\"strip\"><\/section>\n\n  <section class=\"d-charts\">\n    <div class=\"d-panel\">\n      <div class=\"d-ph\"><h2>Обеспечение<\/h2><\/div>\n      <div class=\"en-legend\" id=\"lgSup\"><\/div>\n      <div id=\"chSup\"><\/div>\n      <div class=\"d-foot\" id=\"ftSup\"><\/div>\n    <\/div>\n    <div class=\"d-panel\">\n      <div class=\"d-ph\"><h2>Потребление<\/h2>\n        <select class=\"d-sel\" id=\"consMode\" aria-label=\"Режим отображения потребления\">\n          <option value=\"sep\">Всё (раздельно)<\/option><option value=\"sum\">Всё (сумма)<\/option><option value=\"grp\">По группам<\/option>\n        <\/select><\/div>\n      <div class=\"en-legend\" id=\"lgCons\"><\/div>\n      <div id=\"chCons\"><\/div>\n      <div class=\"d-foot\" id=\"ftCons\"><\/div>\n    <\/div>\n    <div class=\"d-panel\">\n      <div class=\"d-ph\"><h2>Производство<\/h2><\/div>\n      <div class=\"en-legend\" id=\"lgProd\"><\/div>\n      <div id=\"chProd\"><\/div>\n      <div class=\"d-foot\" id=\"ftProd\"><\/div>\n    <\/div>\n    <div class=\"d-panel\">\n      <div class=\"d-ph\"><h2>Заряд аккумулятора<\/h2><\/div>\n      <div class=\"en-legend\" id=\"lgBat\"><\/div>\n      <div id=\"chBat\"><\/div>\n      <div class=\"d-foot\" id=\"ftBat\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <div class=\"d-table-wrap\"><table class=\"d-table\" id=\"tbl\"><\/table><\/div>\n  <\/section>\n<\/div>\n\n<script>/* Общий «движок» демо-страниц энергосистемы: физика базы, история на 90 суток, единицы, графики.\n *\n * Модель повторяет правила игры (js/core.js): солнечная панель даёт 10 ⚡ за цикл 60 с, установки\n * тратят power ⚡ за свой цикл, аккумулятор 400 ⚡, базовый запас 150 ⚡, а если энергии не хватает,\n * ВСЕ потребители сбавляют ход в одной и той же пропорции (powerFraction). Единица «⚡» здесь\n * считается 1 кВт·ч (KWH_PER_UNIT), поэтому 10 ⚡ за 60 с = 600 кВт, а ёмкость батареи = 400 кВт·ч.\n * В самой игре истории пока нет — при интеграции нужно писать такие же минутные срезы в state.\n */\n(function(root){\n'use strict';\n\nvar KWH_PER_UNIT=1, J_PER_KWH=3.6e6;\nvar DAY_MIN=1440, CAP_DAYS=90, CAP=CAP_DAYS*DAY_MIN, BUF=CAP+10*DAY_MIN;\nvar SOLAR_KW=600*KWH_PER_UNIT, BATTERY_KWH=400*KWH_PER_UNIT, BASE_KWH=150*KWH_PER_UNIT;\nvar OFFSET_MIN=10*60+30; // «сейчас» = 10:30 игрового дня: утро, аккумуляторы заряжаются\n\nvar CONSUMERS=[\n  {id:'iron',  name:'Железная руда', short:'Fe₂O₃', group:'mining', kw:72,    color:'#9FB0C8'},\n  {id:'copper',name:'Медная руда',   short:'Cu₂S',  group:'mining', kw:72,    color:'#E08A4B'},\n  {id:'coal',  name:'Уголь',         short:'C',     group:'mining', kw:60,    color:'#8B85A6'},\n  {id:'stone', name:'Камень',        short:'CaCO₃', group:'mining', kw:56.84, color:'#C2AD82'},\n  {id:'water', name:'Бурение воды',  short:'H₂O',   group:'drill',  kw:51.43, color:'#49B8F0'},\n  {id:'oil',   name:'Бурение нефти', short:'CxHy',  group:'drill',  kw:72,    color:'#B08D57'},\n  {id:'wheat', name:'Пшеница',       short:'Triticum',    group:'farm', kw:30,    color:'#E8D078'},\n  {id:'potato',name:'Картофель',     short:'Solanum tub.',group:'farm', kw:27.69, color:'#A9865B'},\n  {id:'corn',  name:'Кукуруза',      short:'Zea mays',    group:'farm', kw:31.3,  color:'#F0B93D'},\n  {id:'tomato',name:'Томаты',        short:'Solanum lyc.',group:'farm', kw:36,    color:'#E1503D'}\n];\nvar GROUPS=[\n  {id:'mining',name:'Горнодобыча',color:'#C9A227'},\n  {id:'drill', name:'Бурение',    color:'#49B8F0'},\n  {id:'farm',  name:'Фермы',      color:'#8CAF52'}\n];\nvar SCENARIOS={\n  start:{label:'Старт',         hint:'1 панель, без аккумуляторов', solar:1,  bat:0,   seed:11, growth:1,\n         cons:{iron:1,copper:1,water:1}},\n  mid:  {label:'Развитая база', hint:'12 панелей, 45 аккумуляторов',solar:12, bat:45,  seed:23, growth:1.15,\n         cons:{iron:6,copper:5,coal:4,stone:3,water:3,oil:3,wheat:3,potato:2,corn:2,tomato:2}},\n  big:  {label:'Промышленная',  hint:'60 панелей, 200 аккумуляторов',solar:60, bat:200, seed:37, growth:1.15,\n         cons:{iron:30,copper:25,coal:20,stone:15,water:15,oil:15,wheat:15,potato:10,corn:10,tomato:10}}\n};\nvar PERIODS=[\n  {id:'h1', label:'1 час',    phrase:'за последний час',   min:60,     bin:1},\n  {id:'d1', label:'Сутки',    phrase:'за последние сутки', min:1440,   bin:10},\n  {id:'d7', label:'Неделя',   phrase:'за неделю',          min:10080,  bin:60},\n  {id:'d30',label:'Месяц',    phrase:'за месяц',           min:43200,  bin:240},\n  {id:'d90',label:'3 месяца', phrase:'за 3 месяца',        min:129600, bin:720}\n];\nvar PMAP={}; PERIODS.forEach(function(p){ PMAP[p.id]=p; });\n\nvar SKEYS=['gen','curtail','demand','supply','flow','stored','nameplate','capKWh'].concat(CONSUMERS.map(function(c){return c.id;}));\nvar K=SKEYS.length, KI={}; SKEYS.forEach(function(k,i){ KI[k]=i; });\n// Виртуальные ряды: сумма (с весами) настоящих рядов.\nvar VIRT={\n  g_mining:CONSUMERS.filter(function(c){return c.group==='mining';}).map(function(c){return c.id;}),\n  g_drill: CONSUMERS.filter(function(c){return c.group==='drill';}).map(function(c){return c.id;}),\n  g_farm:  CONSUMERS.filter(function(c){return c.group==='farm';}).map(function(c){return c.id;}),\n  unmet:[['demand',1],['supply',-1]],\n  balance:[['gen',1],['demand',-1]],\n  used:[['gen',1],['curtail',-1]]\n};\n\nvar EN={\n  KWH_PER_UNIT:KWH_PER_UNIT, J_PER_KWH:J_PER_KWH, SOLAR_KW:SOLAR_KW, BATTERY_KWH:BATTERY_KWH, BASE_KWH:BASE_KWH,\n  CONSUMERS:CONSUMERS, GROUPS:GROUPS, SCENARIOS:SCENARIOS, PERIODS:PERIODS, PMAP:PMAP, CAP:CAP, DAY_MIN:DAY_MIN,\n  period:'d1', speed:600, scenario:'mid', cur:{}, counts:{}, paused:false\n};\n\n/* ---------- события ---------- */\nvar handlers={};\nEN.on=function(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); };\nfunction emit(ev,a){ (handlers[ev]||[]).forEach(function(f){ f(a); }); }\n\n/* ---------- физика ---------- */\nvar S={}; SKEYS.forEach(function(k){ S[k]=new Float32Array(BUF); });\nvar st={}, SC=null, P=new Float64Array(K), dem=new Float64Array(CONSUMERS.length);\n\nfunction mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nfunction sunFactor(clockSec){\n  var t=clockSec%86400;\n  if(t<21600||t>72000) return 0;\n  return Math.sin((t-21600)/50400*Math.PI);\n}\nEN.sunFactor=sunFactor;\n\nfunction countsFor(dayIdx){\n  var g=Math.pow(Math.min(1,Math.max(0,dayIdx/CAP_DAYS)),SC.growth||1.15), n={};\n  n.solar=Math.max(1,Math.ceil(SC.solar*g));\n  n.bat=SC.bat>0?Math.ceil(SC.bat*Math.min(1,g*1.08)):0;\n  CONSUMERS.forEach(function(c){ var f=SC.cons[c.id]||0; n[c.id]=f?Math.ceil(f*g):0; });\n  return n;\n}\nfunction rollDuty(){\n  for(var i=0;i<CONSUMERS.length;i++){\n    var r=st.rng();\n    st.duty[i]= r<.68?1: r<.83?.85: r<.93?.6: r<.98?.3: 0; // доля установок группы, реально работающих в этот час\n  }\n}\nfunction prep(){\n  var a=Math.floor((st.secs+OFFSET_MIN*60)/3600);\n  if(a!==st.hr){ st.hr=a; rollDuty(); }\n  var d=Math.floor((st.secs+OFFSET_MIN*60)/86400);\n  if(d!==st.dy){ st.dy=d; st.counts=countsFor(d); EN.counts=st.counts; }\n}\nfunction physics(dt){\n  var clock=(st.secs+OFFSET_MIN*60)%86400, sun=sunFactor(clock), n=st.counts;\n  var gen=n.solar*SOLAR_KW*sun, np=n.solar*SOLAR_KW, D=0, i;\n  for(i=0;i<CONSUMERS.length;i++){ dem[i]=n[CONSUMERS[i].id]*CONSUMERS[i].kw*st.duty[i]; D+=dem[i]; }\n  var cap=BASE_KWH+n.bat*BATTERY_KWH;\n  var avail=st.stored+gen*dt/3600, need=D*dt/3600;\n  var frac=need>1e-12?Math.min(1,avail/need):1;\n  var left=avail-need*frac, ns=Math.min(cap,left), spill=left-ns;\n  P[0]=gen; P[1]=spill*3600/dt; P[2]=D; P[3]=D*frac; P[4]=(ns-st.stored)*3600/dt; P[5]=ns; P[6]=np; P[7]=cap;\n  for(i=0;i<CONSUMERS.length;i++) P[8+i]=dem[i]*frac;\n  st.stored=ns; st.frac=frac; st.sun=sun; st.clock=clock;\n  var c=EN.cur;\n  c.sun=sun; c.gen=gen; c.nameplate=np; c.curtail=P[1]; c.demand=D; c.supply=P[3]; c.frac=frac; c.flow=P[4];\n  c.stored=ns; c.cap=cap; c.pct=cap>0?ns/cap*100:0; c.clock=clock; c.secs=st.secs; c.day=Math.floor((st.secs+OFFSET_MIN*60)/86400)+1;\n  c.cons=c.cons||{};\n  for(i=0;i<CONSUMERS.length;i++){ c.cons[CONSUMERS[i].id]=P[8+i]; }\n  c.duty=st.duty;\n}\nfunction accumulate(dt){ for(var k=0;k<K;k++) st.A[k]+=P[k]*dt; st.acc+=dt; }\nfunction shiftBuffer(){\n  var drop=BUF-CAP;\n  SKEYS.forEach(function(k){ S[k].copyWithin(0,drop,BUF); });\n  st.base+=drop; st.w=CAP;\n}\nfunction commit(){\n  var i=st.w, k;\n  for(k=0;k<K;k++){ S[SKEYS[k]][i]=st.A[k]/st.acc; st.A[k]=0; }\n  st.acc=0; st.w++; st.tMin++; st.dirty=true;\n  if(st.w>=BUF) shiftBuffer();\n}\nfunction advance(dtGame){\n  var remain=dtGame;\n  while(remain>1e-9){\n    prep();\n    var dt=Math.min(remain,60-st.acc,15);\n    if(dt<1e-6) dt=Math.min(remain,60-st.acc);\n    physics(dt); accumulate(dt);\n    st.secs+=dt; remain-=dt;\n    if(st.acc>=60-1e-7) commit();\n  }\n}\n\nEN.load=function(name){\n  SC=SCENARIOS[name]||SCENARIOS.mid; EN.scenario=SCENARIOS[name]?name:'mid';\n  st={secs:0,acc:0,A:new Float64Array(K),w:0,base:0,tMin:0,hr:-1,dy:-1,rng:mulberry(SC.seed),duty:new Array(CONSUMERS.length).fill(1),\n      counts:{},stored:0,dirty:false};\n  prep(); st.stored=(BASE_KWH+st.counts.bat*BATTERY_KWH)*0.5;\n  for(var m=0;m<CAP;m++){ prep(); physics(60); accumulate(60); st.secs+=60; commit(); }\n  st.dirty=false;\n  prep(); physics(1e-3); // актуальные «текущие» значения\n  emit('reset'); emit('data');\n};\nEN.setSpeed=function(v){ EN.speed=v; emit('speed'); };\nEN.setPeriod=function(id){ if(!PMAP[id]) return; EN.period=id; emit('period'); };\n\nvar lastTs=0;\nEN.run=function(){\n  function f(ts){\n    var dtR=lastTs?Math.min(0.25,(ts-lastTs)/1000):0; lastTs=ts;\n    if(EN.speed>0){ advance(dtR*EN.speed); }\n    if(st.dirty){ st.dirty=false; emit('data'); }\n    emit('frame',dtR);\n    root.requestAnimationFrame(f);\n  }\n  root.requestAnimationFrame(f);\n};\n\n/* ---------- чтение истории ---------- */\nfunction members(k){ var v=VIRT[k]; if(!v) return [[k,1]]; return v.map(function(m){ return typeof m==='string'?[m,1]:m; }); }\n// Ряды по бинам за период. mode: mean | energy (кВт·ч за бин) | max | min | last\nEN.series=function(keys,pid,mode,offsetMin){\n  var pp=PMAP[pid], n=pp.min/pp.bin, off=offsetMin||0, start=st.w-pp.min-off, out={n:n,bin:pp.bin,t0:st.tMin-pp.min-off,keys:{}};\n  mode=mode||'mean';\n  keys.forEach(function(key){\n    var ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), arr=new Float64Array(n);\n    for(var b=0;b<n;b++){\n      var s=start+b*pp.bin, acc=0, mx=-Infinity, mn=Infinity, v=0;\n      for(var i=0;i<pp.bin;i++){\n        v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n        acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n      }\n      arr[b]= mode==='mean'?acc/pp.bin : mode==='energy'?acc/60 : mode==='max'?mx : mode==='min'?mn : v;\n    }\n    out.keys[key]=arr;\n  });\n  return out;\n};\n// Итоги по ряду за период: mean/max/min (кВт или кВт·ч для stored) и sum (кВт·ч).\nEN.stat=function(key,pid,offsetMin){\n  var pp=PMAP[pid], ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), off=offsetMin||0, s=st.w-pp.min-off, acc=0, mx=-Infinity, mn=Infinity;\n  for(var i=0;i<pp.min;i++){\n    var v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n    acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n  }\n  return {mean:acc/pp.min, max:mx, min:mn, sum:acc/60, first:valueAt(key,s), last:valueAt(key,s+pp.min-1)};\n};\nfunction valueAt(key,idx){ var v=0; members(key).forEach(function(m){ v+=S[m[0]][idx]*m[1]; }); return v; }\nEN.deficitMinutes=function(pid,offsetMin){\n  var pp=PMAP[pid], off=offsetMin||0, s=st.w-pp.min-off, c=0, d=S.demand, u=S.supply;\n  for(var i=0;i<pp.min;i++){ if(d[s+i]-u[s+i]>0.02*d[s+i]+1e-6) c++; }\n  return c;\n};\nEN.tNow=function(){ return st.tMin; };\nEN.hasPrev=function(pid){ return PMAP[pid].min*2<=CAP; };\nEN.timeOf=function(absMin){\n  var t=absMin+OFFSET_MIN;\n  var day=Math.floor(t/DAY_MIN)+1, m=((t%DAY_MIN)+DAY_MIN)%DAY_MIN;\n  return {day:day,hh:Math.floor(m/60),mm:m%60,clock:m};\n};\nfunction p2(n){ return (n<10?'0':'')+n; }\nEN.clockStr=function(sec){ var m=Math.floor((sec%86400)/60); return p2(Math.floor(m/60))+':'+p2(m%60); };\nEN.nowStr=function(){ var c=EN.cur; return 'День '+c.day+' · '+EN.clockStr(c.clock); };\nEN.binLabel=function(t0,i,bin){\n  var a=EN.timeOf(t0+i*bin), b=EN.timeOf(t0+(i+1)*bin);\n  var s='День '+a.day+' · '+p2(a.hh)+':'+p2(a.mm);\n  if(bin>1) s+=' – '+p2(b.hh)+':'+p2(b.mm);\n  return s;\n};\n// Сетка «день × час» (для тепловой карты и суточного профиля). Пустые ячейки — NaN.\nEN.grid=function(key,days){\n  var lastAbs=st.tMin-1, lastDay=Math.floor((lastAbs+OFFSET_MIN)/DAY_MIN), rows=[], d, h;\n  var startAbs=st.tMin-CAP;\n  for(d=lastDay-days+1;d<=lastDay;d++){\n    var cells=new Float64Array(24);\n    for(h=0;h<24;h++){\n      var a0=d*DAY_MIN+h*60-OFFSET_MIN, sum=0, cnt=0;\n      for(var m=0;m<60;m++){\n        var ab=a0+m; if(ab<startAbs||ab>lastAbs) continue;\n        sum+=valueAt(key,ab-st.base); cnt++;\n      }\n      cells[h]=cnt?sum/cnt:NaN;\n    }\n    rows.push({day:d+1,cells:cells});\n  }\n  return rows;\n};\n// Последние N минут по одной точке (для «полоски» часа).\nEN.strip=function(key,minutes){\n  var out=new Float64Array(minutes), s=st.w-minutes;\n  for(var i=0;i<minutes;i++) out[i]=valueAt(key,s+i);\n  return out;\n};\n\n/* ---------- форматирование ---------- */\nvar PSC=[[1e-3,'Вт'],[1,'кВт'],[1e3,'МВт'],[1e6,'ГВт']];               // база: кВт\nvar ESC=[[1e-3,'Вт·ч'],[1,'кВт·ч'],[1e3,'МВт·ч'],[1e6,'ГВт·ч'],[1e9,'ТВт·ч']]; // база: кВт·ч\nvar JSC=[[1,'Дж'],[1e3,'кДж'],[1e6,'МДж'],[1e9,'ГДж'],[1e12,'ТДж']];    // база: Дж\nfunction digitsFor(a){ return a>=100?0:a>=10?1:2; }\nfunction pickScale(sc,v,def){\n  var a=Math.abs(v), i=def;\n  if(a>0){ i=0; for(var k=0;k<sc.length;k++) if(a>=sc[k][0]) i=k; }\n  var num=a/sc[i][0];\n  if(Number(num.toFixed(digitsFor(num)))>=1000 && i<sc.length-1) i++;\n  return i;\n}\nfunction fmtBy(sc,v,def){\n  if(Math.abs(v)<1e-9) v=0;\n  var i=pickScale(sc,v,def), x=v/sc[i][0], d=digitsFor(Math.abs(x));\n  var num=(v===0||Number(x.toFixed(d))===0?'0':x.toFixed(d));\n  return {num:num,unit:sc[i][1],text:num+' '+sc[i][1],scale:sc[i][0],idx:i};\n}\nEN.fmt={\n  power:function(kw){ return fmtBy(PSC,kw,1); },\n  energy:function(kwh){ return fmtBy(ESC,kwh,1); },\n  joule:function(j){ return fmtBy(JSC,j,2); },\n  stored:function(kwh){ return fmtBy(JSC,kwh*J_PER_KWH,2); },\n  pct:function(p,d){ return (p).toFixed(d==null?0:d)+'%'; },\n  sign:function(o,plus){ return (o.num!=='0'&&plus&&parseFloat(o.num)>0?'+':'')+o.text; },\n  dur:function(h){\n    if(!isFinite(h)||h<0) return '—';\n    var m=Math.round(h*60);\n    if(m<1) return 'меньше минуты';\n    if(m<60) return m+' м';\n    if(m<1440) return Math.floor(m/60)+' ч'+(m%60?' '+(m%60)+' м':'');\n    return Math.floor(m/1440)+' д'+(Math.floor((m%1440)/60)?' '+Math.floor((m%1440)/60)+' ч':'');\n  }\n};\n// Шкала для осей: по максимуму подбираем единицу, дальше красивые шаги в ней.\nEN.axis=function(unit,max){\n  var sc= unit==='power'?PSC : unit==='energy'?ESC : unit==='joule'?JSC : null;\n  if(unit==='pct') return {div:1,unit:'%',ticks:niceTicks(max,1)};\n  var i=pickScale(sc,max,unit==='joule'?2:1), div=sc[i][0];\n  return {div:div,unit:sc[i][1],ticks:niceTicks(max/div,div)};\n};\nfunction niceTi dem=F.power(c.demand), sup=F.power(c.supply);\n  $('supFill').style.width=(frac*100).toFixed(1)+'%';\n  $('supFill').className='d-fill '+(frac>=0.999?'sup':frac>=0.5?'warn':'bad');\n  $('supVal').textContent=sup.text+' / '+dem.text;\n  $('supPct').textContent=F.pct(frac*100,frac<0.995&&frac>0?1:0);\n  var b=$('supBadge'); b.className='d-badge '+(frac>=0.999?'ok':frac>=0.5?'warn':'bad');\n  b.textContent= frac>=0.999?'Норма' : frac<0.02?'Блэкаут' : frac>=0.5?'Просадка':'Дефицит';\n  $('supNote').textContent= frac<0.999?'Не хватает '+F.power(c.demand-c.supply).text : (c.flow<-1?'Покрыто из аккумуляторов':'');\n  // производство\n  var np=c.nameplate>0?c.gen/c.nameplate:0;\n  $('prodFill').style.width=(np*100).toFixed(1)+'%';\n  $('prodVal').textContent=F.power(c.gen).text+' / '+F.power(c.nameplate).text;\n  $('prodSun').textContent=F.pct(c.sun*100);\n  $('prodCnt').textContent=EN.counts.solar;\n  $('prodNote').textContent= c.curtail>1?'Сброс излишка '+F.power(c.curtail).text : (c.sun<=0?'Ночь — панели не работают':'');\n  // аккумулятор\n  var st=F.stored(c.stored), cp=F.stored(c.cap);\n  $('batFill').style.width=c.pct.toFixed(1)+'%';\n  $('batFill').className='d-fill '+(c.pct<15?'bad':'batt');\n  $('batVal').textContent=st.text+' / '+cp.text;\n  var fl=$('batFlow');\n  if(Math.abs(c.flow)<1){ fl.innerHTML='<span class=\"d-badge info\">Без изменений<\/span>'; $('batEta').textContent=''; }\n  else if(c.flow>0){ fl.innerHTML='<span class=\"d-badge ok\">Заряд<\/span> <b>+'+F.power(c.flow).text+'<\/b>'; $('batEta').innerHTML='Полон через <b>'+F.dur((c.cap-c.stored)/c.flow)+'<\/b>'; }\n  else { fl.innerHTML='<span class=\"d-badge warn\">Разряд<\/span> <b>−'+F.power(-c.flow).text+'<\/b>'; $('batEta').innerHTML='Пуст через <b>'+F.dur(c.stored/-c.flow)+'<\/b>'; }\n  $('batKwh').textContent='= '+F.energy(c.stored).text+' из '+F.energy(c.cap).text;\n}\n\n/* ---------- графики ---------- */\nvar chSup=EN.chart($('chSup'),{kind:'line',unit:'power',height:230,\n  series:[{key:'supply',label:'Получено',color:'#4ADE9B',fill:true},{key:'demand',label:'Потребность',color:'#B9C2E0',dash:[4,3],width:1.3}],\n  between:{top:'demand',bottom:'supply',color:'#F4557B'}});\nvar chProd=EN.chart($('chProd'),{kind:'line',unit:'power',height:230,\n  series:[{key:'gen',label:'Выработка',color:'#FFDD57',fill:true},{key:'curtail',label:'Сброс излишка',color:'#8C93B0',width:1.2},\n          {key:'nameplate',label:'Установленная мощность',color:'#FFDD57',dash:[5,4],width:1.1}]});\nvar chBat=EN.chart($('chBat'),{kind:'line',unit:'joule',height:230,mode:'mean',\n  series:[{key:'stored',label:'Заряд',color:'#4FD1E7',fill:true},{key:'capKWh',label:'Ёмкость',color:'#4FD1E7',dash:[5,4],width:1.1}]});\nvar consSeries=[], chCons=EN.chart($('chCons'),{kind:'line',unit:'power',height:230,series:[]});\nfunction activeConsumers(){ return EN.CONSUMERS.filter(function(c){ return EN.counts[c.id]>0; }); }\nfunction buildCons(){\n  var mode=$('consMode').value, o=chCons.o;\n  if(mode==='grp'){ o.kind='area'; o.stack=true; consSeries=EN.GROUPS.map(function(g){ return {key:'g_'+g.id,label:g.name,color:g.color}; }); }\n  else if(mode==='sum'){ o.kind='area'; o.stack=true; consSeries=activeConsumers().map(function(c){ return {key:c.id,label:c.name,color:c.color}; }); }\n  else { o.kind='line'; o.stack=false; consSeries=activeConsumers().map(function(c){ return {key:c.id,label:c.name,color:c.color}; }); }\n  o.series=consSeries;\n  EN.legend($('lgCons'),consSeries,function(){ chCons.draw(); });\n  chCons.draw();\n}\n$('consMode').onchange=buildCons;\nfunction legends(){\n  EN.legend($('lgSup'),chSup.o.series,function(){ chSup.draw(); });\n  EN.legend($('lgProd'),chProd.o.series,function(){ chProd.draw(); });\n  EN.legend($('lgBat'),chBat.o.series,function(){ chBat.draw(); });\n}\n\n/* ---------- итоги и таблица (тяжёлые вычисления — не чаще 3 раз в секунду) ---------- */\nfunction kpi(l,v,s){ return '<div class=\"d-kpi\"><div class=\"d-kpi-l\">'+l+'<\/div><div class=\"d-kpi-v\">'+v+'<\/div><div class=\"d-kpi-s\">'+(s||'&nbsp;')+'<\/div><\/div>'; }\nfunction heavy(){\n  var p=EN.period, F=EN.fmt, ph=EN.PMAP[p].phrase;\n  var g=EN.stat('gen',p), d=EN.stat('demand',p), s=EN.stat('supply',p), cu=EN.stat('curtail',p), b=EN.stat('stored',p);\n  var ratio=d.sum>0?s.sum/d.sum*100:100, defMin=EN.deficitMinutes(p);\n  $('strip').innerHTML=\n    kpi('Выработано',F.energy(g.sum).text,ph)+kpi('Потреблено',F.energy(s.sum).text,'из '+F.energy(d.sum).text+' нужных')+\n    kpi('Обеспеченность',F.pct(ratio,1),'дефицит '+F.dur(defMin/60))+kpi('Сброшено излишка',F.energy(cu.sum).text,F.pct(g.sum>0?cu.sum/g.sum*100:0)+' выработки')+\n    kpi('Пик выработки',F.power(g.max).text,'средняя '+F.power(g.mean).text)+kpi('Пик нагрузки',F.power(d.max).text,'средняя '+F.power(d.mean).text)+\n    kpi('Заряд за период','<span style=\"font-size:14px;white-space:normal;line-height:1.35\">от '+F.stored(b.min).text+'<br>до '+F.stored(b.max).text+'<\/span>','сейчас '+F.stored(EN.cur.stored).text);\n  $('ftSup').innerHTML='<span>Средняя потребность <b>'+F.power(d.mean).text+'<\/b><\/span><span>Пик <b>'+F.power(d.max).text+'<\/b><\/span><span>Не хватало <b>'+F.energy(d.sum-s.sum).text+'<\/b><\/span>';\n  $('ftProd').innerHTML='<span>Всего <b>'+F.energy(g.sum).text+'<\/b><\/span><span>Средняя <b>'+F.power(g.mean).text+'<\/b><\/span><span>Пик <b>'+F.power(g.max).text+'<\/b><\/span>';\n  $('ftBat').innerHTML='<span>Среднее <b>'+F.stored(b.mean).text+'<\/b><\/span><span>Минимум <b>'+F.stored(b.min).text+'<\/b><\/span><span>Максимум <b>'+F.stored(b.max).text+'<\/b><\/span>';\n  $('ftCons').innerHTML='<span>Всего <b>'+F.energy(s.sum).text+'<\/b><\/span><span>Средняя <b>'+F.power(s.mean).text+'<\/b><\/span><span>Пик <b>'+F.power(s.max).text+'<\/b><\/span>';\n  chSup.draw(); chProd.draw(); chBat.draw(); chCons.draw();\n  table(p,s.sum);\n}\nfunction table(p,totalUsed){\n  var F=EN.fmt, c=EN.cur, rows='';\n  rows+='<thead><tr><th>Источник / потребитель<\/th><th>Кол-во<\/th><th>Установлено<\/th><th>Сейчас<\/th><th>Загрузка<\/th><th>Энергия '+EN.PMAP[p].phrase+'<\/th><th>Доля<\/th><\/tr><\/thead><tbody>';\n  var gs=EN.stat('gen',p), np=EN.counts.solar*EN.SOLAR_KW;\n  rows+='<tr class=\"grp\"><td colspan=\"7\">Источники<\/td><\/tr>';\n  rows+='<tr><td><i class=\"d-dot\" style=\"background:#FFDD57\"><\/i>Солнечные панели<\/td><td>'+EN.counts.solar+'<\/td><td>'+F.power(np).text+'<\/td><td>'+F.power(c.gen).text+'<\/td><td>'+F.pct(np>0?c.gen/np*100:0)+'<\/td><td>'+F.energy(gs.sum).text+'<\/td><td class=\"dim\">—<\/td><\/tr>';\n  EN.GROUPS.forEach(function(gr){\n    var list=activeConsumers().filter(function(x){ return x.group===gr.id; }); if(!list.length) return;\n    rows+='<tr class=\"grp\"><td colspan=\"7\">'+gr.name+'<\/td><\/tr>';\n    list.forEach(function(x){\n      var inst=EN.counts[x.id]*x.kw, now=c.cons[x.id]||0, e=EN.stat(x.id,p).sum, sh=totalUsed>0?e/totalUsed*100:0;\n      rows+='<tr><td><i class=\"d-dot\" style=\"background:'+x.color+'\"><\/i>'+x.name+'<\/td><td>'+EN.counts[x.id]+'<\/td><td>'+F.power(inst).text+'<\/td><td>'+F.power(now).text+'<\/td><td>'+F.pct(inst>0?now/inst*100:0)+'<\/td><td>'+F.energy(e).text+'<\/td><td>'+F.pct(sh,1)+'<span class=\"d-mini\"><i style=\"width:'+Math.min(100,sh*2.2)+'%;background:'+x.color+'\"><\/i><\/span><\/td><\/tr>';\n    });\n  });\n  var instAll=activeConsumers().reduce(function(a,x){ return a+EN.counts[x.id]*x.kw; },0), cntAll=activeConsumers().reduce(function(a,x){ return a+EN.counts[x.id]; },0);\n  rows+='<tr class=\"tot\"><td>Итого потребители<\/td><td>'+cntAll+'<\/td><td>'+F.power(instAll).text+'<\/td><td>'+F.power(c.supply).text+'<\/td><td>'+F.pct(instAll>0?c.supply/instAll*100:0)+'<\/td><td>'+F.energy(totalUsed).text+'<\/td><td>100%<\/td><\/tr><\/tbody>';\n  $('tbl').innerHTML=rows;\n}\n\n/* ---------- цикл обновления ---------- */\nvar dirty=true, lastHeavy=0;\nEN.on('data',function(){ dirty=true; });\nEN.on('period',function(){ dirty=true; lastHeavy=0; });\nEN.on('reset',function(){ dirty=true; lastHeavy=0; buildCons(); legends(); });\nEN.on('frame',function(){\n  live();\n  var now=performance.now();\n  if(dirty&&now-lastHeavy>350){ dirty=false; lastHeavy=now; heavy(); }\n});\nEN.start();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Энергосистема · Вариант 2 · Мнемосхема<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>/* Общие стили демо-страниц энергосистемы: палитра игры (css/base.css), панель демо-управления,\n   вкладки периодов, подсказки графиков. Каждый вариант добавляет свои стили поверх. */\n:root{\n  color-scheme:dark;\n  --bg:#0A0D18;--panel:#12172A;--card:#171D33;--card-hover:#1E2640;--border:#293150;--border-strong:#3A4468;\n  --text-primary:#E9ECF7;--text-secondary:#9CA6C4;--text-muted:#606A8A;\n  --tier0:#4FD1E7;--tier1:#F2A93B;--energy:#FFDD57;--water:#49B8F0;--good:#4ADE9B;--bad:#F4557B;--skill:#B388FF;--ink:#0A0D18;\n  --supply:#4ADE9B;--prod:#FFDD57;--batt:#4FD1E7;--demand:#B9C2E0;\n  --en-grid:rgba(255,255,255,.07);--en-night:rgba(4,7,20,.55);\n  --font-display:'Rajdhani',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;\n}\n*{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.45;}\nbutton{font:inherit;color:inherit;}\n.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}\n.en-page{max-width:1240px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:16px;}\n.en-eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}\n.en-h1{font-family:var(--font-display);font-weight:700;font-size:30px;margin:2px 0 0;letter-spacing:.01em;}\n.en-sub{font-size:13px;color:var(--text-secondary);margin:4px 0 0;max-width:78ch;}\n.en-back{display:inline-block;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:6px;}\n.en-back:hover{color:var(--text-primary);}\n\n/* панель демо-управления */\n.en-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:9px 14px;border-radius:12px;background:linear-gradient(180deg,#1A2143,#0E1328);border:1px solid #2B3563;}\n.en-ctl-g{display:flex;align-items:center;gap:9px;}\n.en-ctl-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}\n.en-btns{display:inline-flex;gap:4px;flex-wrap:wrap;}\n.en-btn{font-family:var(--font-mono);font-size:12px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 10px;cursor:pointer;}\n.en-btn:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-btn.active{background:var(--skill);border-color:var(--skill);color:#0A0D18;}\n.en-btn:focus-visible,.en-tab:focus-visible,.en-chip:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.en-ctl-clock{margin-left:auto;}\n.en-ctl-clock b{font-size:14px;font-weight:500;color:var(--text-primary);}\n\n/* вкладки периодов */\n.en-tabs{display:flex;gap:4px;flex-wrap:wrap;}\n.en-tab{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;\n  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;}\n.en-tab:hover{color:var(--text-primary);border-color:var(--border-strong);}\n.en-tab.active{background:var(--tier1);border-color:var(--tier1);color:#0A0D18;}\n\n/* графики */\n.en-chartbox{width:100%;}\n.en-chartbox canvas{display:block;touch-action:pan-y;}\n.en-tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;max-width:260px;padding:8px 10px;border-radius:8px;background:rgba(10,13,24,.96);border:1px solid var(--border-strong);box-shadow:0 6px 18px rgba(0,0,0,.5);font-size:12px;}\n.en-tip[hidden]{display:none;}\n.en-tip-t{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-bottom:5px;white-space:nowrap;}\n.en-tip-row{display:flex;align-items:center;gap:7px;padding:1px 0;}\n.en-tip-row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}\n.en-tip-row span{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.en-tip-row b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-primary);white-space:nowrap;}\n.en-tip-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}\n.en-legend{display:flex;flex-wrap:wrap;gap:5px;}\n.en-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text-secondary);}\n.en-chip i{width:9px;height:9px;border-radius:50%;flex-shrink:0;}\n.en-chip:hover{color:var(--text-primary);}\n.en-chip.off{opacity:.42;}\n.en-chip.off i{background:var(--border-strong)!important;}\n\n@media (max-width:640px){\n  .en-page{padding:14px 12px 48px;}\n  .en-h1{font-size:24px;}\n  .en-ctl{padding:9px 10px;gap:8px 14px;}\n  .en-ctl-clock{margin-left:0;}\n  .en-tab{padding:7px 11px;font-size:13px;}\n}\n@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }\n<\/style>\n<style>\n/* Вариант 2 — «Мнемосхема»: единая схема базы с живыми потоками энергии. Клик по узлу открывает его историю. */\n.m-scheme{position:relative;border-radius:16px;padding:22px 20px;border:1px solid #173A4A;\n  background:radial-gradient(120% 90% at 20% 0%,rgba(79,209,231,.09),transparent 60%),\n    repeating-linear-gradient(0deg,rgba(79,209,231,.045) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(79,209,231,.045) 0 1px,transparent 1px 28px),#070B18;}\n.m-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,190px) minmax(0,1.25fr);grid-template-areas:'src bus cons' 'bat bus cons';gap:26px 70px;align-items:stretch;}\n.m-src{grid-area:src;display:flex;flex-direction:column;gap:34px;}\n.m-bat{grid-area:bat;display:flex;flex-direction:column;gap:22px;}\n.m-bus{grid-area:bus;}\n.m-cons{grid-area:cons;display:flex;flex-direction:column;gap:14px;justify-content:center;}\n.m-flows{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}\n.m-flow-base{fill:none;stroke-linecap:round;opacity:.16;}\n.m-flow-dash{fill:none;stroke-linecap:round;stroke-dasharray:1 12;animation:m-dash 1s linear infinite;}\n.m-flow-dash.rev{animation-direction:reverse;}\n@keyframes m-dash{to{stroke-dashoffset:-13;}}\n\n.m-node{position:relative;background:linear-gradient(180deg,rgba(23,29,51,.96),rgba(15,20,36,.96));border:1px solid var(--border-strong);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;color:inherit;width:100%;font:inherit;\n  transition:border-color .15s,box-shadow .15s,transform .1s;}\n.m-node:hover{border-color:var(--nc,var(--tier0));}\n.m-node:focus-visible{outline:2px solid var(--tier0);outline-offset:2px;}\n.m-node.sel{border-color:var(--nc,var(--tier0));box-shadow:0 0 0 1px var(--nc,var(--tier0)),0 0 22px color-mix(in srgb,var(--nc,var(--tier0)) 30%,transparent);}\n.m-nh{display:flex;align-items:center;gap:8px;margin-bottom:6px;}\n.m-nh h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;flex:1;}\n.m-tag{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}\n.m-big{font-family:var(--font-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;}\n.m-of{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);}\n.m-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-secondary);padding:1px 0;}\n.m-line b{font-family:var(--font-mono);font-weight:500;color:var(--text-primary);font-variant-numeric:tabular-nums;}\n.m-bar{height:6px;border-radius:3px;background:#0B1022;overflow:hidden;margin:7px 0 5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}\n.m-bar i{display:block;height:100%;background:var(--nc);transition:width .35s;}\n.m-sun{--nc:#FFDD57;}\n.m-solar{--nc:#FFDD57;}\n.m-batt{--nc:#4FD1E7;}\n.m-busn{--nc:#4ADE9B;}\n.m-curt{--nc:#8C93B0;border-style:dashed;padding:8px 12px;}\n.m-curt .m-nh{margin:0;}\n.m-curt.idle{opacity:.5;}\n.m-sunrow{display:flex;align-items:center;gap:12px;}\n.m-sunico{width:54px;height:54px;flex-shrink:0;}\n.m-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px;margin:8px 0 2px;}\n.m-tiles i{aspect-ratio:1.5;border-radius:2px;background:#FFDD57;border:1px solid rgba(255,221,87,.5);transition:opacity .4s;}\n.m-ring{display:block;margin:2px auto 8px;width:118px;height:118px;}\n.m-ring text{font-family:var(--font-mono);fill:var(--text-primary);}\n.m-batrow{display:flex;gap:12px;align-items:center;}\n.m-batico{width:52px;height:78px;flex-shrink:0;}\n.m-group{background:rgba(15,20,36,.92);border:1px solid var(--border);border-left:3px solid var(--nc);border-radius:12px;padding:9px 10px 8px;--nc:var(--tier0);}\n.m-group.sel{border-color:var(--nc);box-shadow:0 0 0 1px var(--nc),0 0 22px color-mix(in srgb,var(--nc) 26%,transparent);}\n.m-gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:inherit;cursor:pointer;padding:2px 2px 6px;text-align:left;}\n.m-gh h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:15px;flex:1;letter-spacing:.02em;}\n.m-gh b{font-family:var(--font-mono);font-weight:500;font-size:14px;}\n.m-row{display:grid;grid-template-columns:10px minmax(0,1fr) 34px 78px;gap:8px;align-items:center;width:100%;background:none;border:1px solid transparent;border-radius:7px;color:inherit;cursor:pointer;padding:4px 6px;font-size:12.5px;text-align:left;}\n.m-row:hover{background:rgba(255,255,255,.04);}\n.m-row.sel{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent);}\n.m-row i{width:9px;height:9px;border-radius:2px;background:var(--rc);}\n.m-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.m-row em{font-style:normal;font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);text-align:right;}\n.m-row b{font-family:var(--font-mono);font-weight:500;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;}\n.m-rowbar{grid-column:2/5;height:3px;border-radius:2px;background:#0B1022;margin-top:-2px;overflow:hidden;}\n.m-rowbar i{display:block;height:100%;width:0;background:var(--rc);transition:width .35s;border-radius:0;}\n\n.m-hist{background:#0F1424;border:1px solid var(--border);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;}\n.m-hh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}\n.m-hh h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em;}\n.m-hh p{margin:0;font-size:12px;color:var(--text-secondary);flex:1;min-width:200px;}\n.m-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}\n.m-stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 11px;}\n.m-stat-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}\n.m-stat-v{font-family:var(--font-mono);font-size:17px;font-weight:500;margin-top:2px;white-space:nowrap;}\n.m-hint{font-size:12px;color:var(--text-muted);}\n\n@media (max-width:860px){\n  .m-scheme{padding:14px 12px;}\n  .m-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:'src' 'bus' 'bat' 'cons';gap:34px;}\n  .m-src{gap:34px;}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"en-page\">\n  <header>\n    <div class=\"en-eyebrow\">Вариант 2 · Мнемосхема<\/div>\n    <h1 class=\"en-h1\">Схема энергосистемы базы<\/h1>\n    <p class=\"en-sub\">Как энергия идёт от солнца через шину к потребителям и аккумуляторам: толщина и скорость потока показывают мощность. Нажмите на любой узел, чтобы увидеть его историю за час, сутки, неделю, месяц или три месяца.<\/p>\n  <\/header>\n  <div id=\"ctl\"><\/div>\n\n  <section class=\"m-scheme\" id=\"scheme\">\n    <svg class=\"m-flows\" id=\"flows\" aria-hidden=\"true\"><\/svg>\n    <div class=\"m-grid\">\n      <div class=\"m-src\">\n        <button type=\"button\" class=\"m-node m-sun\" id=\"nSun\" data-sel=\"solar\">\n          <div class=\"m-sunrow\">\n            <svg class=\"m-sunico\" viewBox=\"0 0 54 54\" aria-hidden=\"true\">\n              <g id=\"sunRays\" style=\"transform-origin:27px 27px;animation:m-spin 26s linear infinite\">\n                <path d=\"M27 3v8M27 43v8M3 27h8M43 27h8M10 10l5.7 5.7M38.3 38.3L44 44M44 10l-5.7 5.7M15.7 38.3L10 44\" stroke=\"#FFDD57\" stroke-width=\"3\" stroke-linecap=\"round\"/><\/g>\n              <circle id=\"sunDisc\" cx=\"27\" cy=\"27\" r=\"11\" fill=\"#FFDD57\"/>\n              <circle id=\"moonCut\" cx=\"32\" cy=\"23\" r=\"10\" fill=\"#0F1424\" opacity=\"0\"/>\n            <\/svg>\n            <div style=\"flex:1;min-width:0\"><div class=\"m-nh\" style=\"margin:0\"><h3>Солнце<\/h3><\/div>\n              <div class=\"m-big\" id=\"sunPct\">—<\/div><div class=\"m-of\" id=\"sunTxt\">—<\/div><\/div>\n          <\/div>\n        <\/button>\n        <button type=\"button\" class=\"m-node m-solar sel\" id=\"nSolar\" data-sel=\"solar\">\n          <div class=\"m-nh\"><h3>Солнечные панели<\/h3><span class=\"m-tag\" id=\"solCnt\">×—<\/span><\/div>\n          <div class=\"m-big\" id=\"solGen\">—<\/div><div class=\"m-of\" id=\"solOf\">—<\/div>\n          <div class=\"m-bar\"><i id=\"solBar\" style=\"width:0\"><\/i><\/div>\n          <div class=\"m-tiles\" id=\"solTiles\"><\/div>\n          <div class=\"m-line\"><span>Выработано за период<\/span><b id=\"solEn\">—<\/b><\/div>\n        <\/button>\n      <\/div>\n\n      <div class=\"m-bus\">\n        <button type=\"button\" class=\"m-node m-busn\" id=\"nBus\" data-sel=\"bus\" style=\"height:100%;display:flex;flex-direction:column;justify-content:center\">\n          <div class=\"m-nh\"><h3>Шина базы<\/h3><\/div>\n          <svg class=\"m-ring\" id=\"ring\" viewBox=\"0 0 118 118\" aria-hidden=\"true\">\n            <circle cx=\"59\" cy=\"59\" r=\"48\" fill=\"none\" stroke=\"#0B1022\" stroke-width=\"12\"/>\n            <circle id=\"ringArc\" cx=\"59\" cy=\"59\" r=\"48\" fill=\"none\" stroke=\"#4ADE9B\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90 59 59)\" stroke-dasharray=\"0 302\"/>\n            <text id=\"ringPct\" x=\"59\" y=\"58\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"500\">—<\/text>\n            <text x=\"59\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#9CA6C4\">обеспечено<\/text>\n          <\/svg>\n          <div class=\"m-line\"><span>Потребность<\/span><b id=\"busDem\">—<\/b><\/div>\n          <div class=\"m-line\"><span>Получено<\/span><b id=\"busSup\">—<\/b><\/div>\n          <div class=\"m-line\"><span>Выработка<\/span><b id=\"busGen\">—<\/b><\/div>\n          <div class=\"m-line\"><span>Акк. поток<\/span><b id=\"busFlow\">—<\/b><\/div>\n          <div class=\"m-line\"><span>Автономия<\/span><b id=\"busAuto\">—<\/b><\/div>\n          <div style=\"margin-top:8px;font-size:11.5px\" id=\"busState\"><\/div>\n        <\/button>\n      <\/div>\n\n      <div class=\"m-bat\">\n        <button type=\"button\" class=\"m-node m-batt\" id=\"nBat\" data-sel=\"batt\">\n          <div class=\"m-nh\"><h3>Аккумуляторы<\/h3><span class=\"m-tag\" id=\"batCnt\">×—<\/span><\/div>\n          <div class=\"m-batrow\">\n            <svg class=\"m-batico\" viewBox=\"0 0 52 78\" aria-hidden=\"true\">\n              <rect x=\"17\" y=\"1\" width=\"18\" height=\"6\" rx=\"2\" fill=\"#4B5680\"/>\n              <rect x=\"4\" y=\"7\" width=\"44\" height=\"68\" rx=\"6\" fill=\"#0B1022\" stroke=\"#4B5680\" stroke-width=\"2.5\"/>\n              <clipPath id=\"batClip\"><rect x=\"7\" y=\"10\" width=\"38\" height=\"62\" rx=\"3\"/><\/clipPath>\n              <rect id=\"batLevel\" x=\"7\" y=\"72\" width=\"38\" height=\"0\" fill=\"#4FD1E7\" clip-path=\"url(#batClip)\" opacity=\".9\"/>\n              <path id=\"batBolt\" d=\"M28 22 L16 44 H25 L21 62 L36 38 H27 Z\" fill=\"#fff\" opacity=\".85\"/>\n            <\/svg>\n            <div style=\"flex:1;min-width:0\"><div class=\"m-big\" id=\"batJ\">—<\/div><div class=\"m-of\" id=\"batOf\">—<\/div>\n              <div class=\"m-bar\"><i id=\"batBar\" style=\"width:0\"><\/i><\/div>\n              <div class=\"m-of\" id=\"batFlowTxt\">—<\/div><\/div>\n          <\/div>\n          <div class=\"m-line\" style=\"margin-top:6px\"><span>В кВт·ч<\/span><b id=\"batKwh\">—<\/b><\/div>\n        <\/button>\n        <button type=\"button\" class=\"m-node m-curt idle\" id=\"nCurt\" data-sel=\"curt\">\n          <div class=\"m-nh\"><h3>Сброс излишка<\/h3><span class=\"m-big\" style=\"font-size:15px\" id=\"curtV\">—<\/span><\/div>\n        <\/button>\n      <\/div>\n\n      <div class=\"m-cons\" id=\"cons\"><\/div>\n    <\/div>\n  <\/section>\n\n  <div id=\"periods\"><\/div>\n  <section class=\"m-hist\">\n    <div class=\"m-hh\"><h2 id=\"hTitle\">—<\/h2><p id=\"hSub\"><\/p><\/div>\n    <div class=\"en-legend\" id=\"hLegend\"><\/div>\n    <div id=\"hChart\"><\/div>\n    <div class=\"m-stats\" id=\"hStats\"><\/div>\n    <div class=\"m-hint\">Подсказка: наведите курсор на график — покажется точное значение и игровое время.<\/div>\n  <\/section>\n<\/div>\n\n<style>@keyframes m-spin{to{transform:rotate(360deg);}}<\/style>\n<script>/* Общий «движок» демо-страниц энергосистемы: физика базы, история на 90 суток, единицы, графики.\n *\n * Модель повторяет правила игры (js/core.js): солнечная панель даёт 10 ⚡ за цикл 60 с, установки\n * тратят power ⚡ за свой цикл, аккумулятор 400 ⚡, базовый запас 150 ⚡, а если энергии не хватает,\n * ВСЕ потребители сбавляют ход в одной и той же пропорции (powerFraction). Единица «⚡» здесь\n * считается 1 кВт·ч (KWH_PER_UNIT), поэтому 10 ⚡ за 60 с = 600 кВт, а ёмкость батареи = 400 кВт·ч.\n * В самой игре истории пока нет — при интеграции нужно писать такие же минутные срезы в state.\n */\n(function(root){\n'use strict';\n\nvar KWH_PER_UNIT=1, J_PER_KWH=3.6e6;\nvar DAY_MIN=1440, CAP_DAYS=90, CAP=CAP_DAYS*DAY_MIN, BUF=CAP+10*DAY_MIN;\nvar SOLAR_KW=600*KWH_PER_UNIT, BATTERY_KWH=400*KWH_PER_UNIT, BASE_KWH=150*KWH_PER_UNIT;\nvar OFFSET_MIN=10*60+30; // «сейчас» = 10:30 игрового дня: утро, аккумуляторы заряжаются\n\nvar CONSUMERS=[\n  {id:'iron',  name:'Железная руда', short:'Fe₂O₃', group:'mining', kw:72,    color:'#9FB0C8'},\n  {id:'copper',name:'Медная руда',   short:'Cu₂S',  group:'mining', kw:72,    color:'#E08A4B'},\n  {id:'coal',  name:'Уголь',         short:'C',     group:'mining', kw:60,    color:'#8B85A6'},\n  {id:'stone', name:'Камень',        short:'CaCO₃', group:'mining', kw:56.84, color:'#C2AD82'},\n  {id:'water', name:'Бурение воды',  short:'H₂O',   group:'drill',  kw:51.43, color:'#49B8F0'},\n  {id:'oil',   name:'Бурение нефти', short:'CxHy',  group:'drill',  kw:72,    color:'#B08D57'},\n  {id:'wheat', name:'Пшеница',       short:'Triticum',    group:'farm', kw:30,    color:'#E8D078'},\n  {id:'potato',name:'Картофель',     short:'Solanum tub.',group:'farm', kw:27.69, color:'#A9865B'},\n  {id:'corn',  name:'Кукуруза',      short:'Zea mays',    group:'farm', kw:31.3,  color:'#F0B93D'},\n  {id:'tomato',name:'Томаты',        short:'Solanum lyc.',group:'farm', kw:36,    color:'#E1503D'}\n];\nvar GROUPS=[\n  {id:'mining',name:'Горнодобыча',color:'#C9A227'},\n  {id:'drill', name:'Бурение',    color:'#49B8F0'},\n  {id:'farm',  name:'Фермы',      color:'#8CAF52'}\n];\nvar SCENARIOS={\n  start:{label:'Старт',         hint:'1 панель, без аккумуляторов', solar:1,  bat:0,   seed:11, growth:1,\n         cons:{iron:1,copper:1,water:1}},\n  mid:  {label:'Развитая база', hint:'12 панелей, 45 аккумуляторов',solar:12, bat:45,  seed:23, growth:1.15,\n         cons:{iron:6,copper:5,coal:4,stone:3,water:3,oil:3,wheat:3,potato:2,corn:2,tomato:2}},\n  big:  {label:'Промышленная',  hint:'60 панелей, 200 аккумуляторов',solar:60, bat:200, seed:37, growth:1.15,\n         cons:{iron:30,copper:25,coal:20,stone:15,water:15,oil:15,wheat:15,potato:10,corn:10,tomato:10}}\n};\nvar PERIODS=[\n  {id:'h1', label:'1 час',    phrase:'за последний час',   min:60,     bin:1},\n  {id:'d1', label:'Сутки',    phrase:'за последние сутки', min:1440,   bin:10},\n  {id:'d7', label:'Неделя',   phrase:'за неделю',          min:10080,  bin:60},\n  {id:'d30',label:'Месяц',    phrase:'за месяц',           min:43200,  bin:240},\n  {id:'d90',label:'3 месяца', phrase:'за 3 месяца',        min:129600, bin:720}\n];\nvar PMAP={}; PERIODS.forEach(function(p){ PMAP[p.id]=p; });\n\nvar SKEYS=['gen','curtail','demand','supply','flow','stored','nameplate','capKWh'].concat(CONSUMERS.map(function(c){return c.id;}));\nvar K=SKEYS.length, KI={}; SKEYS.forEach(function(k,i){ KI[k]=i; });\n// Виртуальные ряды: сумма (с весами) настоящих рядов.\nvar VIRT={\n  g_mining:CONSUMERS.filter(function(c){return c.group==='mining';}).map(function(c){return c.id;}),\n  g_drill: CONSUMERS.filter(function(c){return c.group==='drill';}).map(function(c){return c.id;}),\n  g_farm:  CONSUMERS.filter(function(c){return c.group==='farm';}).map(function(c){return c.id;}),\n  unmet:[['demand',1],['supply',-1]],\n  balance:[['gen',1],['demand',-1]],\n  used:[['gen',1],['curtail',-1]]\n};\n\nvar EN={\n  KWH_PER_UNIT:KWH_PER_UNIT, J_PER_KWH:J_PER_KWH, SOLAR_KW:SOLAR_KW, BATTERY_KWH:BATTERY_KWH, BASE_KWH:BASE_KWH,\n  CONSUMERS:CONSUMERS, GROUPS:GROUPS, SCENARIOS:SCENARIOS, PERIODS:PERIODS, PMAP:PMAP, CAP:CAP, DAY_MIN:DAY_MIN,\n  period:'d1', speed:600, scenario:'mid', cur:{}, counts:{}, paused:false\n};\n\n/* ---------- события ---------- */\nvar handlers={};\nEN.on=function(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); };\nfunction emit(ev,a){ (handlers[ev]||[]).forEach(function(f){ f(a); }); }\n\n/* ---------- физика ---------- */\nvar S={}; SKEYS.forEach(function(k){ S[k]=new Float32Array(BUF); });\nvar st={}, SC=null, P=new Float64Array(K), dem=new Float64Array(CONSUMERS.length);\n\nfunction mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\nfunction sunFactor(clockSec){\n  var t=clockSec%86400;\n  if(t<21600||t>72000) return 0;\n  return Math.sin((t-21600)/50400*Math.PI);\n}\nEN.sunFactor=sunFactor;\n\nfunction countsFor(dayIdx){\n  var g=Math.pow(Math.min(1,Math.max(0,dayIdx/CAP_DAYS)),SC.growth||1.15), n={};\n  n.solar=Math.max(1,Math.ceil(SC.solar*g));\n  n.bat=SC.bat>0?Math.ceil(SC.bat*Math.min(1,g*1.08)):0;\n  CONSUMERS.forEach(function(c){ var f=SC.cons[c.id]||0; n[c.id]=f?Math.ceil(f*g):0; });\n  return n;\n}\nfunction rollDuty(){\n  for(var i=0;i<CONSUMERS.length;i++){\n    var r=st.rng();\n    st.duty[i]= r<.68?1: r<.83?.85: r<.93?.6: r<.98?.3: 0; // доля установок группы, реально работающих в этот час\n  }\n}\nfunction prep(){\n  var a=Math.floor((st.secs+OFFSET_MIN*60)/3600);\n  if(a!==st.hr){ st.hr=a; rollDuty(); }\n  var d=Math.floor((st.secs+OFFSET_MIN*60)/86400);\n  if(d!==st.dy){ st.dy=d; st.counts=countsFor(d); EN.counts=st.counts; }\n}\nfunction physics(dt){\n  var clock=(st.secs+OFFSET_MIN*60)%86400, sun=sunFactor(clock), n=st.counts;\n  var gen=n.solar*SOLAR_KW*sun, np=n.solar*SOLAR_KW, D=0, i;\n  for(i=0;i<CONSUMERS.length;i++){ dem[i]=n[CONSUMERS[i].id]*CONSUMERS[i].kw*st.duty[i]; D+=dem[i]; }\n  var cap=BASE_KWH+n.bat*BATTERY_KWH;\n  var avail=st.stored+gen*dt/3600, need=D*dt/3600;\n  var frac=need>1e-12?Math.min(1,avail/need):1;\n  var left=avail-need*frac, ns=Math.min(cap,left), spill=left-ns;\n  P[0]=gen; P[1]=spill*3600/dt; P[2]=D; P[3]=D*frac; P[4]=(ns-st.stored)*3600/dt; P[5]=ns; P[6]=np; P[7]=cap;\n  for(i=0;i<CONSUMERS.length;i++) P[8+i]=dem[i]*frac;\n  st.stored=ns; st.frac=frac; st.sun=sun; st.clock=clock;\n  var c=EN.cur;\n  c.sun=sun; c.gen=gen; c.nameplate=np; c.curtail=P[1]; c.demand=D; c.supply=P[3]; c.frac=frac; c.flow=P[4];\n  c.stored=ns; c.cap=cap; c.pct=cap>0?ns/cap*100:0; c.clock=clock; c.secs=st.secs; c.day=Math.floor((st.secs+OFFSET_MIN*60)/86400)+1;\n  c.cons=c.cons||{};\n  for(i=0;i<CONSUMERS.length;i++){ c.cons[CONSUMERS[i].id]=P[8+i]; }\n  c.duty=st.duty;\n}\nfunction accumulate(dt){ for(var k=0;k<K;k++) st.A[k]+=P[k]*dt; st.acc+=dt; }\nfunction shiftBuffer(){\n  var drop=BUF-CAP;\n  SKEYS.forEach(function(k){ S[k].copyWithin(0,drop,BUF); });\n  st.base+=drop; st.w=CAP;\n}\nfunction commit(){\n  var i=st.w, k;\n  for(k=0;k<K;k++){ S[SKEYS[k]][i]=st.A[k]/st.acc; st.A[k]=0; }\n  st.acc=0; st.w++; st.tMin++; st.dirty=true;\n  if(st.w>=BUF) shiftBuffer();\n}\nfunction advance(dtGame){\n  var remain=dtGame;\n  while(remain>1e-9){\n    prep();\n    var dt=Math.min(remain,60-st.acc,15);\n    if(dt<1e-6) dt=Math.min(remain,60-st.acc);\n    physics(dt); accumulate(dt);\n    st.secs+=dt; remain-=dt;\n    if(st.acc>=60-1e-7) commit();\n  }\n}\n\nEN.load=function(name){\n  SC=SCENARIOS[name]||SCENARIOS.mid; EN.scenario=SCENARIOS[name]?name:'mid';\n  st={secs:0,acc:0,A:new Float64Array(K),w:0,base:0,tMin:0,hr:-1,dy:-1,rng:mulberry(SC.seed),duty:new Array(CONSUMERS.length).fill(1),\n      counts:{},stored:0,dirty:false};\n  prep(); st.stored=(BASE_KWH+st.counts.bat*BATTERY_KWH)*0.5;\n  for(var m=0;m<CAP;m++){ prep(); physics(60); accumulate(60); st.secs+=60; commit(); }\n  st.dirty=false;\n  prep(); physics(1e-3); // актуальные «текущие» значения\n  emit('reset'); emit('data');\n};\nEN.setSpeed=function(v){ EN.speed=v; emit('speed'); };\nEN.setPeriod=function(id){ if(!PMAP[id]) return; EN.period=id; emit('period'); };\n\nvar lastTs=0;\nEN.run=function(){\n  function f(ts){\n    var dtR=lastTs?Math.min(0.25,(ts-lastTs)/1000):0; lastTs=ts;\n    if(EN.speed>0){ advance(dtR*EN.speed); }\n    if(st.dirty){ st.dirty=false; emit('data'); }\n    emit('frame',dtR);\n    root.requestAnimationFrame(f);\n  }\n  root.requestAnimationFrame(f);\n};\n\n/* ---------- чтение истории ---------- */\nfunction members(k){ var v=VIRT[k]; if(!v) return [[k,1]]; return v.map(function(m){ return typeof m==='string'?[m,1]:m; }); }\n// Ряды по бинам за период. mode: mean | energy (кВт·ч за бин) | max | min | last\nEN.series=function(keys,pid,mode,offsetMin){\n  var pp=PMAP[pid], n=pp.min/pp.bin, off=offsetMin||0, start=st.w-pp.min-off, out={n:n,bin:pp.bin,t0:st.tMin-pp.min-off,keys:{}};\n  mode=mode||'mean';\n  keys.forEach(function(key){\n    var ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), arr=new Float64Array(n);\n    for(var b=0;b<n;b++){\n      var s=start+b*pp.bin, acc=0, mx=-Infinity, mn=Infinity, v=0;\n      for(var i=0;i<pp.bin;i++){\n        v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n        acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n      }\n      arr[b]= mode==='mean'?acc/pp.bin : mode==='energy'?acc/60 : mode==='max'?mx : mode==='min'?mn : v;\n    }\n    out.keys[key]=arr;\n  });\n  return out;\n};\n// Итоги по ряду за период: mean/max/min (кВт или кВт·ч для stored) и sum (кВт·ч).\nEN.stat=function(key,pid,offsetMin){\n  var pp=PMAP[pid], ms=members(key).map(function(m){ return [S[m[0]],m[1]]; }), off=offsetMin||0, s=st.w-pp.min-off, acc=0, mx=-Infinity, mn=Infinity;\n  for(var i=0;i<pp.min;i++){\n    var v=0; for(var q=0;q<ms.length;q++) v+=ms[q][0][s+i]*ms[q][1];\n    acc+=v; if(v>mx) mx=v; if(v<mn) mn=v;\n  }\n  return {mean:acc/pp.min, max:mx, min:mn, sum:acc/60, first:valueAt(key,s), last:valueAt(key,s+pp.min-1)};\n};\nfunction valueAt(key,idx){ var v=0; members(key).forEach(function(m){ v+=S[m[0]][idx]*m[1]; }); return v; }\nEN.deficitMinutes=function(pid,offsetMin){\n  var pp=PM 1e3,'кДж'],[1e6,'МДж'],[1e9,'ГДж'],[1e12,'ТДж']];    // база: Дж\nfunction digitsFor(a){ return a>=100?0:a>=10?1:2; }\nfunction pickScale(sc,v,def){\n  var a=Math.abs(v), i=def;\n  if(a>0){ i=0; for(var k=0;k<sc.length;k++) if(a>=sc[k][0]) i=k; }\n  var num=a/sc[i][0];\n  if(Number(num.toFixed(digitsFor(num)))>=1000 && i<sc.length-1) i++;\n  return i;\n}\nfunction fmtBy(sc,v,def){\n  if(Math.abs(v)<1e-9) v=0;\n  var i=pickScale(sc,v,def), x=v/sc[i][0], d=digitsFor(Math.abs(x));\n  var num=(v===0||Number(x.toFixed(d))===0?'0':x.toFixed(d));\n  return {num:num,unit:sc[i][1],text:num+' '+sc[i][1],scale:sc[i][0],idx:i};\n}\nEN.fmt={\n  power:function(kw){ return fmtBy(PSC,kw,1); },\n  energy:function(kwh){ return fmtBy(ESC,kwh,1); },\n  joule:function(j){ return fmtBy(JSC,j,2); },\n  stored:function(kwh){ return fmtBy(JSC,kwh*J_PER_KWH,2); },\n  pct:function(p,d){ return (p).toFixed(d==null?0:d)+'%'; },\n  sign:function(o,plus){ return (o.num!=='0'&&plus&&parseFloat(o.num)>0?'+':'')+o.text; },\n  dur:function(h){\n    if(!isFinite(h)||h<0) return '—';\n    var m=Math.round(h*60);\n    if(m<1) return 'меньше минуты';\n    if(m<60) return m+' м';\n    if(m<1440) return Math.floor(m/60)+' ч'+(m%60?' '+(m%60)+' м':'');\n    return Math.floor(m/1440)+' д'+(Math.floor((m%1440)/60)?' '+Math.floor((m%1440)/60)+' ч':'');\n  }\n};\n// Шкала для осей: по максимуму подбираем единицу, дальше красивые шаги в ней.\nEN.axis=function(unit,max){\n  var sc= unit==='power'?PSC : unit==='energy'?ESC : unit==='joule'?JSC : null;\n  if(unit==='pct') return {div:1,unit:'%',ticks:niceTicks(max,1)};\n  var i=pickScale(sc,max,unit==='joule'?2:1), div=sc[i][0];\n  return {div:div,unit:sc[i][1],ticks:niceTicks(max/div,div)};\n};\nfunction niceTicks(maxD,div){\n  var mx=Math.max(maxD,1e-9), e=Math.pow(10,Math.floor(Math.log10(mx)))/10, c=[1,2,2.5,5,10,20,25,50,100], best=e, i;\n  for(i=0;i<c.length;i++){ best=c[i]*e; if(mx/best<=5) break; }\n  var cnt=Math.max(1,Math.ceil(mx/best-1e-9)), out=[];\n
