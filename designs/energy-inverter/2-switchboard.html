<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Распределительный щит</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="inv-base.css">
<style>
/* Вариант 2 · «Распределительный щит»: шкаф с вводными приборами, стоечный инвертор,
   медная шина и автоматы потребителей. Металл, янтарные ЖК-табло, светодиоды. */
:root{
  --v-bg:#0B0C10;--v-card:#1A1D24;--v-panel:#15171D;--v-line:#2B2F3A;--v-line2:#3D4352;
  --v-accent:#FFB547;--v-accent2:#FFB547;--v-radius:6px;
  --v-pop:linear-gradient(180deg,#22262F,#171A21);
  --lcd:#FFB547;--lcd-bg:#160F05;--metal:linear-gradient(180deg,#252932,#1A1D24 40%,#16191F);
  --brush:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
}
body{background:radial-gradient(80% 50% at 50% 0%,#1A1D26,#0B0C10 70%);}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--v-mute);}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.06em;text-transform:uppercase;color:#F1E6D2;}
.sub{margin:4px 0 0;color:var(--v-dim);font-size:13px;max-width:72ch;}

/* шкаф */
.cab{position:relative;border-radius:14px;padding:22px;background:var(--brush),linear-gradient(180deg,#1C1F27,#121419);border:1px solid #2E3340;
  box-shadow:inset 0 0 0 6px #101217,inset 0 0 0 7px #2A2E39,0 30px 80px rgba(0,0,0,.5);}
.cab-grid{position:relative;z-index:2;display:flex;flex-direction:column;gap:42px;}
#fl{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}
.fl-base{opacity:1!important;stroke:#07080B!important;}
.fl-base.on{stroke:#0C0E12!important;}
.fl-dash{filter:drop-shadow(0 0 3px currentColor);}
.row-lbl{position:absolute;left:0;top:-19px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.24em;color:#6C7386;text-transform:uppercase;}

.plate{position:relative;background:var(--brush),var(--metal);border:1px solid #333845;border-radius:6px;padding:10px 12px 11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.4);}
.plate::before,.plate::after{content:'';position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7A8091,#2A2E38);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);}
.plate::before{left:6px;} .plate::after{right:6px;}
.lbl{display:flex;align-items:center;gap:6px;margin:0 8px 8px;}
.lbl h3{margin:0;flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#C9CED9;
  padding:3px 6px;background:#0E1014;border:1px solid #2A2E39;border-radius:3px;text-align:center;line-height:1.2;overflow-wrap:anywhere;}
.lcd{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--lcd);background:var(--lcd-bg);border:1px solid #3A2A10;border-radius:4px;padding:5px 8px;
  text-shadow:0 0 8px rgba(255,181,71,.55);box-shadow:inset 0 2px 8px rgba(0,0,0,.8);white-space:nowrap;}
.lcd.big{font-size:22px;line-height:1.15;}
.lcd small{font-size:11px;opacity:.7;margin-left:4px;}
.cap{font-family:var(--font-mono);font-size:11px;color:#8A91A4;margin-top:6px;}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#8A91A4;margin-top:4px;}
.kv b{font-family:var(--font-mono);font-weight:500;color:#E3E6EE;}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2A2E38;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);flex-shrink:0;}
.led.on{background:var(--lc,#4ADE9B);box-shadow:0 0 8px var(--lc,#4ADE9B),inset 0 -1px 2px rgba(0,0,0,.3);}

/* ряд ввода */
.inputs{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.gauge{display:block;width:100%;max-width:180px;height:auto;margin:0 auto 4px;}
.needle{transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-origin:60px 58px;}
.blank{opacity:.6;background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 8px,transparent 8px 16px),var(--metal);}
.blank .lcd{color:#5B5F6B;text-shadow:none;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10px,1fr));gap:2px;margin-top:7px;}
.tiles i{aspect-ratio:1.3;background:#2A3350;border:1px solid #3B4870;border-radius:1px;position:relative;}
.tiles i::after{content:'';position:absolute;inset:0;background:#FFDD57;opacity:var(--to,1);transition:opacity .5s;}
#nSun .pop-sun{width:min(400px,92vw);}

/* инвертор */
.inv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:16px 18px 16px;}
.inv-name{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.inv-name h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#F1E6D2;}
.inv-name span{font-family:var(--font-mono);font-size:11px;color:#6C7386;border:1px solid #333845;border-radius:3px;padding:1px 6px;}
.vent{flex:1;height:14px;background:repeating-linear-gradient(90deg,#0B0C10 0 4px,transparent 4px 9px);border-radius:2px;opacity:.8;}
.main-lcd{display:flex;align-items:center;gap:16px;padding:12px 14px;}
.main-lcd .pct{font-size:44px;line-height:1;}
.main-lcd .pct-l{font-family:var(--font-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B58334;}
.segbar{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;margin-top:10px;}
.segbar i{height:16px;border-radius:1px;background:#21170A;}
.segbar i.on{background:var(--sc,#FFB547);box-shadow:0 0 6px var(--sc,#FFB547);}
.modes{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
.mode{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5B5F6B;}
.mode.on{color:#E3E6EE;}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;}
.read span{display:block;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7D8498;margin-bottom:3px;}
.read .lcd{font-size:15px;}
.read.wide{grid-column:span 2;}

/* шина */
.bar-wrap{position:relative;margin-top:-20px;}
#nBar{position:relative;height:22px;border-radius:4px;background:linear-gradient(180deg,#F6B27A,#C46A2C 45%,#8A4519);box-shadow:0 0 0 1px #5A2C0E,0 6px 20px rgba(0,0,0,.6),0 0 24px rgba(224,138,75,.25);overflow:hidden;}
#nBar::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,240,200,.55),transparent) 0 0/180px 100% repeat-x;animation:shine var(--bar-dur,2s) linear infinite;mix-blend-mode:screen;}
@keyframes shine{to{background-position:180px 0;}}
#nBar b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-size:11.5px;letter-spacing:.22em;color:#3A1A06;white-space:nowrap;text-transform:uppercase;}
.bolts{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 10px;align-items:center;pointer-events:none;}
.bolts i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E7E9EF,#6A6F7C);box-shadow:0 0 0 1px rgba(0,0,0,.5);}

/* автоматы */
.outs{display:grid;grid-template-columns:repeat(var(--gn,4),minmax(140px,1fr)) minmax(220px,1.4fr) minmax(130px,.8fr);gap:14px;align-items:stretch;}
.brk{--nc:#FFB547;cursor:help;outline:none;display:flex;flex-direction:column;gap:8px;}
.brk:hover,.brk:focus-visible{border-color:var(--nc);}
.brk-top{display:flex;gap:10px;align-items:stretch;}
.lever{width:34px;height:64px;flex-shrink:0;}
.lever .hd{transition:transform .35s;}
.loadcol{position:relative;flex:1;border-radius:3px;background:#0E1014;border:1px solid #2A2E39;overflow:hidden;min-height:64px;}
.loadcol i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,color-mix(in srgb,var(--nc) 55%,#000),var(--nc));box-shadow:0 0 12px var(--nc);transition:height .4s;}
.loadcol::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.55) 6px 7px);}
.loadcol em{position:absolute;right:4px;top:3px;z-index:2;font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:#E3E6EE;text-shadow:0 1px 2px #000;}
.brk .gpop{top:calc(100% + 10px);left:0;transform:translateY(-6px);}
.brk:nth-last-of-type(-n+2) .gpop{left:auto;right:0;}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0 2px;}
.cells i{height:38px;border-radius:4px;background:#0E1014;border:1px solid #2A2E39;position:relative;overflow:hidden;}
.cells i::before{content:'';position:absolute;left:30%;right:30%;top:-1px;height:4px;background:#3D4352;border-radius:0 0 2px 2px;}
.cells i b{position:absolute;left:2px;right:2px;bottom:2px;border-radius:2px;background:linear-gradient(0deg,#1E9DB2,#7BE6F5);box-shadow:0 0 8px rgba(79,209,231,.6);transition:height .4s;}
.cells.low i b{background:linear-gradient(0deg,#A3304F,#F4557B);}
.res{display:flex;flex-direction:column;gap:8px;}
.coil{display:block;width:100%;height:56px;}
.coil path{transition:stroke .4s,filter .4s;}
.res.idle{opacity:.6;}

/* журнал — учётный блок */
.ledger{background:var(--brush),linear-gradient(180deg,#1A1D24,#121419);border:1px solid #2E3340;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.sec-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sec-h h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#F1E6D2;}
.sec-h .p-tabs{margin-left:auto;}
.p-tab{position:relative;border-radius:4px;background:linear-gradient(180deg,#2A2E38,#1C1F27);border:1px solid #3D4352;box-shadow:0 2px 0 #0B0C10;padding:7px 12px 7px 24px;color:#9AA1B4;}
.p-tab::before{content:'';position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#3A3F4B;}
.p-tab.active{background:linear-gradient(180deg,#22262F,#1A1D24);color:#FFE2B0;border-color:#5C4A2A;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);transform:translateY(1px);}
.p-tab.active::before{background:#FFB547;box-shadow:0 0 8px #FFB547;}
.live{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#8A91A4;}
.live b{font-family:var(--font-mono);font-weight:500;color:#FFB547;}
.cov{font-size:11.5px;color:#6C7386;} .cov:empty{display:none;}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.kpi{padding:9px 10px 10px;}
.kpi .lbl{margin:0 8px 6px;}
.kpi .lbl h3{text-align:left;}
.kpi .lcd{font-size:19px;color:var(--kc);text-shadow:0 0 10px color-mix(in srgb,var(--kc) 60%,transparent);}
.kpi .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .j-d{margin-top:2px;}
.d-wrap{border-radius:10px;background:var(--brush),linear-gradient(180deg,#1A1D24,#121419);}

@media (max-width:1100px){ .outs{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));} .inv{grid-template-columns:1fr;} }
@media (max-width:760px){ #fl{display:none;} .cab{padding:14px;} .cab-grid{gap:30px;} .main-lcd .pct{font-size:34px;} .reads{grid-template-columns:1fr 1fr;} .brk .gpop{left:0!important;right:auto!important;} }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html">← Все варианты</a>
  <header>
    <div class="eyebrow">Индустриальный пояс · Энергия · Вариант 2</div>
    <h1>Распределительный щит</h1>
    <p class="sub">Энергосистема как настоящий шкаф: вводные приборы сверху, стоечный инвертор, медная шина и автоматы потребителей. Табло светятся, стрелки двигаются, по кабелям бежит ток.</p>
  </header>
  <div id="invCtl"></div>
  <div id="app"></div>
</div>
<script src="inv-core.js"></script>
<script>
(function(){
var I=INV, L=null;
var stCol={ok:'#4ADE9B',sag:'#FFB547',black:'#F4557B'};
function gauge(p,color,id){
  var ticks=''; for(var i=0;i<=10;i++){ var a=Math.PI*(1-i/10), r1=46, r2=i%5?42:38;
    ticks+='<line x1="'+(60+r1*Math.cos(a)).toFixed(1)+'" y1="'+(58-r1*Math.sin(a)).toFixed(1)+'" x2="'+(60+r2*Math.cos(a)).toFixed(1)+'" y2="'+(58-r2*Math.sin(a)).toFixed(1)+'" stroke="#6C7386" stroke-width="'+(i%5?1:1.6)+'"/>'; }
  var deg=-90+180*Math.max(0,Math.min(1,p/100));
  return '<svg class="gauge" viewBox="0 0 120 68" aria-hidden="true"><path d="M10 58 A50 50 0 0 1 110 58" fill="#0E1014" stroke="#2A2E39"/>'+
    '<path d="M14 58 A46 46 0 0 1 106 58" fill="none" stroke="'+color+'" stroke-opacity=".18" stroke-width="5"/>'+
    '<path d="M86 21 A46 46 0 0 1 106 58" fill="none" stroke="'+color+'" stroke-opacity=".7" stroke-width="5"/>'+ticks+
    '<g class="needle" data-live="'+id+'" style="transform:rotate('+deg.toFixed(1)+'deg)"><line x1="60" y1="58" x2="60" y2="18" stroke="#FFE2B0" stroke-width="1.8" stroke-linecap="round" style="filter:drop-shadow(0 0 3px '+color+')"/></g>'+
    '<circle cx="60" cy="58" r="5" fill="#3D4352" stroke="#7A8091"/></svg>';
}
function sun(c){
  return '<div class="plate" id="nSun"><div class="lbl"><span class="led'+(c.day?' on':'')+'" data-live-class="sunLed" style="--lc:#FFDD57"></span><h3>Солнце</h3>'+I.infoBtn('sun')+'</div>'+
    gauge(c.sun*100,'#FFDD57','sunN')+'<div class="lcd big" data-live="sunPct">'+Math.round(c.sun*100)+'%<small>'+(c.day?'день':'ночь')+'</small></div>'+
    '<div class="cap" data-live="sunTxt">освещённость · '+c.clock+'</div>'+I.sunPopHtml()+'</div>';
}
function gen(g,c){
  var k='g_'+g.id, extra='';
  if(g.isSolar){ var t=''; for(var i=0;i<Math.min(g.count,40);i++) t+='<i></i>';
    extra='<div class="tiles" data-live="'+k+'_t" style="--to:'+(0.1+0.9*c.sun).toFixed(2)+'">'+t+'</div><div class="kv"><span>Прогноз на сутки</span><b data-live="'+k+'_d">'+I.kwh(g.daily)+'</b></div>'; }
  else extra='<div class="kv"><span>Работает</span><b data-live="'+k+'_u">'+Math.round(g.pct)+'%</b></div>';
  return '<div class="plate" id="nGen-'+g.id+'"><div class="lbl"><span class="led'+(g.now>0?' on':'')+'" data-live-class="'+k+'_l" style="--lc:'+g.color+'"></span><h3>'+g.title+' ×'+g.count+'</h3>'+(g.isSolar?I.infoBtn('gen',g.id):'')+'</div>'+
    gauge(g.pct,g.color,k+'_n')+'<div class="lcd big" data-live="'+k+'_v">'+I.kw(g.now)+'</div><div class="cap" data-live="'+k+'_o">из '+I.kw(g.nameplate)+' установленных</div>'+extra+I.genPopHtml(g)+'</div>';
}
function plan(p){
  return '<div class="plate blank" id="nPlan-'+p.id+'"><div class="lbl"><span class="led"></span><h3>'+p.title+'</h3></div>'+gauge(0,p.color,'pl_'+p.id)+
    '<div class="lcd big">'+I.kw(0)+'</div><div class="cap">'+p.kind+' · '+p.note+'</div></div>';
}
function inv(c){
  var col=stCol[c.state], N=40, lit=Math.round(c.frac*N), seg='';
  for(var i=0;i<N;i++) seg+='<i'+(i<lit?' class="on"':'')+'></i>';
  var pct=c.frac*100;
  return '<div class="plate inv" id="nInv"><div>'+
      '<div class="inv-name"><h2>Инвертор</h2><span>ИНВ-1 · шина базы</span><div class="vent"></div></div>'+
      '<div class="lcd main-lcd"><div><div class="pct" data-live="iPct" style="color:'+col+';text-shadow:0 0 14px '+col+'">'+(pct<99.5&&pct>0?pct.toFixed(1):Math.round(pct))+'%</div><div class="pct-l">обеспечено</div></div>'+
        '<div style="flex:1;min-width:0"><div class="segbar" data-live="iSeg" style="--sc:'+col+'">'+seg+'</div></div></div>'+
      '<div class="modes" data-live="iModes">'+[['ok','Норма'],['sag','Просадка'],['black','Блэкаут']].map(function(m){ var on=c.state===m[0]; return '<span class="mode'+(on?' on':'')+'"><span class="led'+(on?' on':'')+'" style="--lc:'+stCol[m[0]]+'"></span>'+m[1]+'</span>'; }).join('')+'</div>'+
    '</div><div class="reads">'+
      '<div class="read"><span>Потребность</span><div class="lcd" data-live="iDem">'+I.kw(c.demand)+'</div></div>'+
      '<div class="read"><span>Получено</span><div class="lcd" data-live="iSup">'+I.kw(c.supply)+'</div></div>'+
      '<div class="read"><span>Выработка</span><div class="lcd" data-live="iGen">'+I.kw(c.gen)+'</div></div>'+
      '<div class="read"><span>Акк. поток</span><div class="lcd" data-live="iFlow">'+c.flowSigned+'</div></div>'+
      '<div class="read wide"><span>Автономия на аккумуляторах</span><div class="lcd" data-live="iAuto">'+c.autonomy+'</div></div>'+
    '</div></div>';
}
function brk(g){
  var on=g.sum>0.01, ang=on?-28:28;
  return '<div class="plate brk has-gpop" tabindex="0" id="nGrp-'+g.id+'" style="--nc:'+g.color+'" aria-describedby="gpop-'+g.id+'">'+
    '<div class="lbl" style="margin-bottom:0"><span class="led'+(on?' on':'')+'" data-live-class="gled_'+g.id+'" style="--lc:'+g.color+'"></span><h3>'+g.name+'</h3></div>'+
    '<div class="brk-top"><svg class="lever" viewBox="0 0 34 64" aria-hidden="true"><rect x="3" y="2" width="28" height="60" rx="4" fill="#0E1014" stroke="#2A2E39"/><rect x="13" y="10" width="8" height="44" rx="3" fill="#07080B"/>'+
      '<g class="hd" data-live="glev_'+g.id+'" style="transform:translateY('+(on?-10:10)+'px)"><rect x="8" y="26" width="18" height="12" rx="3" fill="'+g.color+'" stroke="rgba(0,0,0,.5)"/><rect x="10" y="28" width="14" height="2" rx="1" fill="rgba(255,255,255,.4)"/></g>'+
      '<text x="17" y="8" text-anchor="middle" font-size="5.5" fill="#6C7386" font-family="IBM Plex Mono">ВКЛ</text></svg>'+
      '<div class="loadcol"><i data-live="gb_'+g.id+'" style="height:'+g.load.toFixed(0)+'%"></i><em data-live="gl_'+g.id+'">'+Math.round(g.load)+'%</em></div></div>'+
    '<div class="lcd" data-live="gv_'+g.id+'" style="font-size:16px">'+I.kw(g.sum)+'</div>'+
    '<div class="cap" style="margin:0">'+g.kinds+' '+I.plural(g.kinds,'вид','вида','видов')+' · '+g.units+' '+I.plural(g.units,'установка','установки','установок')+'</div>'+I.groupPop(g)+'</div>';
}
function batt(c){
  var cells=''; for(var i=0;i<5;i++){ var f=Math.max(0,Math.min(1,c.pct/20-i)); cells+='<i><b style="height:calc('+(f*100).toFixed(0)+'% - 4px)"></b></i>'; }
  return '<div class="plate" id="nBat"><div class="lbl"><span class="led'+(Math.abs(c.flow)>0.01?' on':'')+'" data-live-class="bLed" style="--lc:'+(c.flow<0?'#FFB547':'#4FD1E7')+'"></span><h3>Аккумуляторы '+(c.batteries?'×'+c.batteries:'· базовый блок')+'</h3></div>'+
    '<div class="lcd big" data-live="bJ" style="color:#7BE6F5;text-shadow:0 0 10px rgba(79,209,231,.6)">'+I.J(c.stored)+'<small>'+I.kwh(c.stored)+'</small></div>'+
    '<div class="cap" data-live="bOf">из '+I.J(c.cap)+' ('+I.kwh(c.cap)+')</div>'+
    '<div class="cells'+(c.pct<15?' low':'')+'" data-live="bCells">'+cells+'</div><div class="cap" data-live="bFlow">'+c.flowTxt+'</div></div>';
}
function res(c){
  var on=c.curtail>0.01, col=on?'#FF7A3D':'#4A4F5C';
  return '<div class="plate res'+(on?'':' idle')+'" data-live-class="resC" id="nCurt"><div class="lbl" style="margin-bottom:0"><span class="led'+(on?' on':'')+'" data-live-class="resLed" style="--lc:#FF7A3D"></span><h3>Сброс излишка</h3></div>'+
    '<svg class="coil" viewBox="0 0 120 56" aria-hidden="true"><path data-live="resPath" d="M4 28 H22 L28 12 L38 44 L48 12 L58 44 L68 12 L78 44 L88 12 L94 28 H116" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" style="filter:'+(on?'drop-shadow(0 0 6px #FF7A3D)':'none')+'"/></svg>'+
    '<div class="lcd" data-live="curtV" style="font-size:15px">'+(on?I.kw(c.curtail):'нет')+'</div><div class="cap" style="margin:0">тепловой резистор</div></div>';
}
function journal(c){
  var jv=I.journal(I.UI.period);
  return '<section class="ledger"><div class="sec-h"><h2>Учётный блок</h2><div class="p-tabs">'+I.periodTabs('data-en-period',I.UI.period)+'</div></div>'+
    '<div class="live" data-live="jLive"><span>Сейчас: выработка <b>'+I.kw(c.gen)+'</b></span><span>нагрузка <b>'+I.kw(c.demand)+'</b></span><span>обеспечено <b>'+Math.round(c.frac*100)+'%</b></span><span>заряд <b>'+I.J(c.stored)+'</b></span></div>'+
    '<div class="cov" data-live="jCov">'+jv.covNote+'</div>'+
    '<div class="kpis">'+jv.list.map(function(k){
      return '<div class="plate kpi" style="--kc:'+k.color+'" data-live="k_'+k.id+'"><div class="lbl"><span class="led on" style="--lc:'+k.color+'"></span><h3>'+k.l+'</h3><button type="button" class="i-btn" data-kpi-chart="'+k.id+'" title="График: '+k.l.toLowerCase()+'">i</button></div>'+
        '<div class="lcd">'+k.v+'</div><div class="cap">'+k.s+'</div>'+I.deltaHtml(k.d)+'</div>'; }).join('')+'</div></section>';
}
function render(c){
  return '<section class="cab" id="scheme"><svg id="fl" aria-hidden="true"></svg><div class="cab-grid">'+
    '<div class="inputs"><span class="row-lbl">Ввод</span>'+sun(c)+c.gens.map(function(g){ return gen(g,c); }).join('')+I.PLANNED.map(plan).join('')+'</div>'+
    inv(c)+
    '<div class="bar-wrap"><div id="nBar"><div class="bolts"><i></i><i></i><i></i><i></i><i></i><i></i></div><b data-live="barT">Шина распределения · '+I.kw(c.supply)+'</b></div></div>'+
    '<div class="outs" style="--gn:'+Math.max(1,c.groups.length)+'"><span class="row-lbl" style="top:-30px;left:0;position:relative;display:none"></span>'+
      c.groups.map(brk).join('')+batt(c)+res(c)+'</div>'+
  '</div></section>'+journal(c)+'<section class="d-wrap"><table class="d-table" data-live="tbl">'+I.tableRows(c)+'</table></section>';
}
function build(c){
  L=new I.FlowLayer(document.getElementById('fl'),document.getElementById('scheme'),{style:function(f,i,on,w){
    f.base.setAttribute('stroke-width',w+7); f.dash.setAttribute('stroke-width',Math.max(2,w*0.55)); f.dash.style.opacity=on?'1':'0'; f.dash.style.strokeDasharray='5 8'; }});
  I.stdFlows(L,{sun:'nSun',gen:function(id){ return 'nGen-'+id; },busIn:'nInv',busOut:'nBar',admin:'nPlan-admin',genset:'nPlan-genset',bat:'nBat',curt:'nCurt',grp:function(id){ return 'nGrp-'+id; }},c);
}
function tick(c){
  if(L) L.update(c);
  var bar=document.getElementById('nBar'); if(bar){ var load=c.installed>0?c.supply/c.installed:0; bar.style.setProperty('--bar-dur',(c.supply>0.01?Math.max(.5,2.6-2*load):60).toFixed(2)+'s'); }
}
I.start({root:document.getElementById('app'),render:render,build:build,tick:tick,layout:function(){ if(L) L.layout(); }});
})();
</script>
</body>
</html>
